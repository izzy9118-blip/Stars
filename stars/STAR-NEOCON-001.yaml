star_id: STAR-NEOCON-001
name: American neoconservatism
status: FACT

fact: >-
  American neoconservatism is a historical intellectual and political movement
  that developed through several overlapping generations and independent streams.
  It began substantially among anti-Stalinist and Cold War liberal intellectuals
  concerned with domestic liberalism and culture, whose break with the New Left
  increasingly joined anti-Communism to Zionism and the defense of Israel. It
  acquired a distinct Washington foreign-policy arm in the 1970s and was
  reformulated after the Cold War around a more explicitly interventionist program
  of American global leadership. Across these transformations, Zionism remained a
  defining commitment of the movement. No single thinker, person, school,
  institution, or lineage exhausts it.

shape:
  model: NETWORK
  rules:
    - A person may carry multiple independent influences.
    - Distinct streams may intersect without becoming branches of one another.
    - Connection does not establish exclusive causation.
    - Membership, influence, alliance, employment, and intellectual descent are different relations.
    - A coalition partner is not automatically a neoconservative.
    - Except for constitutive commitments explicitly identified below, a position documented in one generation is not automatically universal.

movement_definition:
  constitutive_commitments:
    zionism:
      status: CONSTITUTIVE
      meaning: >-
        Commitment to the continued existence and security of Israel as a Jewish
        state.
      classification_rule: >-
        Zionism is part of the definition of neoconservatism in this Star, not an
        optional preference or merely a recurring coalition position. A person may
        share other neoconservative ideas, networks, or policies but is not
        classified here as a neoconservative without evidence of this commitment.
      evidentiary_boundaries:
        - Jewish identity alone is not evidence of Zionism.
        - >-
          The commitment does not require identical views about every Israeli
          government, border, settlement, war, or peace proposal.
        - >-
          The commitment does not establish that Israel was the movement's only
          concern or that a participant acted as an agent of an Israeli government.
      evidence:
        - SRC-HUMMEL-ISRAEL-RISE-NEOCONS-2010
        - SRC-PODHORETZ-COMMENTARY-1996
        - SRC-KRISTOL-NEOCONSERVATIVE-PERSUASION-2003
        - SRC-KAGAN-KRISTOL-GREEN-LIGHT-2001
        - SRC-NEOCON-BUSH-ISRAEL-LETTER-2002

historical_spectrum:
  first_age_domestic_and_intellectual:
    period: "1960s to early 1970s"
    facts:
      - >-
        The earliest group commonly labeled neoconservative consisted largely of
        New York intellectuals and social scientists who still understood
        themselves as liberals or former radicals and who criticized the New Left,
        aspects of Great Society social policy, and the 1960s counterculture.
      - >-
        This first age was not principally a foreign-policy doctrine.
      - >-
        The Public Interest and Commentary were major journals through which this
        intellectual formation developed.
      - >-
        The break with the New Left also involved the defense of Israel and
        opposition to anti-Zionism, especially after the 1967 Six-Day War; Israel
        became a central component of the emerging movement's political identity.
    people:
      - Irving Kristol
      - Norman Podhoretz
      - Daniel Bell
      - Nathan Glazer
      - Seymour Martin Lipset
      - Daniel Patrick Moynihan
      - James Q. Wilson
    institutions:
      - The Public Interest
      - Commentary
    boundaries:
      - Not every person grouped with the first age accepted the neoconservative label.
      - Not every first-age figure followed the same later political path.
    evidence:
      - SRC-VAISSE-BROOKINGS-KRISTOL-2009
      - SRC-VAISSE-BROOKINGS-2010
      - SRC-PODHORETZ-COMMENTARY-1996
      - SRC-HUMMEL-ISRAEL-RISE-NEOCONS-2010

  second_age_washington_foreign_policy:
    period: "1970s through 1980s"
    facts:
      - >-
        A second neoconservative current formed among Cold War Democrats and
        Washington policy intellectuals reacting against George McGovern,
        post-Vietnam retrenchment, détente with the Soviet Union, and proposed
        reductions in American military power.
      - >-
        Senator Henry M. "Scoop" Jackson became a central political node for this
        foreign-policy current.
      - >-
        The Coalition for a Democratic Majority and the reconstituted Committee
        on the Present Danger were important organizational homes for this phase.
      - >-
        Jackson's Senate office and related Capitol Hill networks became a
        transmission point from intellectual and strategic circles into practical
        foreign-policy work.
      - >-
        Many participants in this current later moved from the Democratic orbit
        into the Reagan administration or Republican-aligned institutions.
      - >-
        In the Jackson network, anti-Soviet strategy, Soviet-Jewish emigration,
        human-rights pressure, and the defense of Israel became closely joined.
    people:
      - Henry M. "Scoop" Jackson
      - Richard Perle
      - Paul Wolfowitz
      - Jeane Kirkpatrick
      - Elliott Abrams
      - Joshua Muravchik
      - Ben Wattenberg
      - Carl Gershman
      - Michael Ledeen
      - Norman Podhoretz
    institutions:
      - Coalition for a Democratic Majority
      - Committee on the Present Danger
      - United States Senate office of Henry M. "Scoop" Jackson
      - Commentary
      - American Enterprise Institute
    evidence:
      - SRC-HORTON-LOBE-2008-02-01
      - SRC-HORTON-LOBE-2015-10-20
      - SRC-VAISSE-BROOKINGS-KRISTOL-2009
      - SRC-PERLE-PBS-THINK-TANK
      - SRC-PERLE-GWU-COLD-WAR-1997
      - SRC-PODHORETZ-COMMENTARY-1996
      - SRC-HUMMEL-ISRAEL-RISE-NEOCONS-2010

  third_age_post_cold_war:
    period: "mid-1990s through the George W. Bush era"
    facts:
      - >-
        A post-Cold War generation gathered especially around William Kristol,
        Robert Kagan, The Weekly Standard, and the Project for the New American
        Century.
      - >-
        William Kristol and Robert Kagan publicly advocated preservation of
        American hegemony, military supremacy, and an assertive international role
        in their 1996 Foreign Affairs essay "Toward a Neo-Reaganite Foreign Policy."
      - >-
        PNAC's 1997 Statement of Principles called for American global leadership
        and stronger defense capabilities.
      - >-
        This generation made democracy promotion, regime change in hostile states,
        and a willingness to use American military power more prominent features
        of neoconservative foreign policy.
      - >-
        Neoconservatives were an important component of the coalition supporting
        the 2003 invasion of Iraq, but the Bush administration and the pro-war
        coalition also included aggressive nationalists and other currents that
        were not themselves neoconservative.
      - >-
        William Kristol, Robert Kagan, Richard Perle, Norman Podhoretz, and other
        central figures publicly joined American power, the war on terrorism, and
        steadfast support for Israel in movement essays and joint letters.
    people:
      - William Kristol
      - Robert Kagan
      - Richard Perle
      - Paul Wolfowitz
      - Elliott Abrams
      - Douglas Feith
      - Charles Krauthammer
      - Francis Fukuyama
      - Zalmay Khalilzad
    institutions:
      - The Weekly Standard
      - Project for the New American Century
      - American Enterprise Institute
      - United States Department of Defense
    evidence:
      - SRC-KRISTOL-KAGAN-FOREIGN-AFFAIRS-1996
      - SRC-PNAC-STATEMENT-1997
      - SRC-HORTON-JUDIS-2008-07-30
      - SRC-HORTON-LOBE-2008-02-01
      - SRC-PERLE-PBS-FRONTLINE-IRAQ
      - SRC-VAISSE-BROOKINGS-KRISTOL-2009
      - SRC-KAGAN-KRISTOL-GREEN-LIGHT-2001
      - SRC-NEOCON-BUSH-ISRAEL-LETTER-2002

  post_iraq_fragmentation_and_continuity:
    period: "2004 onward"
    facts:
      - >-
        The Iraq War produced open disagreement inside the wider neoconservative
        intellectual network; Francis Fukuyama publicly broke with the foreign
        policy he associated with the movement.
      - >-
        Neoconservative organizations and writers nevertheless remained active
        after the movement's loss of prestige during the Iraq occupation.
      - >-
        The Foreign Policy Initiative succeeded PNAC as one post-Iraq
        organizational vehicle associated with William Kristol and Robert Kagan.
      - >-
        The rise of Donald Trump generated another visible fracture: prominent
        neoconservative figures including William Kristol opposed Trump, while
        hawkish and pro-Israel positions associated with neoconservative networks
        continued to overlap with parts of Republican foreign policy.
    evidence:
      - SRC-FUKUYAMA-NEW-YORKER-2006
      - SRC-HORTON-LOBE-2009-03-26
      - SRC-VAISSE-BROOKINGS-2010
      - SRC-WEEKLY-STANDARD-NEW-YORKER-2018

independent_streams:
  anti_stalinist_left:
    facts:
      - >-
        Anti-Stalinist socialist and Trotskyist milieus formed part of the
        biography of some early neoconservatives.
      - >-
        Irving Kristol stated in his own memoir that he had been a member of the
        Young People's Socialist League (Fourth International), which he described
        as Trotskyist.
      - >-
        Max Shachtman and the anti-Stalinist socialist world belong to the wider
        political genealogy from which some later Cold War social-democratic and
        neoconservative networks emerged.
    people:
      - Max Shachtman
      - Irving Kristol
    boundary: >-
      Neoconservatism is not Trotskyism, and many neoconservatives were never
      Trotskyists or Shachtmanites.
    evidence:
      - SRC-KRISTOL-MEMOIRS-TROTSKYIST
      - SRC-HORTON-LOBE-2016-04-07
      - SRC-VAISSE-BROOKINGS-KRISTOL-2009

  cold_war_liberalism:
    facts:
      - >-
        The movement inherited a strong anti-Communist current from postwar Cold
        War liberalism.
      - >-
        The foreign-policy generation associated with Scoop Jackson defended a
        large American strategic role, opposed détente as practiced by Nixon and
        Kissinger, and linked anti-Soviet policy with human-rights concerns.
      - >-
        The Jackson-Vanik campaign tied U.S.-Soviet trade benefits to freedom of
        emigration, especially in response to restrictions affecting Soviet Jews.
    people:
      - Harry S. Truman
      - Henry M. "Scoop" Jackson
      - Richard Perle
      - Daniel Patrick Moynihan
      - Jeane Kirkpatrick
    evidence:
      - SRC-PERLE-GWU-COLD-WAR-1997
      - SRC-JACKSON-VANIK-YIVO
      - SRC-PODHORETZ-COMMENTARY-1996
      - SRC-HORTON-LOBE-2016-04-07

  domestic_social_science_and_cultural_critique:
    facts:
      - >-
        First-age neoconservatism developed through criticism of unintended
        consequences in welfare-state policy and skepticism toward some Great
        Society programs.
      - >-
        Opposition to the 1960s counterculture and the New Left was a major
        cultural component of the first generation.
      - >-
        These positions coexisted with acceptance by many early neoconservatives
        of a substantial welfare state rather than pure laissez-faire economics.
    people:
      - Irving Kristol
      - Daniel Bell
      - Nathan Glazer
      - James Q. Wilson
      - Daniel Patrick Moynihan
      - Norman Podhoretz
    evidence:
      - SRC-VAISSE-BROOKINGS-KRISTOL-2009
      - SRC-PODHORETZ-COMMENTARY-1996

  straussian_line:
    facts:
      - >-
        Leo Strauss is an independent intellectual source connected to parts of
        the neoconservative network through readers, students, and students of his
        students.
      - >-
        Irving Kristol recorded a major intellectual impact from reading Strauss.
      - >-
        Paul Wolfowitz attended Strauss's lectures at the University of Chicago
        and had earlier studied with Strauss's student Allan Bloom.
      - >-
        William Kristol studied at Harvard with the self-described Straussian
        political theorist Harvey Mansfield.
    people:
      - Leo Strauss
      - Allan Bloom
      - Harvey Mansfield
      - Irving Kristol
      - Paul Wolfowitz
      - William Kristol
    boundaries:
      - >-
        This lineage does not establish that neoconservative policy is identical
        to Strauss's teaching.
      - >-
        It does not establish that later political actors understood Strauss
        correctly.
      - >-
        Other neoconservative streams do not derive from Strauss merely because
        they intersect with Straussian-influenced people.
    evidence:
      - SRC-WOLFOWITZ-NEW-YORKER-2007
      - SRC-STRAUSS-NEW-YORKER-2016
      - SRC-MANSFIELD-HOOVER

  wohlstetter_strategic_line:
    facts:
      - >-
        Albert James Wohlstetter is an independent strategic and defense-policy
        source feeding later neoconservative networks.
      - >-
        Paul Wolfowitz completed his doctoral work under Wohlstetter.
      - >-
        Richard Perle described Wohlstetter as an intellectual mentor and named
        Wolfowitz among Wohlstetter's protégés.
      - >-
        In 1969 Wohlstetter sent Perle and Wolfowitz to Washington to work on the
        ballistic-missile-defense debate; their work brought them into contact
        with Scoop Jackson.
      - >-
        Wohlstetter also became an important strategic influence and Washington
        connector for Zalmay Khalilzad.
    people:
      - Albert James Wohlstetter
      - Paul Wolfowitz
      - Richard Perle
      - Zalmay Khalilzad
    institutions:
      - RAND Corporation
      - University of Chicago
    boundary: >-
      Wohlstetter is not a branch of Leo Strauss. The two streams remain
      independent even where they meet in the same people.
    evidence:
      - SRC-PERLE-PBS-THINK-TANK
      - SRC-WOLFOWITZ-NEW-YORKER-2007
      - SRC-KHALILZAD-NEW-YORKER-2005

  zionist_commitment:
    status: CONSTITUTIVE
    facts:
      - >-
        Zionism was a defining commitment of American neoconservatism, not merely
        a persistent or prominent foreign-policy preference.
      - >-
        The founding generation's defense of Israel and conflict with anti-Zionism
        formed part of its break with the New Left.
      - >-
        Norman Podhoretz's retrospective identified enthusiastic support for
        Israel as a position distinguishing neoconservatives from older
        conservative traditions and connected that support to anti-Communism.
      - >-
        The Jackson-Vanik campaign joined anti-détente strategy, Soviet-Jewish
        emigration, human rights, and organized pro-Israel politics.
      - >-
        In the post-Cold War generation, William Kristol, Robert Kagan, Richard
        Perle, Norman Podhoretz, and others repeatedly argued for unequivocal
        American support for Israel and connected Israel's security to American
        strategy.
    boundaries:
      - Zionism is a political commitment; Jewish identity alone is not evidence.
      - >-
        Constitutive commitment does not mean uniform support for every Israeli
        government or policy.
      - >-
        It does not establish that Israel was the movement's sole concern or that
        neoconservatives acted as agents of an Israeli government.
    evidence:
      - SRC-PODHORETZ-COMMENTARY-1996
      - SRC-JACKSON-VANIK-YIVO
      - SRC-HORTON-LOBE-2008-02-01
      - SRC-HUMMEL-ISRAEL-RISE-NEOCONS-2010
      - SRC-KRISTOL-NEOCONSERVATIVE-PERSUASION-2003
      - SRC-KAGAN-KRISTOL-GREEN-LIGHT-2001
      - SRC-NEOCON-BUSH-ISRAEL-LETTER-2002

  defense_and_national_security_establishment:
    facts:
      - >-
        Neoconservative networks repeatedly overlapped with the American defense
        and national-security establishment through strategic research, Pentagon
        service, congressional defense work, think tanks, and advocacy for larger
        defense capabilities.
      - >-
        Wohlstetter's RAND strategic work, the Scoop Jackson defense-policy
        network, Team B, Reagan-era Pentagon service, and later PNAC advocacy form
        documented stages of this overlap.
      - >-
        Paul Wolfowitz served on the 1976 Team B exercise that challenged CIA
        estimates of Soviet strategic intentions.
    boundaries:
      - >-
        Institutional overlap does not by itself establish that a policy position
        was caused by defense-industry financial interests.
      - >-
        Andrew Cockburn and Scott Horton have repeatedly advanced a stronger
        "Israel lobby plus defense lobby" fusion thesis; that thesis is retained
        as research provenance rather than treated as a universal causal fact in
        this star.
    evidence:
      - SRC-WOLFOWITZ-NEW-YORKER-2007
      - SRC-KRISTOL-KAGAN-FOREIGN-AFFAIRS-1996
      - SRC-PNAC-STATEMENT-1997
      - SRC-HORTON-COCKBURN-2007-04-12
      - SRC-HORTON-COCKBURN-2014-12-12
      - SRC-HORTON-COCKBURN-2019-05-14

  burnham_precursor:
    status: DOCUMENTED_HISTORIOGRAPHIC_PLACEMENT
    fact: >-
      James Burnham's path from Trotskyism to militant anti-Communism and his
      writings on power and foreign policy have been identified by historians as
      an important precursor or inspiration for later neoconservative foreign
      policy.
    boundary: >-
      Burnham's placement is that of a precursor; this does not make every part of
      his thought neoconservative or make later neoconservatives his descendants.
    evidence:
      - SRC-BURNHAM-CAMBRIDGE-2010
      - SRC-BURNHAM-CORNELL-2025

junction_people:
  Irving_Kristol:
    connections:
      - Trotskyist youth and anti-Stalinist intellectual milieu
      - Commentary
      - Encounter
      - The Public Interest
      - criticism of Great Society liberalism
      - American Enterprise Institute
      - engagement with Leo Strauss's thought
      - movement-building within American conservatism
    boundary: >-
      Irving Kristol's own later foreign-policy views were at times more realist
      and restrained than those of the post-Cold War neoconservative generation.
    evidence:
      - SRC-KRISTOL-MEMOIRS-TROTSKYIST
      - SRC-VAISSE-BROOKINGS-KRISTOL-2009
      - SRC-STRAUSS-NEW-YORKER-2016

  Norman_Podhoretz:
    connections:
      - New York intellectual world
      - Commentary
      - opposition to the New Left and counterculture
      - militant Cold War anti-Communism
      - strong support for Israel
      - continuity from first-age neoconservatism into later foreign-policy neoconservatism
    evidence:
      - SRC-PODHORETZ-COMMENTARY-1996
      - SRC-VAISSE-BROOKINGS-KRISTOL-2009

  Paul_Wolfowitz:
    connections:
      - Allan Bloom
      - exposure to Leo Strauss's lectures
      - doctoral study under Albert Wohlstetter
      - 1969 Washington work with Richard Perle
      - Scoop Jackson orbit
      - Team B
      - Reagan and later Republican national-security service
      - post-Cold War defense planning
      - George W. Bush administration
    boundary: >-
      Strauss and Wohlstetter are separate influences in Wolfowitz's biography;
      Wolfowitz himself identified Wohlstetter as the more significant influence.
    evidence:
      - SRC-WOLFOWITZ-NEW-YORKER-2007
      - SRC-PERLE-PBS-THINK-TANK
      - SRC-PBS-MANN-RUMSFELDS-WAR

  Richard_Perle:
    connections:
      - Albert Wohlstetter mentorship
      - 1969 Washington work with Paul Wolfowitz
      - eleven years on Scoop Jackson's staff
      - Jackson-Vanik
      - Reagan-era Department of Defense
      - later neoconservative defense-policy networks
    evidence:
      - SRC-PERLE-PBS-THINK-TANK
      - SRC-PERLE-GWU-COLD-WAR-1997

  William_Kristol:
    connections:
      - son of Irving Kristol
      - student of Harvey Mansfield
      - Republican political operation
      - The Weekly Standard
      - Robert Kagan
      - Project for the New American Century
      - post-Cold War neo-Reaganite foreign policy
      - later Never Trump opposition
    evidence:
      - SRC-MANSFIELD-HOOVER
      - SRC-KRISTOL-KAGAN-FOREIGN-AFFAIRS-1996
      - SRC-VAISSE-BROOKINGS-KRISTOL-2009
      - SRC-WEEKLY-STANDARD-NEW-YORKER-2018

  Robert_Kagan:
    connections:
      - William Kristol
      - The Weekly Standard
      - Project for the New American Century
      - neo-Reaganite foreign policy
      - later Foreign Policy Initiative
    evidence:
      - SRC-KRISTOL-KAGAN-FOREIGN-AFFAIRS-1996
      - SRC-PNAC-STATEMENT-1997
      - SRC-HORTON-LOBE-2009-03-26

  Zalmay_Khalilzad:
    connections:
      - Albert Wohlstetter strategic network
      - nuclear-proliferation research
      - Washington national-security network
      - later senior roles in Afghanistan and Iraq policy
    evidence:
      - SRC-KHALILZAD-NEW-YORKER-2005

  Elliott_Abrams:
    connections:
      - Scoop Jackson / Daniel Patrick Moynihan Capitol Hill neoconservative network
      - Reagan administration
      - democracy and human-rights advocacy within hawkish foreign policy
      - later Republican national-security roles
    boundary: >-
      Abrams belongs to overlapping Washington networks; he should not be reduced
      to a single intellectual lineage.
    evidence:
      - SRC-HORTON-LOBE-2008-02-01
      - SRC-VAISSE-BROOKINGS-KRISTOL-2009

institutional_transmission:
  journals_and_media:
    core:
      - Commentary
      - The Public Interest
      - The Weekly Standard
    later_or_overlapping:
      - Wall Street Journal editorial pages
  political_and_government_nodes:
    - United States Senate office of Henry M. "Scoop" Jackson
    - Daniel Patrick Moynihan's Senate and diplomatic orbit
    - Reagan administration foreign-policy and defense posts
    - George H. W. Bush administration defense-planning posts
    - George W. Bush administration national-security posts
  organizations_and_think_tanks:
    core_or_major:
      - American Enterprise Institute
      - Coalition for a Democratic Majority
      - Committee on the Present Danger
      - Project for the New American Century
      - Foreign Policy Initiative
    overlapping_not_identical_to_neoconservatism:
      - RAND Corporation
      - Hudson Institute
      - Jewish Institute for National Security of America
      - Center for Security Policy
      - Foundation for Defense of Democracies
  boundary: >-
    Presence of neoconservative figures in an institution does not make the whole
    institution neoconservative.

documented_commitments_over_time:
  first_age:
    - criticism of perceived failures and unintended consequences of Great Society social policy
    - opposition to the New Left and 1960s counterculture
    - anti-Communism
    - defense of Israel and opposition to anti-Zionism
    - acceptance by many members of a substantial but bounded welfare state
  second_age:
    - opposition to détente with the Soviet Union
    - strong defense and skepticism toward arms-control optimism
    - support for Soviet-Jewish emigration and human-rights pressure on the USSR
    - Zionism and the defense of Israel
    - willingness to use American political and military power assertively
  third_age:
    - preservation of American global primacy or hegemony
    - military supremacy
    - American international leadership
    - democracy promotion
    - willingness to act unilaterally when multilateral institutions obstruct action
    - regime change as an accepted tool against selected hostile governments
    - Zionism and steadfast support for Israel
  boundary: >-
    These are documented recurring positions across stages of the movement, not a
    claim that every neoconservative held every position at every time. Zionism is
    the exception to this variability rule: it is constitutive across the
    movement's generations.
  evidence:
    - SRC-PODHORETZ-COMMENTARY-1996
    - SRC-KRISTOL-KAGAN-FOREIGN-AFFAIRS-1996
    - SRC-PNAC-STATEMENT-1997
    - SRC-VAISSE-BROOKINGS-2010
    - SRC-HUMMEL-ISRAEL-RISE-NEOCONS-2010
    - SRC-KAGAN-KRISTOL-GREEN-LIGHT-2001
    - SRC-NEOCON-BUSH-ISRAEL-LETTER-2002

coalitions_and_non_identity:
  facts:
    - >-
      Neoconservatives have repeatedly worked in coalitions with groups that are
      historically distinct from neoconservatism.
    - >-
      During the George W. Bush era, Jim Lobe distinguished neoconservatives from
      aggressive nationalists such as Dick Cheney and Donald Rumsfeld and from the
      Christian Right even though these currents cooperated on major foreign-policy
      questions.
    - >-
      Christian Zionist leaders adopted or supported many foreign-policy positions
      promoted by neoconservatives without thereby sharing the movement's New York,
      Cold War liberal, Straussian, or Wohlstetter genealogies.
  distinctions:
    - neoconservative is not a synonym for Republican
    - neoconservative is not a synonym for hawk
    - neoconservative is not a synonym for Straussian
    - neoconservative is not a synonym for Trotskyist
    - neoconservative is not a synonym for the military-industrial complex
    - coalition does not establish common origin
  evidence:
    - SRC-HORTON-LOBE-2008-02-01
    - SRC-HORTON-LOBE-2016-04-07

research_provenance:
  primary_map:
    - Scott Horton's interviews with Jim Lobe
    - Scott Horton's interviews with Andrew Cockburn
    - Scott Horton's interviews with John Judis and other historians and critics
  rule: >-
    Horton is used as the primary research map because his archive repeatedly
    traces people, institutions, and lineages across decades. Individual factual
    connections are cross-checked where possible against participants' own words,
    movement texts, archival records, or historical scholarship.
  cockburn_horton_fusion_thesis:
    status: RESEARCH_LEAD_NOT_STAR_FACT
    statement: >-
      Andrew Cockburn, in repeated interviews with Scott Horton, describes mature
      neoconservatism as the point where the pro-Israel political lobby and the
      American defense lobby joined interests, and assigns Paul Nitze an important
      role in that convergence.
    treatment: >-
      The Star records Zionism as constitutive and the defense-policy dimension as
      independently established. The stronger universal causal claim that mature
      neoconservatism arose from a fusion of two lobbies remains attributed to
      Cockburn and Horton rather than converted into an unqualified Star fact.
  zionism_probe:
    status: ELEVATED_TO_CONSTITUTIVE_FACT
    finding: >-
      Zionism belongs in the definition of American neoconservatism. It is not
      adequately represented as a preference held by many participants or as a
      merely persistent foreign-policy position.
    basis: >-
      Scholarship on the movement's 1960s and 1970s formation identifies Israel as
      a central component of its emerging ideology. Retrospectives and programmatic
      texts by leading figures carry that commitment through the movement's first,
      second, and third ages.
    evidentiary_boundary: >-
      This classification concerns a political commitment. It neither infers
      Zionism from Jewish identity nor converts policy support into a claim of
      obedience to an Israeli government.

