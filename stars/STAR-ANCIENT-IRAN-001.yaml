star_id: STAR-ANCIENT-IRAN-001
name: Ancient Iran
status: FACT

fact: >-
  Ancient Iran understood existence as a created and living order whose truth had to become effective in the world. Asha joined the order of the cosmos to truthful speech, right judgment, faithful covenant, careful ritual, fruitful labor, and just rule; Druj broke those relations through deception, fury, predation, and sterile violence. The civilization’s unity therefore did not consist in one doctrine, one cult, or one administrative form, but in the recurring effort to bring different beings, powers, and peoples into right relation with an order none of them had made.
  
  The human being occupied a morally decisive but never sovereign place within that order. Every person could choose between truth and the Lie and was answerable for thought, speech, and action, but no person appeared as a naturally isolated individual existing before society. Choice arose within the household, settlement, clan, country, cult, inheritance, labor, property, oath, and political community. The person was responsible precisely because these relations could be sustained or corrupted through what each human being did.
  
  Creation itself was a community of vulnerable beings rather than an expanse of inert matter. Cattle, fire, water, earth, plants, celestial powers, and human beings participated in a living order that required protection and renewal. The cry of the wounded Cow joined cosmic disorder to violence within the material world and demanded a protector capable of giving truth practical force. Religion could therefore never be reduced to belief alone: sacrifice, recitation, purity, husbandry, fertility, and the care of the elements were actions through which the world was either preserved or injured.
  
  The tensions within Iranian religion belonged to this history and cannot be dissolved into a single system. The Gathic confrontation with predatory sacrifice did not erase ritual, while the later return of Haoma, animal offerings, inherited divine powers, and elaborate purity law did not cancel the demand that worship serve truth rather than violence. Ahura Mazda stood at the summit of the moral and cosmic order, yet the sacred world remained populated by powers whose agencies were expressed through covenant, water, fire, fertility, victory, judgment, and ancestral presence. Iranian and Elamite worship interpenetrated within the imperial heartland, making sacred plurality constitutive of the civilization rather than a concession temporarily granted by its kings.
  
  Kingship arose within this order and remained answerable to it. Beneficent dominion gave truth material efficacy by protecting creation, restraining violence, judging disputes, and sustaining the conditions of common life. Royal glory could be granted, inherited, lost, or withdrawn; possession of the throne did not make its occupant the source of justice. The king’s proper strength therefore depended upon self-command, truthful counsel, attention to both sides of a dispute, proportionate reward and punishment, martial capacity, and protection of both the strong and the weak.
  
  The royal inscriptions transformed this inherited distinction between truth and the Lie into the language of imperial legitimacy. Rebellion became allegiance to the Lie, restoration of the dynasty became restoration of order, and victory became evidence of divine favor. Yet the kings’ own accounts preserve the contradiction within that claim: the ruler who presented himself as the defender of justice also mutilated, impaled, displaced, and killed those whom he classified as enemies of order. Royal power could give truth political force, but it could also identify the ruler’s survival with truth itself.
  
  The empire extended Iranian order across peoples who were not required to become identical. Languages, laws, cults, elites, crafts, landscapes, and forms of communal life continued within a hierarchy centered upon the Great King, the royal house, and the Persian governing people. Delegations and throne-bearers appeared as distinct peoples occupying ordered places rather than as interchangeable subjects. Imperial unity was therefore unity without sameness, but it was not equality: difference was preserved through a structure that assigned every people a position in relation to a privileged center.
  
  Roads, seals, archives, interpreters, travel authorizations, rations, treasuries, courts, gifts, tribute, military service, and provincial officials converted that hierarchy into daily practice. The empire was personal and administrative at once. A command derived its authority from recognized persons and relationships, yet writing allowed that recognition to travel across distance, pass through different languages, and become an enduring claim upon provisions, labor, obedience, or protection. Administration did not replace personal rule; it multiplied the reach of relationships anchored in the king.
  
  The household, estate, court, province, and empire were therefore not separate public and private spheres. Land, kinship, dependents, artisans, soldiers, managers, worship, taxation, and political service converged within great houses whose authority could extend across provinces. Women could own property, manage estates, supervise labor, transmit dynastic standing, and organize political relationships without thereby escaping the unequal orders of household and rank. Enslaved and dependent people likewise entered the record as persons who could be valued, transferred, branded, rationed, punished, or occasionally protected by the same administrative world.
  
  Local communities retained meaningful agency within this hierarchy. They recorded marriages, dowries, inheritances, purchases, loans, oaths, petitions, and religious claims; appealed beyond immediate officials; and used imperial languages and procedures to defend their own institutions. Yet their security remained conditional. The same government capable of recognizing a temple, protecting property, or hearing a petition could permit destruction, impose punishment, extract resources, or restrict restoration. Accommodation and coercion were not opposing policies but possibilities contained within the same imperial relationship.
  
  Power therefore possessed no single substance and cannot define Ancient Iran as a whole. It existed wherever one being could give or deny another the material conditions of action: in sacrifice, oath, household, estate, court, road, ration, judgment, punishment, military command, and royal representation. Every instrument of coordination carried a corresponding danger. Roads connected communities and moved armies; archives preserved claims and classified persons; rations sustained workers and graded their worth; royal justice protected subjects and rendered resistance false by definition. Power was legitimate only insofar as it served an order more authoritative than the person who exercised it.
  
  The Greek histories encountered this civilization as both a material power and a political problem. Their accounts were true and mythic at once: they preserved wars, customs, negotiations, dynastic memories, and encounters while arranging them into stories about freedom and subjection, measure and excess, education and corruption, fortune and divine limit. Their lasting question concerned the formation of the ruler. An empire could survive differences of language and custom more easily than it could survive a king unable to rule himself, hear truthful counsel, distinguish friendship from flattery, or educate a successor.
  
  The personal center that gave the empire flexibility also made succession dangerous. The court was not a corrupt private world surrounding an otherwise impersonal government; it was the place where dynasty, aristocracy, province, land, military command, sacred legitimacy, and access to the king converged. Marriage, maternal lineage, royal favor, gifts, service, friendship, and provincial command bound the ruling order together, but the same relationships could be mobilized by rival claimants. Dynastic fracture arose from the political structure that ordinarily made coordinated rule possible.
  
  The Achaemenid dynasty did not fall because its civilization had become an empty or decadent shell. The empire resisted the Macedonian invasion across several campaigns, rebuilt armies after defeats, defended cities and mountain passages, negotiated transfers of authority, and continued to generate rival claims to legitimate kingship after the loss of its capitals. Alexander could conquer the dynasty only by entering its political world: preserving satrapies, adopting royal forms, incorporating Iranian commanders and soldiers, marrying into the dynasty, avenging Darius, and presenting himself as successor to the Great King. His inability to create a stable ruling people from Macedonian and Iranian elites revealed that imperial forms could be seized more easily than the relationships that had sustained them.
  
  The Iranian achievement was to hold together moral choice and social obligation, sacred plurality and supreme divine order, local continuity and imperial hierarchy, material administration and cosmic meaning. Its unresolved danger was that an instrument created to serve order could identify itself with order: the king with truth, victory with justice, classification with reality, and preservation with coercion. The Achaemenid dynasty ended, but Ancient Iran did not, because its civilization was never created by the dynasty alone and could pass into new political forms without being reducible to the conqueror who inherited them.

scope:
  subject: >-
    Ancient Iran as a complete civilization: its sacred account of creation,
    truth, moral choice, living nature, covenant, ritual, personhood, and final
    renovation; the Achaemenid transformation of those inheritances through
    kingship, royal self-presentation, material administration, household and
    provincial order, religious plurality, monumental form, court, succession,
    conquest, and political inheritance.
  period: >-
    The civilization's own remembered beginnings through the transformation of
    the Achaemenid order under Alexander. No modern date is assigned as the
    beginning of the sacred world described by the ancient witnesses.
  geography:
    - the Iranian sacred and linguistic world
    - the Persian and Elamite imperial heartland
    - Babylonia, Egypt, Anatolia, the Levant, Central Asia, and the eastern imperial provinces
    - the Greek worlds that encountered, fought, served, narrated, and philosophically examined Iran
  narrative_companion: narratives/STAR-ANCIENT-IRAN-001.md
  source_manifest: sources/primary/ancient/iran/manifest.yaml

shape:
  model: CIVILIZATIONAL_RELATIONAL_ORDER
  center: >-
    Truth must become effective through right relations among divine beings,
    nature, thought, speech, action, ritual, household, community, kingship, and
    political administration.
  political_form: >-
    A privileged Persian royal center coordinates distinct peoples, languages,
    cults, elites, crafts, and local institutions without making them identical
    or politically equal.
  personhood: >-
    The person is morally responsible for thought, speech, and action while
    remaining constituted through household, settlement, clan, country, cult,
    inheritance, labor, oath, and future judgment.
  account_of_power: >-
    Power is one relation within the civilization rather than its essence. It is
    legitimate when it gives truth material efficacy and protects living order;
    it becomes corrupt when ruler, victory, classification, or preservation
    identifies itself with truth and justice.
  terminal_transformation: >-
    The Achaemenid dynasty falls, but Ancient Iran persists because Alexander
    can govern its world only by entering political forms and relationships Iran
    had already created.

witness_architecture:
  governing_rule: >-
    Ancient witnesses govern the realities they articulate. Modern editors,
    archaeologists, and historians establish texts, material settings, and
    comparisons without subordinating Iranian, Babylonian, Elamite, Aramaic,
    Egyptian, or Greek witnesses to a modern master narrative.
  sacred_self_witness:
    function: >-
      Discloses creation, Asha and Druj, divine plurality, covenant, living
      nature, ritual, glory, personhood, judgment, and renovation.
    principal_witnesses:
      - the Gathas
      - the Younger Avesta
  royal_and_imperial_self_witness:
    function: >-
      Discloses royal legitimacy, conquest, restoration, justice, violence,
      translation, construction, infrastructure, ordered peoples, and the
      Persian center.
    principal_witnesses:
      - the Cyrus Cylinder
      - the Behistun inscription
      - the royal inscriptions of Darius, Xerxes, and the Artaxerxids
      - the royal monuments of Pasargadae, Susa, Persepolis, and Naqsh-i Rustam
  administrative_and_local_witness:
    function: >-
      Discloses rations, labor, worship, travel, estates, contracts, property,
      family, petition, military service, provincial conflict, and the daily
      operation of hierarchy.
    principal_witnesses:
      - the Persepolis Fortification archive
      - the Persepolis Treasury tablets
      - the Arshama correspondence
      - the Elephantine papyri
  greek_ancient_witness:
    function: >-
      Preserves encounters with Iran while examining monarchy, freedom,
      education, counsel, character, measure, court, friendship, and succession.
      These accounts are true and mythic at once and do not replace Iran's own
      sacred, royal, administrative, or local voices.
    principal_witnesses:
      - Aeschylus
      - Herodotus
      - Ctesias
      - Xenophon
      - Plato
      - Plutarch
  modern_comparison:
    function: >-
      Establishes philology, archive context, archaeology, iconography,
      chronology, and historical comparison without becoming the voice of the
      ancient civilization.
    principal_controls:
      - Rüdiger Schmitt
      - Amélie Kuhrt
      - Wouter Henkelman
      - Margaret Cool Root
      - Richard T. Hallock
      - Pierre Briant
      - Muhammad A. Dandamaev
      - Mary Boyce

civilizational_architecture:
  - section: Sacred Order, Moral Choice, and Living Creation
    function: >-
      Establishes the sacred whole within which power, kingship, community, and
      individual responsibility become intelligible.
    propositions:
      - Asha joins cosmic order to truthful human action.
      - Druj is falsehood embodied in speech, ritual, violence, and rule.
      - Personal choice does not create an individual naturally prior to society.
      - Nature consists of living relations requiring protection and renewal.
      - Gathic reform and later ritual inheritance remain in unresolved tension.
      - Kingship is sacred and conditional because royal glory can depart.
  - section: Royal Self-Witness
    function: >-
      Places Achaemenid kingship inside the sacred world without allowing the
      royal voice to define the civilization.
    propositions:
      - Cyrus enters Babylonian sacred order through Marduk and restoration.
      - Darius translates truth and the Lie into dynastic legitimacy.
      - Royal justice, disciplined violence, and victory occupy one account.
      - Imperial proclamation passes through several languages and divine vocabularies.
      - Ordered plurality remains centered upon a privileged Persian king.
  - section: The Empire in Daily Operation
    function: >-
      Converts monumental claims into the recurring material acts by which the
      empire moved people, goods, information, worship, and command.
    propositions:
      - Rations and authorizations make hierarchy operational.
      - Administrative plurality includes several languages, cults, statuses, and forms of labor.
      - Writing extends personal recognition rather than replacing personal rule.
      - Protection, classification, provision, extraction, and coercion operate together.
  - section: Ancient Iran in the Greek Mirror
    function: >-
      Preserves the disagreements among Greek witnesses as ancient judgments
      produced through encounter.
    propositions:
      - Aeschylus locates imperial limit in divine measure and shared grief.
      - Herodotus joins freedom, mastery, counsel, geography, and fortune.
      - Ctesias reveals rival memories, household access, and hidden intermediaries.
      - Xenophon examines education, friendship, command, and founder-dependence.
      - Plato asks whether monarchy can unite authority with freedom and self-rule.
  - section: The Imperial World Made Visible
    function: >-
      Reads landscape, palace, garden, relief, approach, audience, and throne as
      political forms rather than decoration.
    propositions:
      - Pasargadae and Persepolis organize movement, visibility, access, and hierarchy.
      - Distinct peoples remain recognizable while supporting one royal summit.
      - Monumental unity transforms foreign skill without erasing its differentiated origin.
      - The king appears as center while visibly depending upon gods, successor, court, guards, and peoples.
  - section: Household, Province, and Local Order
    function: >-
      Shows how imperial authority entered estates, families, contracts,
      property, worship, and petitions.
    propositions:
      - Household and government do not form separate public and private spheres.
      - Local documents give persons agency without making them independent of rank and community.
      - Women possess consequential property and administrative capacities within unequal orders.
      - Religious and legal accommodation remains conditional upon imperial decisions.
  - section: Auramazda and the Other Gods
    function: >-
      Preserves the distinction between highest divine order, royal invocation,
      and the plural worship recorded in the imperial heartland.
    propositions:
      - Auramazda is greatest in royal self-presentation without being the only god.
      - Iranian and Elamite sacred inheritances are jointly constitutive.
      - Imperial cult administration does not prove one centralized priesthood.
      - The relation between Achaemenid kings and later orthodox Zoroastrian identity remains unresolved.
  - section: Dynasty, Court, and Imperial Fracture
    function: >-
      Treats the court as the junction of dynasty, aristocracy, province, land,
      military command, sacred legitimacy, and royal access.
    propositions:
      - Royal blood is necessary but succession is not automatic.
      - Gifts, marriage, maternal lineage, friendship, and service bind the ruling order.
      - The same personal relations can sustain imperial coordination or support rival claimants.
      - Dynastic conflict is a possibility internal to the political structure.
  - section: The Fall of the Dynasty and the Transformation of Its Order
    function: >-
      Reconstructs conquest without the inherited fiction of an empty and
      decadent empire.
    propositions:
      - Persian resistance continues through battles, cities, mountain passages, and eastern campaigns.
      - The transfer of capitals does not instantly dissolve the imperial world.
      - Alexander claims succession by avenging Darius and adopting Iranian forms.
      - Achaemenid political forms survive conquest more readily than the relationships that sustained imperial unity.
  - section: Ancient Iran as an Ordered Whole
    function: >-
      States the civilizational unity and its unresolved danger without
      repeating the evidence of the preceding sections.

conceptual_chain:
  - created and living order
  - Asha and Druj
  - morally responsible person within inherited relations
  - ritual efficacy and care of creation
  - covenant, household, settlement, clan, and country
  - conditional glory and beneficent dominion
  - royal appropriation of truth
  - ordered imperial plurality
  - personal and archival administration
  - local agency within unequal hierarchy
  - court-centered succession
  - conquest through inheritance of Iranian forms
  - civilizational persistence beyond dynasty

internal_tensions:
  - Gathic reform and later ritual inheritance
  - sacred unity and divine plurality
  - personal moral responsibility and inherited communal membership
  - universal truth and bounded historical communities
  - beneficent dominion and royal violence
  - imperial coordination and Persian privilege
  - local continuity and contingent accommodation
  - provision and extraction
  - administrative recognition and coercive classification
  - ruler formation and dynastic inheritance
  - Greek history as encounter and Greek history as political myth
  - conquest of the dynasty and persistence of the civilization

claim_policy:
  rules:
    - No single witness class is permitted to speak in another's name.
    - Royal inscriptions remain royal self-presentation rather than neutral chronicles.
    - Administrative archives reveal operation without being made to disclose the whole civilization.
    - Greek accounts remain ancient witnesses and judgments rather than Persian self-description.
    - Modern reconstructions compare and control transmission without governing the ancients.
    - Disagreement is preserved rather than resolved through silent synthesis.
    - The true age of the civilization is not assumed from the date of surviving manuscripts or monuments.
    - Sacred history is received as the civilization describes it without converting every event into modern documentary chronology.
    - Ancient Iran is not reduced to Achaemenid kingship, Zoroastrian doctrine, imperial power, or Greek opposition.
    - Power remains one relation within Ancient Iran rather than the civilization's defining substance.

connections_to_other_stars:
  - star_id: STAR-ANCIENT-EGYPT-001
    relation: >-
      Shares the problems of sacred kingship, living nature, effective speech,
      ancestral memory, plurality of divine forms, and the relation between
      civilizational self-witness and Greek philosophic examination without
      making either civilization derivative of the other.
  - star_id: STAR-HISTORY-OF-POWER-001
    relation: >-
      Replaces the former Persian segment as the complete civilizational body
      from which a later constellation may extract historically specific
      relations of authority.
  - star_id: STAR-AGE-OF-INDIVIDUAL-001
    relation: >-
      Supplies an ancient form of moral responsibility in which the person
      chooses and is judged without being conceived as naturally prior to
      household, community, cult, or political order.
  - star_id: STAR-MONEY-001
    relation: >-
      Supplies ancient evidence concerning estate, ration, wage, silver
      valuation, property, labor, tribute, gift, debt, travel, and exchange
      before these relations were isolated as an autonomous economy.

boundaries:
  - Ancient Iran is one Star; the sacred corpus is not detached into a separate Zoroastrian Star.
  - The Achaemenid dynasty is a historical expression of Ancient Iran rather than the beginning or whole of the civilization.
  - Parthian and Sasanian Iran require later Stars and are not silently compressed into the Achaemenid order.
  - Modern chronology dates witnesses and events without determining when the realities named by sacred memory began.
  - Ahura Mazda in the Avestan corpus and Auramazda in Achaemenid inscriptions retain their distinct linguistic settings.
  - Asha and Druj are not reduced to obedience and rebellion.
  - Royal victory does not independently prove royal justice.
  - Ordered plurality is not described as equality or modern tolerance.
  - Greek contrasts between freedom and subjection do not erase unfree relations within Greece or differentiated agency within Iran.
  - Court, household, and estate are not treated as corrupt private intrusions into an otherwise impersonal state.
  - Administrative connectivity is not equated with uniform control.
  - Alexander's adoption of Iranian forms does not establish a stable fusion of Macedonian and Iranian ruling peoples.
  - The fall of the Achaemenid dynasty is not the disappearance of Ancient Iran.

navigational_questions:
  - How does Asha join cosmic truth to human action without becoming merely political obedience?
  - How can the person be morally responsible without being naturally prior to society?
  - What does the Soul of the Cow disclose about the relation between truth and effective protection?
  - How do Gathic reform and later Avestan ritual inheritance remain joined and opposed?
  - How does xwaranah authorize kingship while preserving the possibility that glory can depart?
  - What changes when Darius makes the Lie a category of rival kingship?
  - How does multilingual proclamation preserve one imperial claim through different sacred vocabularies?
  - How do archive, seal, ration, authorization, and road extend personal government?
  - What forms of agency appear in property records, household documents, contracts, and petitions?
  - How can imperial plurality preserve difference while remaining hierarchical and Persian-centered?
  - What does the mixed worship of the Persepolis archive establish about Ancient Iranian religious life?
  - How do monument, approach, audience, delegation, and throne make order visible?
  - Why do Greek witnesses disagree about the education and limits of the ruler?
  - How do household and court relationships become both the strength and vulnerability of succession?
  - Why does the Macedonian conquest refute the inherited account of Achaemenid decadence?
  - What survives when a dynasty falls but its conqueror must inherit its political forms?
  - Under what conditions does power serve an order more authoritative than the ruler?

sources:
  corpus_manifest: sources/primary/ancient/iran/manifest.yaml
  inherited_preparatory_records: sources/primary/ancient/persia/manifest.yaml
  disposition: >-
    The older Persia package remains a historical record of the preliminary
    History-of-Power audit. The Ancient Iran corpus governs this completed Star
    and removes the older package's narrow and non-admitted status from the new
    civilizational file.

completeness: COMPLETE

