star_id: STAR-MONEY-001
name: Money and the transformation of political economy
status: DRAFT

fact: >-
  Modern political economy arose through a transformation in the place assigned
  to property, labor, exchange, money, and production within the human whole. In
  classical political philosophy, acquisition and exchange supplied necessary
  goods but remained subordinate to household government, the polis, political
  judgment, and the good life. Locke reconstructed property from the rights of
  naturally separate individuals, made labor the original title to appropriation,
  and made consensual money the institution that permitted durable accumulation
  beyond immediate use. Hume relocated property, transfer, promise, credit, and
  government within conventions made necessary by scarcity, limited generosity,
  and mutual dependence. Smith joined exchange, division of labor, money, stock,
  wages, profit, rent, taxation, and public debt into a history of commercial
  society. Ricardo converted that history into a rigorous system centered on the
  laws governing value and the distribution of the social product among laborers,
  capitalists, and landlords. Marx completed and overturned the classical system
  by reconstructing money as the necessary form of commodity value, capital as
  self-expanding value and a social relation, profit as a transformed appearance
  of surplus value, accumulation as the reproduction of a class order, and
  political economy as the historical anatomy of a society whose human products
  confront their producers as independent powers. Marx therefore closes the
  classical period mapped here: the science that began by separating economic
  relations from political rule culminated in a critique showing that those
  apparently autonomous relations constituted a historically specific form of
  social power. Jevons opened the post-classical marginalist reconstruction by
  relocating value from embodied labor and class distribution to the final
  degree of utility, individual choice, scarcity, and exchange equilibrium.
  Labor remained causally important through its effect upon supply, but it no
  longer served as the substance or direct regulator of value. Political economy
  thereby contracted from Marx's historical science of the social whole into a
  mathematical theory of choice and exchange, while Jevons's analysis of money
  showed how monetary functions were distributed among coin, paper, bank credit,
  cheques, and clearing rather than embodied in a single monetary substance.
  Menger independently reconstructed value from the causal relation between
  human needs and goods, the scarcity of available quantities, and the importance
  of the least important satisfaction dependent upon a concrete unit. He carried
  this valuation backward through time from goods of first order to the
  complementary goods of higher orders required to produce them, and explained
  exchange, price formation, and money without reducing the economy to a
  mathematical equilibrium. Money emerged through individuals accepting more
  saleable goods for less saleable ones; custom generalized their acceptance,
  while state recognition and coinage perfected rather than originally created
  their monetary character. Walras supplied a third and distinct reconstruction.
  He defined social wealth as useful things limited in quantity, defined rareté
  at the margin as the intensity of the last want satisfied, and represented
  exchange as a simultaneous system in which each trader seeks maximum
  satisfaction and effective demand equals effective supply throughout the
  market. A numéraire expressed the interdependent structure of relative prices,
  while money mediated sales and purchases; markets for products, productive
  services, and capital then joined exchange to production, saving, and credit.
  Pure economics became an exact theory of systemic interdependence, but Walras
  kept the useful direction of production and the just distribution of wealth as
  distinct applied and moral questions that pure equilibrium could not answer.
  Marshall consolidated the marginal turn into a neoclassical economics of
  continuity, time, and partial equilibrium. Marginal utility generated demand,
  while labor, waiting, organization, and the expenses of production generated
  supply; neither utility nor cost alone governed value, and their relative force
  changed with the period under examination. The same demand-and-supply
  framework extended to wages, interest, profit, rent, and the distribution of
  the national dividend, while representative firms, internal and external
  economies, substitution, and quasi-rent connected price theory to industrial
  organization and change. Money then appeared as both a medium of current
  exchange and a standard of deferred payment whose purchasing power shaped
  contracts, debts, wages, and real interest. The quantity of currency worked
  through the amount of ready purchasing power people chose to hold and through
  the credit instruments that economized cash; banking, joint-stock finance,
  securities markets, international payments, and cumulative movements of
  confidence transformed individual exchange into a monetary system capable of
  expanding prosperity and amplifying crisis across nations. Keynes then
  reconstructed this monetary order from the level of aggregate output and
  employment. His early monetary work showed currencies, reserves, exchange
  rates, and crises to be governed through administrative practice, central
  banking, and international credit rather than by an automatic metallic
  mechanism. The destruction of Europe's interdependent productive and
  financial organization after the First World War showed that monetary claims
  and political settlements could disorganize the material conditions of social
  life. His theory of probability supplied a logic of rational judgment under
  incomplete evidence, distinguishing probability from evidential weight and
  denying that every uncertainty could be reduced to a numerical risk. Monetary
  reform therefore became an exercise of deliberate judgment directed toward
  stable prices, trade, and employment rather than a mechanical defense of gold
  parity. In The General Theory, money entered the determination of output as a
  whole: effective demand governed employment; consumption depended upon income;
  investment depended upon prospective yields, confidence, and the rate of
  interest; liquidity preference made the interest rate a monetary phenomenon;
  and saving adjusted to investment through changes in income. A monetary
  economy could consequently settle into equilibrium below full employment,
  making public influence over consumption, interest, and investment a condition
  for preserving both productive capacity and individual freedom.

scope:
  subject: >-
    The intellectual formation of the modern money economy from the classical
    subordination of acquisition to the polis through Locke, Hume, Smith,
    Ricardo, Marx, the independent Jevonsian, Mengerian, and Walrasian
    reconstructions of post-classical marginalism, their Marshallian
    consolidation into neoclassical economics, and Keynes's reconstruction of
    the economy as a monetary system governed by effective demand, expectations,
    liquidity, and politically administered institutions.
  geography:
    - ancient Greek political philosophy as the comparative baseline
    - seventeenth-century England
    - eighteenth-century Scotland and Great Britain
    - nineteenth-century Britain and continental Europe
    - twentieth-century Britain, British India, and the European and international monetary system
  period: Classical political philosophy through Keynes's General Theory
  narrative_companion: narratives/STAR-MONEY-001.md
  periodization: >-
    Locke and Hume form the pre-classical foundations of the sequence; Smith and
    Ricardo establish classical political economy; Marx is treated as its
    culmination and internal critique; Jevons, Menger, and Walras independently
    open three distinct constructions of the post-classical marginalist period;
    Marshall consolidates the new analysis into a time-sensitive neoclassical
    framework of value, distribution, money, credit, commerce, and industrial
    fluctuation; Keynes begins within that inherited monetary and analytical
    world and reconstructs it around uncertainty, effective demand, aggregate
    output, employment, liquidity preference, and the public guidance of
    investment. This organizing periodization does not require every history of
    economics to use identical boundaries.
  exclusions:
    - A universal history of money in every civilization
    - A complete history of banking, corporations, securities, central banking, or public finance
    - A complete institutional history of modern corporate finance beyond the organizations analyzed by Marshall
    - Later revisions of Walras and post-Walrasian developments in general equilibrium theory
    - Continental and later neoclassical branches not represented by the supplied primary texts
    - A complete reconstruction of Keynes's 1930 Treatise on Money, which is not among the supplied sources
    - Later Keynesian, neo-Keynesian, New Keynesian, Post-Keynesian, monetarist, or macroeconomic schools
    - A claim that intellectual teachings alone caused later economic institutions

shape:
  model: INTELLECTUAL_GENEALOGY_OF_ECONOMIC_ORDER
  rules:
    - Money is mapped through property, obligation, exchange, production, distribution, credit, law, and political authority; it is not treated as an isolated object.
    - The sequence records transformations in questions and concepts, not an inevitable causal chain.
    - A teaching is attributed to its thinker and is not converted into an unqualified empirical law.
    - The existence of economic regularities does not by itself settle questions of justice, rightful distribution, or the common good.
    - Locke's natural right, Hume's convention, Smith's commercial society, Ricardo's distribution system, and Marx's critique remain distinct positions.
    - The technical economic reconstruction supplied by Joseph Cropsey remains distinguishable from Leo Strauss's philosophical interpretation of Marx.
    - Marx's account of capitalist economic laws as historically specific is distinguishable from a claim that every society is governed by the same categories.
    - Jevons's, Menger's, and Walras's independent marginal theories remain distinct rather than being collapsed into a single doctrine.
    - Jevons's rejection of labor as the direct cause of value is not converted into a denial that labor and production affect supply and therefore exchange value.
    - Menger's subjective theory of value is not reduced to Jevons's calculus of pleasure and pain; its causal-genetic structure, treatment of production through time, and non-mathematical method remain visible.
    - Menger's account of the non-legislative origin of money is distinguished from the state's later role in legal tender, sanction, and coinage.
    - Walras's technical term rareté means both the condition of usefulness joined to limited quantity and, in its exact marginal use, the intensity of the last want satisfied; it is not reduced to ordinary-language rarity or treated as identical to Menger's terminology.
    - Walras's numéraire, which states relative prices in a common unit, remains distinct from money as the intermediary that decomposes barter into sale and purchase.
    - Walras's division of pure, applied, and social economics remains visible; mathematical equilibrium is not converted into a proof of utility, justice, or political legitimacy.
    - Marshall's partial-equilibrium method is distinguished from Walras's simultaneous general equilibrium and from a claim that the surrounding forces held constant are actually inert.
    - Marshall's synthesis of utility and cost is not reduced to the slogan that price is determined by two curves; time, substitution, organization, market structure, and the distinction between prime and supplementary costs remain visible.
    - Marginal productivity enters Marshall's account as the demand side of factor remuneration and is not treated as a complete theory of distribution apart from the supply, training, bargaining position, institutions, and historical conditions of each agent.
    - Marshall's cash-balance account of money is distinguished from a mechanically causal reading of the transactions identity; desired holdings, credit substitutes, confidence, and circulation alter the relation between currency and prices.
    - Keynes's monetary administration is not reduced to discretionary note issue; reserves, exchange, bank rate, banking structure, lender-of-last-resort action, international claims, and domestic employment belong to the same institutional field.
    - Keynes's Treatise on Probability is connected to the General Theory through rational judgment, non-numerical probability, evidential weight, and Keynes's own citation in his discussion of long-term expectation; it is not converted into a claim that the two works contain one unchanged technical doctrine.
    - Keynes's effective demand is an aggregate relation between expected proceeds, supply price, output, and employment, not a synonym for consumer demand alone.
    - The identity of saving and investment is not treated as prior equality between intended saving and intended investment; in Keynes's system aggregate income changes until realized saving equals realized investment.
    - Liquidity preference is distinguished from the cash-balance demand for transactions alone and from a loanable-funds theory in which saving mechanically fixes the interest rate.
    - Keynes's proposal for central controls and a socialization of investment is not described as comprehensive state ownership; his stated aim is public determination of aggregate investment and employment alongside a wide field for private initiative.
    - Later institutional histories of banking, corporate finance, financial markets, and monetary government beyond the cited sources require their own evidence and subsequent layers.

claim_policy:
  documented_textual_fact: >-
    A text, distinction, sequence, or teaching directly present in the listed
    primary work or seminar transcript.
  attributed_teaching: >-
    A proposition assigned to Locke, Hume, Smith, Ricardo, Marx, Jevons, Menger,
    Walras, Marshall, Keynes, Aristotle, Strauss, or Cropsey only as presented in
    a named source.
  analytical_synthesis: >-
    A bounded relation drawn across teachings to clarify a transformation in the
    place of money and economics within political and social life.

historical_spectrum:
  classical_subordination_of_economics:
    period: Ancient Greek political philosophy
    claim_class: ATTRIBUTED_CLASSICAL_BASELINE
    facts:
      - Aristotle treats the household as prior to the polis in generation but the polis as the completed association within which human capacities for speech, justice, and the good life can be fulfilled.
      - Household acquisition supplies the necessities of life and therefore serves household and political purposes rather than supplying the highest end of human action.
      - Exchange arises from differentiated needs, and money supplies a practically sufficient measure through which unlike goods can be exchanged.
      - Money facilitates association but does not determine justice, the best regime, or the hierarchy of human ends.
      - The pursuit of acquisition without limit differs from acquisition ordered toward the sufficient provision of a household and city.
      - Production remains subordinate to something not produced by human beings: nature, need, the human good, and political judgment.
    decisive_relation: >-
      Necessity and exchange belong inside the political whole; they do not rule
      the whole as autonomous laws.
    evidence:
      - SRC-STRAUSS-ARISTOTLE-POLITICS-1967
      - SRC-STRAUSS-ARISTOTLE-ETHICS-1968
      - SRC-STRAUSS-CROPSEY-MARX-1960

  locke_property_money_and_economic_law:
    period: Seventeenth-century natural right and the English monetary debates
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Locke begins from individuals possessing rights prior to the particular political society under which they live.
      - Each person possesses a property in his own person, and labor supplies the original title by which things held in common may be appropriated.
      - Appropriation is initially limited by use, spoilage, and leaving enough and as good for others.
      - Durable money is accepted by consent and permits perishable surpluses to be exchanged for a lasting store, making enlarged and unequal accumulation possible without immediate spoilage.
      - Political society is formed to preserve property in the broad sense of lives, liberties, and estates through known law and impartial judgment.
      - Locke's monetary writings distinguish the silver content of money from its legal denomination and deny that changing a coin's name can create the real value that its metallic content lacks.
      - Debasement alters contracts and redistributes claims between debtors and creditors rather than creating national wealth.
      - The market rate of interest follows the relation between available money, commerce, borrowing demand, and expected gain more powerfully than a statutory ceiling can command it.
    decisive_relation: >-
      Natural right establishes the separate proprietor; consensual money removes
      the immediate natural limit on accumulation; economic regularities begin
      to confront legislation as limits that political will cannot simply repeal.
    evidence:
      - SRC-LOCKE-TWO-TREATISES
      - SRC-LOCKE-CONSIDERATIONS-INTEREST-MONEY
      - SRC-LOCKE-SHORT-OBSERVATIONS-SILVER-MONEY
      - SRC-STRAUSS-CROPSEY-MARX-1960

  hume_convention_credit_and_commerce:
    period: Mid-eighteenth-century moral philosophy and political economy
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Hume does not ground property in a natural title that exists in complete form before society.
      - Scarcity, limited generosity, and human dependence make stable possession advantageous, while repeated recognition of that advantage produces conventions of property and justice.
      - Transfer by consent and the obligation of promises extend cooperation beyond immediate possession and make continuing exchange and credit possible.
      - Government stabilizes conventions when scale, distance, partiality, and conflicting interest weaken spontaneous compliance.
      - Money facilitates exchange but is not identical with national wealth, which depends upon people, industry, skill, commodities, and commerce.
      - Changes in the quantity of money affect prices and may temporarily stimulate activity while the new money passes unevenly through the economy.
      - International movements of specie tend to correct persistent trade imbalances by altering domestic prices.
      - Low interest is connected to the development of commerce, accumulated stock, numerous lenders, and opportunities for profitable employment rather than to the mere abundance of coin.
      - Public credit can mobilize present resources through claims on future revenue while creating durable taxes, creditors, and political dependence.
    decisive_relation: >-
      Property, contract, credit, and government become mutually supporting
      conventions: durable economic order arises from coordinated expectations
      rather than from either natural title alone or a single sovereign command.
    evidence:
      - SRC-HUME-TREATISE-HUMAN-NATURE
      - SRC-HUME-POLITICAL-DISCOURSES

  smith_commercial_society:
    period: Late eighteenth-century classical political economy
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Smith makes the division of labor the principal source of increasing productive power and connects its extent to the size of the market.
      - The propensity to exchange allows specialized producers to rely upon the labor of strangers rather than household self-sufficiency.
      - Money arises from the inconveniences of barter as producers converge upon commodities that others will readily accept.
      - Money serves exchange and calculation but consumes social resources when metallic circulation absorbs capital that could otherwise be productively employed.
      - Accumulated stock supports labor before the product is sold and divides into portions serving consumption, fixed capital, and circulating capital.
      - The price of commodities is distributed among wages, profit, and rent, joining market exchange to the social positions of laborers, owners of stock, and landlords.
      - Accumulation can enlarge the demand for labor and productive capacity, while the division of labor can also narrow the worker's faculties unless education and public institutions counteract its effects.
      - Commercial society depends upon justice, defense, public works, education, taxation, and public administration rather than operating outside political institutions.
      - Public debt permits extraordinary expenditure without immediate taxation while creating long-term claims upon public revenue.
    decisive_relation: >-
      Exchange, specialization, money, and accumulated stock become an
      interdependent social system capable of coordinating vast numbers of
      persons who neither know nor share a single intention.
    evidence:
      - SRC-SMITH-WEALTH-NATIONS

  ricardo_value_distribution_and_accumulation:
    period: Early nineteenth-century classical political economy
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Ricardo identifies the laws governing distribution among landlords, capitalists, and laborers as the principal problem of political economy.
      - Utility is necessary for exchangeability but does not measure exchange value; the relative labor required for production supplies the principal regulator, modified by the composition, durability, and turnover of capital.
      - Wealth is the abundance of useful goods, while value reflects the difficulty of production; machinery may therefore increase wealth while reducing the value embodied in each unit of output.
      - Differential fertility and location produce rent as cultivation extends toward less advantageous land, so rent is an effect rather than the original cause of high agricultural prices.
      - The natural price of labor includes the food, necessities, and customary conveniences required to sustain and reproduce laborers, while the market wage moves with supply and demand.
      - Profits move inversely to wages where commodity prices remain otherwise unchanged, joining the shares of labor and capital in a single distributional structure.
      - Accumulation and population increase pressure upon the production of food; dearer necessities raise money wages, falling profits weaken further accumulation, and rent rises, producing a tendency toward a stationary state.
      - Agricultural improvement and imported food can postpone declining profits, while comparative advantage shows how international specialization can increase available commodities even when one country is more productive in every line.
      - Metallic money remains a produced commodity, paper currency economizes the capital otherwise absorbed by coin, excessive issue depreciates the currency, and convertibility supplies a check upon the issuing power.
      - The benefit created by replacing costly metallic circulation with paper accrues to the issuer, making the institutional location of monetary issue a distributive and political question.
      - Interest is ultimately governed by the return on capital rather than by the quantity of currency alone or a legislated rate.
      - Machinery can increase net revenue and national wealth while reducing the gross fund that employs labor, making technological improvement compatible with displacement and deterioration in the condition of workers.
    decisive_relation: >-
      Smith's commercial history becomes a deductive system of value and class
      distribution whose internal relations provide Marx with the completed
      architecture of classical political economy.
    evidence:
      - SRC-RICARDO-WORKS-1888
      - SRC-STRAUSS-CROPSEY-MARX-1960

  marx_commodity_money_and_capital:
    period: Mid- to late nineteenth-century culmination and critique
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Marx begins from the commodity as a unity of use-value and value within a society where products are made for exchange.
      - Concrete labors produce different useful things, while their reduction to abstract socially necessary labor makes unlike commodities commensurable as values.
      - Money develops from commodity exchange as the universal equivalent in which commodity values receive a common social expression.
      - In the circuit C-M-C, money mediates the exchange of one use-value for another; in M-C-M-prime, money is advanced for the purpose of returning as a greater quantity of money.
      - Money becomes capital through a social process of valorization rather than through its physical properties as coin or paper.
      - The formally equal wage contract joins owners of money and means of production to workers who are legally free but separated from independent access to the means of production.
      - Labor-power is purchased at a value connected to its reproduction, while its use in production can create value beyond that amount; the difference supplies surplus value without requiring unequal exchange at the moment of purchase.
      - Profit, interest, and rent are distributed forms in which surplus value appears to the participants in capitalist society.
      - Capital is not merely a stock of machines, materials, or money but self-expanding value embodied in a social relation and moving through money-capital, productive capital, and commodity-capital.
      - Turnover, fixed and circulating capital, and the reproduction of total social capital connect individual enterprises to a system whose continuity depends upon the circulation and replacement of the conditions of production.
      - Accumulation reproduces not only goods and productive capacity but the separation between owners of the means of production and workers dependent upon the sale of labor-power.
      - Competition compels individual capitals to accumulate, reorganize production, introduce machinery, and reduce costs even when no participant controls the aggregate result.
      - Commodity fetishism and alienation describe a reversal in which relations produced by human beings appear as relations among things and confront their producers as objective, independent powers.
      - Political economy's categories are historically specific forms of capitalist society rather than eternal descriptions of every possible economy.
    decisive_relation: >-
      Money ceases to be merely the instrument of an exchange system and appears
      as the initiating and concluding form of a social process organized around
      the expansion of value and the reproduction of a class relation.
    evidence:
      - SRC-MARX-CAPITAL-BOOK-II
      - SRC-STRAUSS-CROPSEY-MARX-1960

  straussian_location_of_economics_within_the_whole:
    period: Strauss and Cropsey's 1960 interpretation
    claim_class: ATTRIBUTED_INTERPRETATION
    facts:
      - Cropsey distinguishes viewing economics from within its technical categories from viewing it philosophically as a part of a wider account of human life.
      - The classical comparison places need, acquisition, and production under political judgment, whereas the modern movement increasingly treats economic laws as independent limits upon political rule.
      - Marx's supremacy of production makes economics more than a specialized science: relations of production become the key to society, history, consciousness, and the relation between humanity and nature.
      - Strauss describes this enlargement as economics becoming metaphysics, the purported science of the whole.
      - Capitalist society becomes a social physics because the laws produced by human activity operate without the producers' knowledge and against their intentions as apparently natural necessities.
      - Strauss treats Marx's diagnosis of modern alienation as the strongest part of the teaching rather than treating the critique of capitalism as simply mistaken.
      - Strauss questions whether Marx can deny permanent human standards while treating proletarian emancipation as universal human emancipation.
      - The promised abolition of fixed division of labor, class rule, and the state presupposes a moral regeneration and wise use of freedom that technological abundance and collective ownership do not by themselves guarantee.
      - The attempt to conquer natural necessity also transforms human nature, leaving unresolved which human end directs the conquest and what remains capable of judging it.
      - Post-Marxian economics can narrow itself to technically refined relations among supply, demand, prices, and preferences, but that narrower science cannot determine justice, rightful distribution, or the human purposes economic activity should serve.
    decisive_relation: >-
      Marx demonstrates why economics cannot be treated as a neutral collection
      of exchanges, while Strauss demonstrates why economics cannot supply its
      own ultimate standard or replace political philosophy as knowledge of the
      human whole.
    evidence:
      - SRC-STRAUSS-CROPSEY-MARX-1960

  closure_of_the_classical_period:
    period: Conceptual boundary reached with Marx
    claim_class: ANALYTICAL_SYNTHESIS
    facts:
      - Locke makes the rights-bearing proprietor and consensual money central to enlarged accumulation.
      - Hume reconstructs possession, transfer, promise, credit, and government through convention.
      - Smith makes exchange, division of labor, money, and stock the operating system of commercial society.
      - Ricardo makes value and class distribution the unified scientific problem of political economy.
      - Marx makes the classical system the object of an immanent historical critique and reveals capital as a form of social power.
      - By the end of the sequence, money has appeared as metallic substance, legal denomination, convention, medium of exchange, measure of value, circulating social capital, credit instrument, universal equivalent, and money-capital.
      - The theoretical sequence after Marx requires the post-classical reconstruction of value and exchange, while the historical sequence requires the development of corporations, banking systems, securities markets, central banks, managerial organization, and modern corporate finance.

  jevons_marginal_utility_and_exchange:
    period: The Jevonsian opening of marginalism, 1871
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Jevons rejects the claim that the classical theory of value had reached a finished form and proposes to reconstruct political economy as a mathematical calculus of pleasure and pain.
      - Utility is not an intrinsic quality residing in a commodity; it is a relation between a quantity of a good and the wants of a person under particular circumstances.
      - Total utility is distinguished from the degree of utility attached to an increment of a commodity, and the final degree of utility designates the utility of the last or next possible increment.
      - As the available quantity of an ordinary commodity increases, the final degree of utility generally declines, resolving the apparent contradiction between the immense usefulness and low exchange value of abundant goods such as water.
      - Value is treated as a ratio of exchange rather than a substance contained in a thing, and exchange proceeds until neither party can gain additional utility by continuing at the prevailing ratio.
      - At equilibrium, the ratio of exchange between two commodities is inversely related to their final degrees of utility after exchange.
      - Labor does not directly cause value: labor affects the quantity supplied, supply affects final utility, and final utility governs the ratio of exchange.
      - Cost and production therefore remain causally present but are mediated through scarcity and the marginal conditions of consumption rather than embodied in value as a labor substance.
      - Labor itself is treated as disutility, and the duration of work is determined at the point where the expected utility of additional product no longer compensates for the pain of additional labor.
      - The focus of value theory shifts from the production and distribution of a social product among classes toward the choices of trading bodies and the statical conditions of exchange equilibrium.
      - Jevons explicitly treats equilibrium as a simplifying statical construction within an industrial world that is actually in perpetual motion and change.
    decisive_relation: >-
      Marginalism does not merely substitute desire for labor; it reconstructs
      value as the outcome of changing wants, available quantities, and exchange
      at the margin, thereby moving the organizing center of economics from class
      production and distribution toward individual calculation and equilibrium.
    evidence:
      - SRC-JEVONS-THEORY-POLITICAL-ECONOMY-1871

  jevons_money_credit_and_clearing:
    period: Monetary mechanism after the marginalist turn, 1875
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Money remedies the double coincidence required by barter, the absence of a common measure, and the difficulty of dividing and distributing goods of unequal value.
      - Its principal functions include a medium of exchange, a common measure of value, a standard for deferred payments, and a store or means of transmitting value.
      - These functions need not be performed by one material or instrument, so the monetary system cannot be understood by identifying money with a single substance.
      - Coin, token coin, convertible and inconvertible notes, cheques, bills, and other credit documents possess different legal and economic properties even when each can perform some work associated with payment.
      - Credit is a deferral of payment and a claim upon future settlement, not an unlimited multiplication of real resources by the mere production of promises.
      - Bank deposits and book credit permit reciprocal claims to be recorded and offset rather than settled separately in coin.
      - Cheques and clearing balance debts against one another so that money may remain only the unit in which obligations are expressed and need not physically pass in the great majority of large settlements.
      - The quantity of currency a nation needs depends upon the volume and prices of transactions, the speed and efficiency of circulation, banking arrangements, and the extent to which claims are cleared without cash.
      - A more developed mechanism of credit and clearing can support a larger volume of exchange with a smaller quantity of metallic or paper currency.
      - Monetary order is therefore an institutional architecture of denomination, convertibility, promises, banking relationships, settlement, and law rather than a stock of coins alone.
    decisive_relation: >-
      The same post-classical movement that locates value at the margin also
      decomposes money into functions and mechanisms: value is represented by an
      exchange ratio, while payment is increasingly accomplished through legally
      differentiated claims and the cancellation of reciprocal debts.
    evidence:
      - SRC-JEVONS-MONEY-MECHANISM-1875

  menger_causal_genetic_marginalism:
    period: The Mengerian opening of marginalism, 1871
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - A thing becomes a good only where a human need exists, the thing possesses a causal capacity to satisfy it, the person knows that causal connection, and the thing can be brought under human command.
      - Goods of first order satisfy wants directly, while goods of second and higher orders contribute indirectly through causal chains of production and must be joined with their complementary goods.
      - Economic activity is prospective provision for future needs and therefore depends upon estimates of future requirements, available quantities, production periods, technical knowledge, and uncertainty.
      - A good becomes economic when the anticipated requirement for it exceeds the quantity available within the period of foresight; goods available beyond requirements remain non-economic under those circumstances.
      - Value is neither an intrinsic property nor an independent substance but the importance a concrete good acquires when a person recognizes that some satisfaction depends upon command over it.
      - The value of a unit is governed by the least important satisfaction that would be lost if the available stock were diminished by that unit.
      - Value is subjective both in its existence and its magnitude because needs, available quantities, knowledge, and circumstances differ among persons and across time.
      - Past labor and production cost do not directly determine value; a costly product may be valueless, while a good found without labor may possess great value.
      - Value runs causally backward from the anticipated value of goods of lower order to the complementary goods of higher order required to produce them.
      - The value of productive inputs therefore depends upon the expected value of their future products rather than the value of present products or the historical expenditures already incurred.
      - Exchange becomes economic when each party values what the other possesses more highly than what would be surrendered, both recognize the opportunity, and both possess the power to transfer the goods.
      - Exchange ends at the point beyond which a further transfer would cease improving and begin worsening the satisfaction of either party's needs.
      - Price is an objective outcome formed within limits established by the parties' unequal subjective valuations; it is not identical with either party's valuation.
    decisive_relation: >-
      Menger reconstructs marginalism as a causal theory of purposive provision:
      needs confer goods-character, scarcity makes goods economic, dependence
      produces value, valuation guides exchange, and the anticipated value of
      consumer goods is imputed backward through production over time.
    evidence:
      - SRC-MENGER-GRUNDSATZE-1871-1934

  menger_saleability_and_origin_of_money:
    period: Commodity circulation and the emergence of money, 1871
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Commodities differ in saleability according to the number of possible buyers, the geographical reach of demand, the quantities that can be sold without a price concession, the time within which sale is possible, transport and storage costs, legal restrictions, and the organization of markets.
      - A producer unable to barter directly for the goods he needs can advance his purpose by accepting a more saleable commodity even when he has no immediate use for it.
      - Repeated acceptance of the most saleable commodities enlarges their marketability further, and habit and imitation generalize their acceptance throughout a trading community.
      - Money originates through the convergent actions of individuals pursuing their own economic interests rather than through an original agreement, legislative invention, or concern for a public monetary plan.
      - Different goods become money among different peoples and periods because saleability depends upon historically varying economic circumstances.
      - State sanction does not first make a commodity money, but it strengthens monetary character by making the sanctioned good acceptable for obligations to the state and for legally unspecified or substitute payments.
      - Coinage standardizes the weight and quality of monetary metal and reduces the information and verification costs that otherwise impede exchange.
      - Money cannot serve as an exact measure of an objective exchange value because actual prices form within ranges and no fixed objective equivalence between goods exists.
      - Money nevertheless becomes the most practical common instrument for estimating prices because developed exchange normally states and settles commodity prices in the most saleable good.
      - Menger's explanation connects subjective valuation to an unintended institution: money is produced by purposive acts without requiring that the resulting monetary order be designed as a whole.
    decisive_relation: >-
      Money emerges when unequal saleability changes the path of exchange: the
      individual accepts what others are most likely to accept, custom turns that
      recurring strategy into a general institution, and law subsequently
      standardizes and strengthens an order it did not originally invent.
    evidence:
      - SRC-MENGER-GRUNDSATZE-1871-1934

  walras_rarete_exchange_and_general_equilibrium:
    period: The Walrasian opening of marginalism, first edition issued in fascicles beginning 1874
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Social wealth consists of material or immaterial things that are useful and available only in limited quantity.
      - Usefulness joined to limitation makes goods appropriable, exchangeable, and susceptible to industrial production, but these consequences belong respectively to theories of property, exchange value, and industry rather than to one undifferentiated science.
      - Effective utility is the total intensity of wants satisfied by a possessed quantity, while rareté in its exact marginal sense is the intensity of the last want satisfied by that quantity.
      - Exchange value is relative rather than an intrinsic magnitude, and equilibrium price ratios correspond to ratios of the marginal raretés of the goods held after exchange.
      - Each trader reaches maximum satisfaction when the ratios of the marginal raretés of the goods retained equal the relevant price ratios, subject to the quantities possessed.
      - For two goods, a stationary price requires equality of total effective demand and total effective supply; for many goods, the same equality must hold simultaneously in every market.
      - General equilibrium also requires consistent price ratios across indirect exchanges so that arbitrage cannot obtain more of a good by passing through a third commodity.
      - Tâtonnement begins from announced prices and raises the prices of goods whose effective demand exceeds effective supply while lowering those whose effective supply exceeds effective demand.
      - Pure economics becomes a physico-mathematical theory of exchange value, while applied economics concerns useful production and social economics concerns the justice of appropriation and distribution.
    decisive_relation: >-
      Walras converts marginal valuation from a bilateral rule of exchange into a
      simultaneous price system: individual maximization, market clearing, and
      consistency among every relative price become conditions of one general
      equilibrium, without making that equilibrium a judgment about justice.
    evidence:
      - SRC-WALRAS-ELEMENTS-PURE-1874

  walras_numeraire_money_and_credit:
    period: The monetary mechanism inside the Walrasian system
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - No commodity possesses an absolutely constant value, because only relative values and prices are knowable; a numéraire supplies a common term in which those relations can be expressed.
      - A suitable numéraire approaches stability of value and universal notoriety, while a suitable money must also be divisible and durable enough to pass between possession and successive consumption.
      - The same commodity should ordinarily serve as numéraire and money so that prices are stated in the thing through which payment is made.
      - Monetary intervention replaces a difficult direct barter with a sale of a commodity for money followed by a purchase of another commodity with money.
      - Money is a commodity with an exceptional monetary use rather than either wealth itself or a commodity indistinguishable from every other.
      - The monetary use of a commodity adds to its utility and affects its value, while the value of money varies approximately inversely with its quantity under the conditions of Walras's circulation equation.
      - Precious metals approach the monetary requirements through wide acceptability, uniformity, divisibility, durability, transportability, and comparatively regular variation in value.
      - Book credits, bills of exchange, banknotes, and cheques economize metallic settlement by offsetting claims, yet retain the numéraire and metallic money virtually as the terms in which obligations are stated and settled.
      - Foreign exchange links places through interdependent claims, and arbitrage brings exchange rates toward the same general consistency required among commodity prices.
    decisive_relation: >-
      The numéraire makes the price system legible, money turns barter into sale
      and purchase, and fiduciary instruments economize metallic transfer; the
      monetary mechanism therefore enters the equilibrium system without becoming
      an invariant substance of value.
    evidence:
      - SRC-WALRAS-ELEMENTS-PURE-1874

  walras_production_capitalization_and_credit:
    period: Production and economic progress inside the Walrasian system
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Capital comprises elements of social wealth that survive their first use and yield successive services, while revenue comprises elements consumed in the first service they render.
      - Land, personal faculties, and produced capital supply productive services whose market prices appear as rent, wages, and interest.
      - The entrepreneur buys productive services and materials, combines them, and sells products, thereby linking the market for productive services to the market for products.
      - Production equilibrium requires effective demand to equal effective supply in both sets of markets and the selling price of each product to equal its cost in productive services.
      - Entrepreneurial profit and loss direct entry, expansion, withdrawal, and contraction; at the ideal equilibrium entrepreneurs make neither profit nor loss in their distinct entrepreneurial capacity.
      - This equilibrium is explicitly an ideal and normal state toward which competitive adjustments tend rather than a condition continuously realized in actual industry.
      - Saving begins from a positive excess of income over consumption beyond what is required to maintain and insure existing produced capital.
      - Credit lends money savings to entrepreneurs who purchase or produce capital goods, connecting the market for money capital to the creation of new productive capital.
      - Capitalization transforms the excess of income over consumption into the kinds and quantities of new capital that satisfy wants most fully under a common net rate of return.
    decisive_relation: >-
      Walras embeds production and accumulation in the same interdependent order as
      exchange: product prices, service prices, entrepreneurial adjustments,
      saving, credit, capital values, and the net rate of return are determined as
      connected parts of a system rather than as isolated sequences.
    evidence:
      - SRC-WALRAS-ELEMENTS-PURE-1874

  post_classical_marginalist_turn:
    period: Jevonsian, Mengerian, and Walrasian synthesis
    claim_class: ANALYTICAL_SYNTHESIS
    facts:
      - Ricardo organizes economics around labor-regulated value and distribution among social classes; Marx expands that structure into a historical theory of capital and social power.
      - Jevons reorganizes the field around individual wants, marginal increments, exchange ratios, and equilibrium while preserving production only as an indirect determinant operating through supply.
      - Menger reorganizes the same field through causal relations among needs, scarce goods, ranked satisfactions, production through time, exchange, price formation, and the differential saleability from which money emerges.
      - Walras reorganizes the field as a simultaneous mathematical system in which relative prices, individual satisfaction, exchange, production, saving, capital, credit, and money are joined through conditions of general equilibrium.
      - Jevons formulates marginalism as a mathematical calculus of pleasure and pain centered on statical exchange equilibrium; Menger develops a non-mathematical causal-genetic account centered on purposive provision and institutional emergence; Walras formulates a mathematical theory of systemic interdependence.
      - All three reject labor or cost as the direct substance of value: Jevons makes labor operate through supply and final utility, Menger derives the value of productive inputs from the expected value of their future products, and Walras relates prices to marginal rareté and the simultaneous equilibrium of products and productive services.
      - The marginalist change narrows the immediate field of economic explanation from the historical constitution of society to the allocation and exchange of scarce means as evaluated by individuals.
      - The narrowing increases analytical precision but brackets questions concerning the rightful origin of property, the constitution of classes, the formation of wants, and the ends by which production and distribution should be judged.
      - Jevons's monetary analysis simultaneously reveals that actual exchange depends upon complex institutions of credit, banking, law, and settlement that cannot be deduced from marginal utility alone.
      - Menger's monetary analysis shows how one such institution can arise from repeated individual actions before legislation and then be perfected through legal sanction and coinage.
      - Walras distinguishes the common measurement of relative prices from the monetary mediation of exchange, then integrates fiduciary circulation, production, capitalization, and credit into the equilibrium architecture.
      - Walras also preserves a formal limit that the later narrowing of economics can obscure: pure economic regularities remain distinct from applied judgments of usefulness and moral judgments of justice.
      - Marginalism therefore begins a new theoretical period without dissolving the political and institutional questions inherited from the classical system and its Marxian critique.
    decisive_relation: >-
      Marx closes classical political economy by making production the key to the
      social whole; Jevons, Menger, and Walras open post-classical economics by
      locating value in individual dependence upon marginal goods, while
      diverging over mathematics, equilibrium, time, production, institutional
      emergence, and the architecture of the whole market system. None of the
      three constructions supplies the political standard by which the resulting
      order should be judged.
    evidence:
      - SRC-JEVONS-THEORY-POLITICAL-ECONOMY-1871
      - SRC-JEVONS-MONEY-MECHANISM-1875
      - SRC-MENGER-GRUNDSATZE-1871-1934
      - SRC-WALRAS-ELEMENTS-PURE-1874
      - SRC-STRAUSS-CROPSEY-MARX-1960

  marshall_neoclassical_value_time_and_partial_equilibrium:
    period: The Marshallian consolidation of neoclassical economics
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Economics studies humanity in the ordinary business of life, especially the individual and social action connected with attaining and using the material requisites of wellbeing; it is a study of wealth but more importantly a part of the study of human beings.
      - Economic laws state tendencies rather than ethical commands, and economic reasoning supplies material that conscience, common sense, and political judgment must use in practical decisions.
      - Regular altruistic, familial, customary, and ethical motives belong within economic analysis rather than being excluded in favor of a perfectly selfish economic man.
      - The continuity of economic development makes later theory a supplementation and correction of earlier doctrines rather than a complete break, while the categories used in analysis shade into one another instead of forming rigid natural divisions.
      - Marginal utility diminishes as a person's stock of a good increases, and the marginal demand price translates that changing utility into the maximum price offered for an additional unit, given the person's resources and the marginal utility of money.
      - Individual demand schedules aggregate into market demand, elasticity measures the responsiveness of quantity demanded to price, and consumer's surplus represents the excess of willingness to pay over the amount actually paid.
      - Unequal incomes make the marginal utility of money differ across persons, limiting any inference from market demand or consumer's surplus to a complete measure of social wellbeing.
      - Supply price includes the money expenses required to call forth labor, waiting, materials, management, and the other factors needed for a given rate of output.
      - Utility and cost act together in determining value; demand has greater immediate force when existing stocks and plant are fixed, while the expenses of production acquire greater influence as time permits productive capacity to adjust.
      - Market, short-period normal, and long-period normal values correspond to different adjustment horizons rather than to one timeless equilibrium price.
      - Partial equilibrium provisionally holds surrounding forces constant so that the demand, supply, and price of a particular commodity can be studied before additional interactions are released.
      - A representative firm connects normal cost to a business with a fair share of the internal economies of its own organization and the external economies of its industrial district.
      - Increasing return, diminishing return, substitution, prime cost, supplementary cost, and quasi-rent show how organization, scale, fixed investment, and time alter the shape and meaning of supply.
      - Statical equilibrium is an instrument for precision and an introduction to the more difficult economic biology of movement, development, and organic growth, not the final form of economic explanation.
    decisive_relation: >-
      Marshall turns the marginal revolution into a durable method by joining
      marginal demand to classical cost through explicitly bounded periods of
      adjustment: partial equilibrium gains precision by isolating forces, while
      time and continuity reconnect each result to industrial change.
    evidence:
      - SRC-MARSHALL-PRINCIPLES-1930

  marshall_distribution_organization_and_progress:
    period: The neoclassical extension from commodity value to the national dividend
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - The equilibrium of demand and supply supplies one fundamental framework for the values of commodities, labor, capital services, land services, and business organization, though the practical conditions of each market differ.
      - The national dividend is both the aggregate net product of the agents of production and the source from which wages, interest, profits, and rents are paid.
      - The demand price for an agent of production reflects the value of its marginal net product and the possibilities of substituting other agents, but this demand-side condition does not by itself determine the agent's remuneration.
      - Wages are jointly influenced by marginal productivity and by the expense, time, custom, education, health, and family conditions required to rear, train, and sustain efficient labor.
      - Labor cannot be treated in practice as an ordinary commodity because a worker has only one unit of labor to sell, urgent need changes the marginal utility of money, and bargaining advantage commonly lies more heavily with employers.
      - Interest is the price paid for the use of free capital and tends toward the rate at which the demand for new investment meets the supply of saving, while habit, foresight, family affection, security, and income also govern accumulation.
      - The earnings of capital already sunk in a specialized machine or plant are quasi-rents over shorter periods because their supply cannot then respond as new free capital can.
      - Profit includes distinct returns to capital, management, organization, knowledge, risk-bearing, and business connection rather than constituting one homogeneous reward.
      - Land differs from reproducible capital because the national stock of land cannot expand in response to higher earnings, although the services of land and existing capital are both allocated among uses through demand and substitution.
      - Internal economies arise within an expanding firm, while external economies arise from the collective organization, specialized labor, knowledge, and supporting trades of an industrial district.
      - Education, health, reduced poverty, and the development of human capacities can enlarge both the efficiency of labor and the national dividend, making the quality of human life an economic cause as well as an end beyond production.
    decisive_relation: >-
      Classical class distribution is reorganized as the pricing of differentiated
      agents within one demand-and-supply system, but Marshall does not reduce
      their incomes to marginal product alone: factor supply, organization,
      bargaining, institutions, and time remain co-determinants.
    evidence:
      - SRC-MARSHALL-PRINCIPLES-1930

  marshall_money_credit_and_financial_organization:
    period: The monetary and financial structure of neoclassical economics
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Money and currency have narrower and broader meanings according to the inquiry; generally accepted coin and notes transfer command over purchasing power, while private notes and other claims depend more explicitly upon credit and legal status.
      - A cheque normally transfers command over cash between bank accounts without transferring currency itself, making bank money a central means of payment while preserving the bank's obligation to pay currency on demand.
      - Money serves immediate exchange as currency and long contracts as a standard of deferred payment, and violent changes in purchasing power impair both functions while redistributing real burdens between debtors and creditors.
      - General purchasing power cannot be measured by one invariant commodity; weighted index numbers approximate its movement, but different consumption patterns cause the same price changes to affect social classes differently.
      - People balance the convenience and bargaining power of ready purchasing power against the income or use sacrificed by holding resources in currency rather than commodities, productive assets, or securities.
      - The aggregate value of currency therefore tends toward the amount of ready purchasing power that people choose to hold in relation to their income, property, occupations, payment habits, and access to banking.
      - The identity relating currency, its circulation, and the value of transactions does not by itself explain causation; desired holdings, the circulation of goods, cheques, bills, and the state of credit govern how much work a given currency performs.
      - Credit and clearing reduce the currency needed at a given purchasing power during confidence, while distrust increases demands for currency and can abruptly contract the effective means of payment.
      - In the money market the value of money means the rate of discount or short-period interest paid for present command over money relative to a secured future payment.
      - Changes in the price level alter the real rate of interest even when the contracted money rate is unchanged, so inflation and deflation change the real burden of loans, fixed wages, salaries, mortgages, and debentures.
      - Joint-stock companies, debentures, banks, the Bank of England, stock exchanges, and internationally traded securities organize the transfer, pricing, and supervision of capital at scales beyond personal lending.
    decisive_relation: >-
      Money becomes a chosen stock of ready purchasing power embedded in a layered
      credit system: currency, bank deposits, cheques, bills, securities, and
      interest rates jointly determine how purchasing power is held, transferred,
      contracted through time, and exposed to changes in confidence and prices.
    evidence:
      - SRC-MARSHALL-MONEY-CREDIT-COMMERCE-1929

  marshall_international_commerce_and_credit_cycle:
    period: International interdependence and industrial fluctuation
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Domestic value theory assumes comparatively mobile labor and capital within a country, while international trade requires separate analysis because those agents move less freely across political boundaries.
      - The terms of trade depend upon the reciprocal volume and elasticity of national demands, and the incidence of an import or export duty varies with the responsiveness and productive conditions of the countries and goods concerned.
      - A merchandise balance does not measure a country's complete international position because shipping services, insurance, interest, profits, capital exports, and other claims also generate payments and receipts.
      - Foreign exchange, discount rates, transfers of securities, and movements of gold connect national money markets and allow multilateral claims to be settled through third and further markets.
      - An improvement of confidence expands bank book credits, bills, new enterprises, orders, employment, wages, profits, speculative purchases, and prices, each increase reinforcing the next.
      - As borrowed commitments and unfinished investments multiply, the demand for further loans rises, lenders become cautious, interest rates increase, and the refusal to renew credit forces the sale of goods and securities.
      - Falling prices weaken collateral and confidence; solvent businesses can fail when liquid obligations mature before their assets can be realized, so distrust, failure, and panic become cumulative as confidence had been.
      - The immediate failure that precipitates a crisis is not necessarily its underlying cause, which lies in the volume of credit resting on slender foundations after the expansion.
      - Telegraphy, integrated securities markets, multinational banking, and mobile financial claims widen the area of fluctuations and increasingly transmit credit conditions across national borders.
      - Monetary instability amplifies the cycle because rising prices reduce the real burden of debt during expansion, while falling prices increase it during contraction and transfer real command from traders to creditors.
      - Wider information, prudent banking, central-bank influence over discount, provision for liquidity, and contracts indexed to general purchasing power can moderate instability, but no mechanical device abolishes uncertainty or changes human nature at once.
      - Commercial fluctuation is therefore not external to neoclassical order; it arises from the cumulative interaction of expectations, credit, prices, fixed commitments, financial institutions, and international settlement.
    decisive_relation: >-
      The price system operates through a credit system whose movements are
      cumulative rather than self-correcting at every moment: confidence can
      mobilize capital and employment, then turn through leverage, illiquidity,
      falling prices, and internationally transmitted distrust into crisis.
    evidence:
      - SRC-MARSHALL-MONEY-CREDIT-COMMERCE-1929

  neoclassical_economics_layer:
    period: Marshallian consolidation of the neoclassical framework
    claim_class: ANALYTICAL_SYNTHESIS
    facts:
      - Jevons, Menger, and Walras establish distinct marginal reconstructions; Marshall converts the marginal turn into an encompassing but deliberately provisional framework for value, distribution, industrial organization, money, credit, and commerce.
      - Marginal utility becomes the demand side of price rather than a complete theory of value, while the classical concern with labor, production, cost, capital, and distribution returns on the supply side in reconstructed form.
      - Time reconciles propositions that appear contradictory when stated without a period: demand dominates the disposition of existing stocks, prime cost governs immediate production decisions, and full expenses of production gain force as capacity and organization adjust.
      - Partial equilibrium replaces the attempt to solve every market simultaneously with a sequence of bounded inquiries whose surrounding conditions are provisionally held constant and later reintroduced.
      - The theory of distribution translates the classical classes into differentiated agents of production priced through marginal demand and responsive supply, while retaining distinctive institutional conditions for labor, land, capital, and management.
      - Money is not a neutral label placed over barter: desired cash balances, bank credit, the monetary standard, debt contracts, financial markets, and changes in confidence alter prices, real obligations, investment, and employment.
      - Commercial equilibrium and commercial crisis belong to the same institutional order because credit expansion and contraction connect expectations to cumulative movements of output, leverage, prices, and solvency.
      - Marshallian neoclassical economics differs from Marx's historical anatomy of capital by treating property and enterprise chiefly as conditions and organizations within the analysis rather than as a class relation whose reproduction supplies the explanatory whole.
      - Marshall nevertheless resists treating equilibrium as a complete social philosophy: poverty, education, character, bargaining inequality, institutional change, and the ethical limits of economic inference remain explicit.
      - Neoclassical economics supplies a unified technical language for marginal demand, cost, elasticity, substitution, time periods, partial equilibrium, factor pricing, purchasing power, credit, and cycles without supplying by itself the ends that economic power should serve.
    decisive_relation: >-
      The marginal revolution becomes neoclassical economics when Marshall joins
      subjective demand to productive cost, applies their mutual determination to
      distribution, and embeds exchange in time, organization, money, credit, and
      commercial fluctuation; the resulting science is broader than a calculus of
      choice but narrower than a political philosophy of the human whole.
    evidence:
      - SRC-MARSHALL-PRINCIPLES-1930
      - SRC-MARSHALL-MONEY-CREDIT-COMMERCE-1929
      - SRC-JEVONS-THEORY-POLITICAL-ECONOMY-1871
      - SRC-JEVONS-MONEY-MECHANISM-1875
      - SRC-MENGER-GRUNDSATZE-1871-1934
      - SRC-WALRAS-ELEMENTS-PURE-1874
      - SRC-STRAUSS-CROPSEY-MARX-1960

  keynes_indian_currency_and_monetary_administration:
    period: Colonial currency, international settlement, and central banking before the First World War
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - The Indian rupee had been separated from the market value of its silver content and maintained near a fixed sterling value through government control of issue, Council Bills, sterling drafts, and reserves rather than through a legally automatic redemption of every rupee in gold.
      - The resulting gold-exchange standard distinguished a local currency of token coin and notes from the international currency in which external obligations were settled.
      - Its stability depended upon administrative practices exercised by the Government of India and the Secretary of State in London, revealing currency as a politically governed institution within an imperial financial relationship.
      - Gold circulation was not the essence of a gold standard: cheques, notes, token coins, foreign bills, and balances abroad economized gold while preserving the capacity for final international settlement.
      - The supposedly automatic international gold standard was in practice supported by central-bank discount policy, restrictions on gold payment, large reserves, foreign credits, and direct intervention in international money markets.
      - A currency reserve securing convertibility and a banking reserve supporting the money market served different purposes, although a crisis could force the authority holding one to perform the function of the other.
      - Internal banking panic, an adverse external balance, and a combined crisis required different responses; in a general crisis solvent institutions could need immediate advances against acceptable security before distrust became cumulative.
      - The separation of currency authority from banking authority weakened the system, leading Keynes toward a central bank that would unite government banking, currency reserves, and responsibility for the money market.
      - Bagehot's lender-of-last-resort principle was applied to India: reserves should be made available without delay and at a suitably high rate during panic, because an announcement of support could prevent a demand for the full amount.
    decisive_relation: >-
      Money appears at the beginning of Keynes's development as an administered
      hierarchy of local currency, bank credit, reserves, sterling claims, and
      international settlement; metallic convertibility is an institutional
      achievement of government and central banking rather than an automatic
      property of the monetary material.
    evidence:
      - SRC-KEYNES-INDIAN-CURRENCY-1913

  keynes_european_interdependence_and_the_economic_peace:
    period: War, reparations, currency breakdown, and the reconstruction of Europe
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Prewar Europe depended upon an unstable and intricate organization of population, imported food and raw materials, coal, transport, industrial specialization, foreign trade, international capital, stable currencies, credit, and legal security.
      - Germany and its neighbors formed an economically interdependent system whose productive relations crossed the political borders through which the peace settlement attempted to punish a defeated state.
      - The prewar accumulation of capital also rested upon an unequal social order in which workers consumed little and owners saved much, a settlement sustained by custom, authority, expectation, and faith in future growth.
      - Political leaders at Paris treated reparations through victory, punishment, electoral promises, and abstract legal claims while neglecting the productive capacity, transfer mechanisms, food, coal, transport, finance, and working capital required for payment and survival.
      - A money claim against Germany could not create the export surplus, foreign purchasing power, or material resources required to discharge it; extraction beyond productive capacity would injure creditors as well as debtors by disrupting the European system on which both depended.
      - Currency collapse and continuing inflation redistributed wealth unpredictably, disordered contracts and prices, damaged credit, obstructed trade, and directed social hostility toward entrepreneurs who were often beneficiaries rather than causes of the monetary process.
      - External war debts connected creditor interests to the government and economic organization of debtor states, turning monetary claims into international political entanglements.
      - Economic reconstruction required revision of reparations, settlement or cancellation of inter-Allied debts, an international loan supplying liquid working resources, and the restoration of trade between Central Europe and Russia.
      - Economic solidarity did not erase moral or political conflict, but it imposed material limits upon punishment: societies linked through production, credit, transport, and exchange could not destroy one another's economic life without transmitting the consequences throughout Europe.
    decisive_relation: >-
      The monetary economy becomes a historically fragile international order:
      law and political power can write financial claims, but they cannot make
      those claims payable when they destroy the productive, commercial, and
      monetary relations from which payment must come.
    evidence:
      - SRC-KEYNES-ECONOMIC-CONSEQUENCES-1919-1920

  keynes_probability_judgment_and_evidential_weight:
    period: The logical foundation of rational action under incomplete knowledge
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Probability concerns the degree of rational belief that a conclusion is entitled to receive from a specified body of evidence, not a property possessed by the conclusion in isolation.
      - A probability relation is objective in the logical sense that evidence constrains rational belief independently of personal caprice, even though different persons possess different bodies of evidence.
      - Rational arguments need not be demonstratively certain; metaphysics, science, conduct, and ordinary action depend upon conclusions that are inconclusive without being unfounded.
      - Not every probability is numerically measurable, and some pairs of probable judgments cannot be placed on one complete numerical scale or directly compared.
      - The probability of a conclusion must be distinguished from the weight of its argument: additional evidence can increase the body of relevant knowledge without moving the balance of probability in the same direction.
      - A judgment formed on slight evidence may have the same estimated probability as one resting on extensive evidence while remaining more vulnerable to revision.
      - Induction and analogy can make a conclusion reasonable without making it true, and their force depends upon assumptions and prior knowledge that experience alone cannot mechanically supply.
      - The General Theory later cites the distinction between improbability and uncertainty and explicitly directs the reader back to the Treatise's account of evidential weight when analyzing long-term expectation and confidence.
    decisive_relation: >-
      Economic action cannot be reconstructed as calculation under numerically
      known risk alone: rational agents must judge from evidence whose probability,
      comparability, and weight may remain incomplete, making confidence and the
      vulnerability of expectations independent economic forces.
    evidence:
      - SRC-KEYNES-TREATISE-PROBABILITY-1921
      - SRC-KEYNES-GENERAL-THEORY-1936-2013

  keynes_monetary_reform_and_managed_currency:
    period: The postwar transition from gold parity to conscious monetary government
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - Changes in the value of money matter because they operate unequally across persons, contracts, and classes, redistributing real command among investors, business owners, earners, debtors, creditors, and governments.
      - Inflation commonly benefits debtors and active business at the expense of fixed monetary claims, while deflation raises real debt burdens, discourages enterprise, reduces production, and intensifies unemployment.
      - The nominal interest rate must be distinguished from the real rate expected after price changes; unstable prices make investment depend upon forecasts that contractual money rates cannot immediately or completely absorb.
      - The quantity theory was restated through desired cash balances, bank deposits, reserve proportions, and the volume of transactions, so the relation between money and prices depended upon banking behavior and the public's chosen liquidity as well as currency issue.
      - Purchasing-power parity described a long-period relation among currencies and price levels but did not eliminate seasonal flows, capital movements, confidence, or the short-period organization of spot and forward exchange markets.
      - A country could not always stabilize both its domestic price level and a fixed foreign exchange parity when monetary conditions diverged; defending the prewar gold parity through deflation sacrificed prices, output, and employment to an external standard.
      - Monetary policy therefore required a deliberate priority: bank rate, Treasury finance, credit conditions, reserves, and the gold price should be judged primarily by domestic prices, trade, and employment rather than by a rigid reserve formula.
      - The cumulative character of the credit cycle required authorities to act from a general judgment of prices, employment, production, credit demand, interest rates, inventories, and foreign conditions before an observed price index alone announced the turn.
      - A managed currency did not abolish rules or international cooperation; it reassigned gold to reserves and temporary exchange settlement while making the conscious regulation of credit the governing instrument.
    decisive_relation: >-
      Monetary stability ceases to mean restoration of an inherited metallic
      parity and becomes a continuing act of public judgment over credit, prices,
      exchange, production, and employment in an economy whose contracts and
      expectations are denominated in money.
    evidence:
      - SRC-KEYNES-TRACT-MONETARY-REFORM-1923

  keynes_general_theory_of_the_monetary_economy:
    period: Aggregate output, employment, liquidity, and investment
    claim_class: ATTRIBUTED_TEACHING_AND_TEXTUAL_RECORD
    facts:
      - A monetary economy is one in which changing views about the future can alter the quantity of employment, not merely the direction in which a fixed quantity of resources is used.
      - The classical theory is retained as a special case whose assumptions correspond to full employment, not as a general law guaranteeing that competitive adjustment will produce full employment.
      - Entrepreneurs choose employment according to expected proceeds; effective demand is the point at which the aggregate demand function intersects the aggregate supply function and expected profit is maximized.
      - Consumption rises with income but ordinarily by less than the increase in income, so a rise in autonomous investment produces a multiplied change in income, consumption, saving, output, and employment.
      - Aggregate saving and aggregate investment are equal in realized accounting, but intended saving does not create an equal investment through an interest-rate adjustment; income changes until the saving generated by it equals the investment undertaken.
      - Investment depends upon the relation between the marginal efficiency of capital, which embodies expected prospective yields, and the rate of interest, not upon the current physical productivity of capital alone.
      - Long-term expectations depend upon confidence as well as a best forecast; organized securities markets can convert investment from enterprise based on prospective yield into speculation about the future opinion of the market.
      - Where knowledge of the distant future is slight, conventions and animal spirits sustain decisions that cannot be reduced to a weighted mathematical average of fully known outcomes.
      - Liquidity preference for transactions, precautionary, and speculative purposes makes interest the reward for parting with liquidity, while expectations of future interest rates can make additional money ineffective in lowering the current rate sufficiently.
      - Money is therefore non-neutral before full employment: changes in money and credit work through liquidity preference, interest, investment, effective demand, output, wages, and prices rather than moving the price level in one fixed proportion.
      - General wage reductions do not automatically cure unemployment because their effects operate through debt burdens, expectations, consumption, liquidity, interest, and aggregate demand, and can aggravate contraction.
      - The trade cycle arises chiefly through cumulative changes and sudden collapses in the marginal efficiency of capital, amplified by liquidity preference, interest, inventories, and the multiplier.
      - The system can reach an equilibrium with involuntary unemployment because the inducement to invest can be insufficient to absorb the saving associated with full-employment income.
      - Public policy must influence the propensity to consume, the rate of interest, and the aggregate volume of investment; a somewhat comprehensive socialization of investment is proposed without requiring state ownership of most production or abolishing private initiative.
      - Continuous full employment would undermine the scarcity return of the functionless investor, permit a gradual euthanasia of the rentier, reduce the economic pressure for nations to export unemployment to one another, and preserve individual freedom against both laissez-faire breakdown and totalitarian reaction.
    decisive_relation: >-
      Keynes replaces the presumption of an automatically self-adjusting real
      economy with a general theory of monetary production in which expectations,
      liquidity, and investment determine effective demand and employment; the
      aggregate outcome must be politically governed before the classical theory
      of allocation can operate within a full-employment volume of output.
    evidence:
      - SRC-KEYNES-GENERAL-THEORY-1936-2013

  keynesian_economics_layer:
    period: Keynes's reconstruction of neoclassical monetary economics
    claim_class: ANALYTICAL_SYNTHESIS
    facts:
      - Keynes begins within the Marshallian concern with time, money, uncertainty, business organization, and cumulative credit movement, but changes the unit of analysis from particular markets to aggregate output and employment.
      - Monetary institutions are present from the beginning of the reconstruction: administered exchange, reserves, central banking, contracts, international debts, and price stability precede the formal theory of effective demand.
      - The probability layer prevents expectations from being treated as mechanically computable forecasts; the amount and weight of evidence, conventional judgment, confidence, and animal spirits affect present investment.
      - The political critique of the Versailles settlement demonstrates that financial claims are constrained by productive capacity and systemic interdependence, anticipating the later refusal to treat accounting identities as self-executing causal mechanisms.
      - The Tract moves from an allegedly automatic gold standard to conscious monetary management, while the General Theory moves from management of the price standard to management of aggregate demand and employment.
      - Money connects an uncertain future to present action through contracts, debts, liquidity, the rate of interest, asset prices, and expected yields; it cannot be added to a completed barter equilibrium as a neutral veil.
      - A deficiency of effective demand can reproduce itself as an equilibrium, so unemployment is not necessarily a temporary deviation eliminated by flexible prices and wages.
      - State action is justified at the level where decentralized decisions fail to determine an adequate aggregate volume of investment, while decentralized allocation and private initiative remain operative within the resulting level of output.
      - The Keynesian transformation is therefore neither comprehensive planning nor a rejection of all neoclassical price theory; it makes that theory a special and subordinate analysis within a politically sustained monetary economy.
      - Economics acquires a new object of government - the aggregate level of output and employment - without acquiring from that object a complete standard of justice or the human good.
    decisive_relation: >-
      The Keynesian layer turns monetary instability, uncertainty, and crisis from
      complications surrounding price theory into determinants of the economic
      whole: political authority must sustain effective demand and investment so
      that the productive and individual freedoms promised by the market order
      can continue to exist.
    evidence:
      - SRC-KEYNES-INDIAN-CURRENCY-1913
      - SRC-KEYNES-ECONOMIC-CONSEQUENCES-1919-1920
      - SRC-KEYNES-TREATISE-PROBABILITY-1921
      - SRC-KEYNES-TRACT-MONETARY-REFORM-1923
      - SRC-KEYNES-GENERAL-THEORY-1936-2013
      - SRC-MARSHALL-PRINCIPLES-1930
      - SRC-MARSHALL-MONEY-CREDIT-COMMERCE-1929

conceptual_chain:
  classical_baseline:
    sequence:
      - natural need
      - household provision
      - exchange
      - money
      - polis
      - political judgment
      - good life
    governing_principle: Economic provision serves a political and natural order it does not create.

  locke:
    sequence:
      - self-ownership
      - labor
      - appropriation
      - property
      - exchange
      - money by consent
      - accumulation
      - unequal possession
      - government for preservation
    governing_principle: Money removes the immediate spoilage limit from labor-based appropriation.

  hume:
    sequence:
      - scarcity and limited generosity
      - convention
      - stable possession
      - transfer by consent
      - promise
      - credit
      - commerce
      - government
      - public credit
    governing_principle: Coordinated expectations make property and credit durable.

  smith:
    sequence:
      - exchange
      - division of labor
      - expansion of the market
      - money
      - accumulation of stock
      - wages profit and rent
      - commercial society
      - taxation and public debt
    governing_principle: Decentralized exchange coordinates specialized dependence through prices and accumulated stock.

  ricardo:
    sequence:
      - labor-regulated value
      - rent wages and profit
      - class distribution
      - accumulation
      - pressure on subsistence
      - falling profit and rising rent
      - stationary tendency
      - trade and technology as counterforces
    governing_principle: The shares of the three classes form one internally connected distributional system.

  marx:
    sequence:
      - commodity
      - abstract social labor
      - money as universal equivalent
      - money-capital
      - purchase of labor-power
      - surplus value
      - circulation and turnover
      - accumulation
      - reproduction of the class relation
      - fetishism and alienation
    governing_principle: Self-expanding value organizes production and reproduces the social conditions of its own continuation.

  jevons_marginalism:
    sequence:
      - want
      - utility
      - available quantity
      - declining final degree of utility
      - allocation among uses
      - ratio of exchange
      - equilibrium
      - labor and production acting through supply
    governing_principle: Value is determined at the margin by the relation between wants and available quantities, not embodied directly in labor.

  jevons_monetary_mechanism:
    sequence:
      - inconveniences of barter
      - medium of exchange
      - common measure of value
      - standard of deferred payment
      - store and transfer of value
      - coin and representative money
      - credit and bank deposits
      - cheques
      - clearing and cancellation of debts
      - economized currency
    governing_principle: Monetary functions can be separated among different instruments, and institutional settlement can perform exchange without the physical movement of money.

  menger_causal_genetic_sequence:
    sequence:
      - human need
      - causal means of satisfaction
      - knowledge and command
      - goods of first and higher orders
      - future requirements and available quantities
      - economic scarcity
      - subjective value of the marginal unit
      - imputation to complementary productive goods
      - exchange within valuation limits
      - price formation
    governing_principle: The importance of satisfying wants confers value upon scarce consumer goods and, prospectively, upon the productive goods that cause them.

  menger_origin_of_money:
    sequence:
      - unequal saleability of commodities
      - frustrated direct barter
      - acceptance of a more saleable intermediate good
      - repeated individual advantage
      - habit and imitation
      - general acceptability
      - money
      - state sanction
      - standardized coinage
    governing_principle: Money emerges unintentionally from individual efforts to improve exchange and is later strengthened and standardized by political authority.

  walras_general_equilibrium:
    sequence:
      - useful things limited in quantity
      - effective utility
      - rareté of the last want satisfied
      - maximum satisfaction
      - effective demand and supply
      - equilibrium price ratios
      - consistency across indirect exchanges
      - tâtonnement
      - simultaneous market clearing
    governing_principle: Every relative price belongs to one interdependent system in which individual marginal conditions and market-clearing conditions must be satisfied together.

  walras_money_production_and_capitalization:
    sequence:
      - numéraire as the common term of relative prices
      - money as intermediary of sale and purchase
      - fiduciary economization of metallic settlement
      - markets for products and productive services
      - entrepreneurial profit and loss
      - equality of selling price and cost at equilibrium
      - excess of income over consumption
      - saving
      - credit
      - new productive capital
      - common net rate of return
    governing_principle: Money, production, and capital formation are connected markets within general equilibrium, while usefulness and justice remain questions outside the proof of equilibrium itself.

  marshall_neoclassical_price_and_distribution:
    sequence:
      - wants and marginal utility
      - marginal demand price
      - market demand and elasticity
      - labor waiting and organization
      - marginal supply price
      - temporary market equilibrium
      - short-period normal value
      - long-period normal value
      - representative firm and economies of scale
      - substitution among productive agents
      - marginal net products
      - wages interest profit and rent
      - distribution of the national dividend
    governing_principle: Demand and supply mutually determine value and distribution, but the content of each side and the margin relevant to it change with time, organization, bargaining conditions, and the responsiveness of productive agents.

  marshall_money_credit_and_cycle:
    sequence:
      - medium of current exchange
      - standard of deferred payment
      - desired ready purchasing power
      - currency and bank deposits
      - cheques bills and clearing
      - money-market discount rate
      - joint-stock finance and securities
      - expanding confidence and credit
      - investment employment and rising prices
      - leverage and tightening liquidity
      - forced sales falling prices and failures
      - internationally transmitted contraction
    governing_principle: The amount and value of effective purchasing power depend upon desired holdings and credit organization, while changes in confidence make that organization a cumulative transmitter of both expansion and crisis.

  keynes_probability_expectation_and_investment:
    sequence:
      - incomplete evidence
      - logical probability
      - non-numerical and incomparable judgments
      - evidential weight
      - confidence in the best forecast
      - convention
      - animal spirits
      - prospective yield of durable capital
      - marginal efficiency of capital
      - present investment
    governing_principle: The future influences current production through judgments whose rationality depends upon evidence but whose uncertainty and weight cannot ordinarily be compressed into a mechanically complete calculation.

  keynes_monetary_economy_and_effective_demand:
    sequence:
      - administered currency and international reserves
      - monetary contracts and purchasing power
      - managed credit and the rate of interest
      - liquidity preference
      - long-term expectations and confidence
      - marginal efficiency of capital
      - investment
      - effective demand
      - output income and employment
      - consumption and the multiplier
      - realized saving equal to realized investment
      - trade cycle and underemployment equilibrium
      - public guidance of aggregate investment
    governing_principle: Money connects views of the future to present employment, so the aggregate volume of production is not self-adjusting and must be sustained through political influence over credit, consumption, interest, and investment.

comparative_matrix:
  Locke:
    property: A natural right originating in self-ownership and labor.
    money: A durable store and medium accepted by consent that permits enlarged accumulation.
    value: Distinguished from legal denomination in the monetary writings; silver content cannot be created by naming.
    politics: Government preserves pre-political rights and settled property.
    unresolved_problem: Purchased labor complicates the relation between personal labor and ownership of the product.

  Hume:
    property: A convention stabilized by common interest and repeated recognition.
    money: A circulating instrument whose quantity is not identical with national wealth.
    value: Emerges within exchange, scarcity, industry, and convention rather than from a natural title.
    politics: Government supports justice, promise, commerce, taxation, and public credit at scale.
    unresolved_problem: Public credit enlarges present capacity while binding future revenue and political judgment.

  Smith:
    property: An institution of commercial society protected by justice and government.
    money: The common instrument of exchange and a costly part of circulating social stock.
    value: Labor, wages, profit, rent, natural price, and market price remain connected but not reduced to one perfectly unified formula.
    politics: Commercial order requires defense, justice, public works, education, taxation, and debt administration.
    unresolved_problem: Specialization increases wealth while narrowing the faculties of the specialized worker.

  Ricardo:
    property: The established distributional structure of landlords, capitalists, and laborers.
    money: A produced monetary commodity or disciplined paper representative that measures and circulates real relations.
    value: Principally regulated by relative labor requirements, with modifications arising from capital and time.
    politics: Policy affects class shares through taxation, trade, agriculture, currency, banking, and debt.
    unresolved_problem: Increasing aggregate wealth can coexist with falling profit, displacement, and worsening labor conditions.

  Marx:
    property: A historically produced class relation separating workers from the means of production.
    money: The universal equivalent and the initial and final form of the circuit of capital.
    value: The social form of abstract labor expressed through commodities and money.
    politics: Law and the state secure and reproduce a social order whose economic categories appear autonomous.
    unresolved_problem: The diagnosis of alienation does not by itself prove that collective ownership and productive abundance will abolish necessity, hierarchy, or the need for moral and political judgment.

  Jevons:
    property: Treated chiefly as an existing condition of possession and exchange rather than derived through a political theory of rightful acquisition.
    money: A differentiated set of functions performed through coin, paper, credit documents, bank accounts, cheques, and clearing.
    value: A ratio of exchange governed at equilibrium by the final degrees of utility attached to available quantities.
    politics: Law and administration shape coinage, legal tender, convertibility, banking, and settlement, but justice and the ends of the economic order lie outside the marginal calculus.
    unresolved_problem: Formal precision in choice and equilibrium does not explain the historical production of wants, property relations, class power, or the standard by which an allocation should be judged.

  Menger:
    property: Command over goods is a condition of economic action, but the rightful origin and distribution of that command are not derived within the theory of goods.
    money: The most saleable commodity, produced through repeated individual exchanges and later perfected by custom, legal sanction, and coinage.
    value: The subjective importance of a good determined by the least important satisfaction dependent upon a unit of the available stock.
    politics: The state does not originate money, but its power over obligations, legal acceptance, and coinage can strengthen and standardize an existing monetary institution.
    unresolved_problem: A causal explanation of how valuation and institutions arise does not establish that existing property, market outcomes, or distributions are just.

  Walras:
    property: Appropriation follows from limitation, but the legitimacy of property and distribution belongs to social economics rather than the pure theory of exchange value.
    money: A commodity intermediary distinct from the numéraire, supplemented by fiduciary instruments that reduce metallic settlement while preserving monetary accounting and obligation.
    value: A relative price structure grounded in marginal rareté, individual maximum satisfaction, and simultaneous equality of effective demand and supply.
    politics: Pure economics identifies formal market relations, applied economics asks what production is useful, and social economics asks what appropriation and distribution are just.
    unresolved_problem: Existence or formal consistency of equilibrium cannot prove that adjustment is continuously realized, that initial possession is rightful, or that the resulting order serves the human good.

  Marshall:
    property: Existing possession and enterprise form part of the institutional setting of exchange and production, while the rightful origin of property is not derived by the price theory itself.
    money: Ready command over general purchasing power held through currency and bank accounts, transferred through cash, cheques, bills, and securities, and valued through both its purchasing power and its money-market rate.
    value: The time-dependent equilibrium of marginal demand and marginal supply, with utility, cost, substitution, organization, and the available period of adjustment acting together.
    politics: Economic tendencies inform practical judgment but do not issue ethical commands; poverty, education, labor's bargaining position, monetary stability, banking responsibility, and institutional reform remain political concerns.
    unresolved_problem: A flexible analysis of market adjustment can disclose inequality and instability without determining whether initial purchasing power, the distribution of the national dividend, or the ends of commercial development are just.

  Keynes:
    property: Private property, monetary contracts, and decentralized enterprise remain operative, but their aggregate results depend upon public institutions and need not generate full employment or an equitable distribution by themselves.
    money: An administered system of currency, bank credit, reserves, liquidity, contractual claims, and international settlement through which changing expectations about the future determine present investment and employment.
    value: Neoclassical price and distribution theory remains valid within a given volume of output, while effective demand determines the aggregate scale at which that analysis operates.
    politics: Monetary, fiscal, banking, and investment policy must sustain domestic employment and stability without converting the entire economy into state ownership; international policy must respect the productive interdependence through which financial claims are paid.
    unresolved_problem: Public authority can raise employment and moderate monetary disorder without the economic theory alone determining the rightful distribution of wealth, the proper objects of investment, or the ultimate ends that full employment should serve.

boundaries:
  - The intellectual genealogy does not establish that modern monetary institutions were caused by texts alone.
  - The existence of money before Locke does not make Locke's account its historical origin; Locke marks a transformation in its relation to natural right and accumulation.
  - Hume's account of convention does not reduce property or promise to arbitrary agreement.
  - Smith's commercial society is not a doctrine that government has no economic or moral functions.
  - Ricardo's labor theory of relative value includes acknowledged modifications and is not identical to Marx's theory of value.
  - Marx's critique of capitalism is not treated as a neutral empirical description, and Strauss's criticism is not treated as a refutation of every Marxian economic claim.
  - Marx closes the classical period within this map but does not end the history of money, economic thought, capitalism, or financial institutions.
  - Jevons's, Menger's, and Walras's theories are independent branches of marginalism; shared marginal reasoning is not evidence for attributing identical methods or doctrines to all three.
  - Marginal utility does not make labor or cost irrelevant; in Jevons's sequence, labor alters supply, supply alters final utility, and final utility governs exchange value.
  - Menger does not derive value from past labor or production cost, but his theory gives production a causal structure through complementary higher-order goods, time, expectations, and the imputation of anticipated product value.
  - Menger's description of money as a non-legislative emergence does not imply that law is irrelevant to monetary obligations, standardization, coinage, or later monetary development.
  - Spontaneous emergence explains how a practice can arise without a common plan; it does not establish the justice, efficiency, or permanence of every institution that emerges in this manner.
  - Walras's rareté is not a synonym for absolute physical scarcity: social wealth first requires usefulness joined to limited availability, while exact marginal rareté denotes the intensity of the last want satisfied by a possessed quantity.
  - A numéraire expresses relative prices in a common term and money mediates sale and purchase; their union in one commodity does not erase their conceptual distinction.
  - The Walrasian equilibrium state is an ideal analytical construction, not a claim that actual markets remain continuously at equilibrium or converge without friction, interruption, institutions, or error.
  - Equality of effective demand and supply and consistency of relative prices establish formal economic conditions, not the legitimacy of initial possession, the justice of distribution, or the goodness of the wants being satisfied.
  - Walras's separation of pure, applied, and social economics is preserved even where the first-edition text temporarily combines pure and practical monetary analysis.
  - The Neoclassical Economics layer is specifically Marshallian and is not treated as a complete map of every British, Austrian, Lausanne, Swedish, American, or later neoclassical tradition.
  - Marshall's demand-and-supply scissors do not mean that utility and cost contribute in identical ways at every moment; their apparent relative force changes with stocks, expectations, capacity, organization, and the time allowed for adjustment.
  - Partial equilibrium is a deliberate analytical isolation under other-things-equal assumptions, not evidence that markets outside the selected field exert no influence.
  - Marshall's representative firm and long-period supply analysis are theoretical instruments whose usefulness diminishes when increasing returns, monopoly, financial control, or rapid structural change dominate actual industry.
  - Factor remuneration corresponding to marginal net product states a demand condition and does not demonstrate that the distribution of endowments, bargaining power, education, or income is natural or just.
  - Marshall's monetary analysis does not equate currency, bank deposits, cheques, bills, and securities; each transfers purchasing power through different legal, temporal, and credit relations.
  - The relation between currency and the price level is conditional upon desired cash balances, credit substitutes, confidence, and payment practices, not an invariant mechanical proportion.
  - Credit cycles are attributed to cumulative institutional processes in Marshall's account and are not converted into a universal periodic law with fixed timing.
  - Keynes's Indian monetary analysis describes currency under British imperial administration; its analytical importance does not establish the political legitimacy or justice of colonial rule.
  - The gold-exchange standard is treated as an administered relation among local currency, sterling settlement, reserves, and official practice, not as an automatic consequence of metallic convertibility.
  - The Economic Consequences of the Peace supplies Keynes's contemporary diagnosis of the Versailles order; its estimates and predictions are attributed historical judgments rather than unqualified present facts.
  - Keynes's probability theory makes rational belief dependent upon evidence without making every degree of belief numerical, subjectively arbitrary, or identical to observed statistical frequency.
  - The link from the Treatise on Probability to the General Theory is anchored in Keynes's explicit discussion of uncertainty, evidential weight, and confidence; it does not imply that every later economic concept is deduced from the earlier logical treatise.
  - The Tract on Monetary Reform is not yet the General Theory: it establishes managed money and domestic stability as political problems without yet reconstructing output and employment through effective demand as a whole.
  - The absence of Keynes's Treatise on Money from the supplied sources leaves the development between the Tract and the General Theory deliberately incomplete rather than silently reconstructed from secondary accounts.
  - Effective demand denotes expected aggregate proceeds at the employment level selected by entrepreneurs, not every political desire, consumer preference, or expenditure considered without supply conditions.
  - The accounting equality of realized saving and investment does not mean that planned saving automatically finances planned investment or that the interest rate equilibrates them at full employment.
  - Keynes's uncertainty is not synonymous with low probability; the same best forecast can carry different confidence when the weight and stability of its evidential basis differ.
  - Liquidity preference does not imply that monetary expansion can always secure full employment, because expectations, confidence, and the marginal efficiency of capital can prevent lower interest from producing sufficient investment.
  - Keynes does not reject Marshallian or classical price theory in every field; he restricts it to a special case or to allocation within an independently determined aggregate level of output.
  - The socialization of investment concerns public influence over its aggregate volume and basic return; it is not treated as a proposal for comprehensive state ownership or the abolition of private enterprise.
  - Full employment is an economic and political objective in this layer, not a complete definition of justice, freedom, or the good society.
  - Exchange equilibrium is a statical analytical construction and is not treated as proof that an actual economy is naturally harmonious, historically motionless, or politically just.
  - The separation of monetary functions does not make all credit instruments equivalent; their legal form, convertibility, maturity, and probability of payment remain distinct.
  - The institutional history of corporate finance belongs to the next layer and remains outside the present evidentiary boundary.

navigational_questions:
  - When does money merely facilitate exchange, and when does it organize production and political dependence?
  - Which economic relations are conventional, which are legally constituted, and which operate as unintended regularities?
  - How does a theory of value connect to a theory of distribution among classes?
  - What is lost and what is gained when value is reconstructed from class production and distribution as individual choice at the margin?
  - How do Jevons's mathematical equilibrium and Menger's causal-genetic analysis produce different versions of marginalism from a shared subjective turn?
  - How does Walras transform marginal exchange from a bilateral relation into a simultaneous system of interdependent markets?
  - What changes when a price is treated not in isolation but as one term in a vector constrained by every other price and by the possibility of arbitrage?
  - What does the numéraire make measurable without becoming an invariant measure of absolute value, and what additional work does money perform?
  - Can money be abstracted from the equations of equilibrium after it has institutionally separated sales from purchases and joined productive-service markets to product markets?
  - How do saving, credit, and the creation of new capital connect current consumption choices to the future productive structure?
  - How does Marshall use time to reconcile marginal utility with cost of production without returning to the classical labor theory of value?
  - What is gained and lost when Walras's simultaneous general equilibrium is replaced by Marshall's sequence of partial equilibria under other-things-equal assumptions?
  - How do representative firms, internal and external economies, and increasing returns connect price theory to the organization and geography of industry?
  - Does marginal productivity explain distribution, or only the demand side of remuneration within a wider system of supply, training, bargaining, and institutions?
  - How does unequal purchasing power limit the use of demand curves and consumer's surplus as measures of social wellbeing?
  - Why does Marshall begin monetary theory from desired holdings of ready purchasing power rather than from the transactions identity alone?
  - How do bank money, cheques, bills, securities, and central-bank reserves alter the effective supply and velocity of purchasing power without becoming identical monetary instruments?
  - At what point does mutually reinforcing confidence become leverage, illiquidity, falling collateral values, and a cumulative credit crisis?
  - How do international trade, securities, discount rates, and foreign exchange transmit a national credit movement into a wider monetary system?
  - What becomes of an automatic gold standard once its stability is shown to depend upon administrative practice, foreign credits, central-bank judgment, and lender-of-last-resort action?
  - How does the imperial relation between the rupee, sterling, the Government of India, and the Secretary of State reveal the political structure inside monetary convertibility?
  - Why can a legally valid international debt or reparation claim become economically unpayable when it destroys the productive and commercial system from which payment must come?
  - How do transport, coal, food, currency, credit, and working capital turn formally separate states into one vulnerable economic order?
  - What changes when probability is understood as a logical relation to evidence rather than a numerical frequency or subjective feeling?
  - How can the weight of evidence change without producing an equal change in the estimated probability of a conclusion?
  - Why does monetary instability alter class relations and production even when every contract continues to state the same nominal sum?
  - When domestic price and employment stability conflict with a fixed exchange parity, which object should govern monetary policy and by what judgment?
  - Why does Keynes treat a monetary economy as one in which changing views of the future alter the quantity rather than merely the direction of employment?
  - How does effective demand determine the aggregate scale of output within which neoclassical allocation and price theory can operate?
  - Why does realized saving equal realized investment through changes in income rather than through an interest rate that guarantees full employment?
  - How do uncertainty, convention, confidence, and animal spirits enter the marginal efficiency of capital and the present volume of investment?
  - When can liquidity preference prevent additional money or a lower policy rate from restoring investment and employment?
  - Why can falling wages intensify debt burdens, pessimism, and deficient demand instead of automatically clearing the labor market?
  - What must public authority determine at the aggregate level while leaving the direction of much production to decentralized initiative?
  - How do labor and production remain present after they cease to be treated as the direct cause or substance of value?
  - How does value pass from anticipated consumer goods backward to complementary productive inputs operating through time?
  - When does an economic law describe recurring conduct, and when is it treated as a limit upon political judgment?
  - Who receives the benefit created by monetary issue, credit creation, and the replacement of costly currency with cheaper instruments?
  - How can increasing wealth coexist with displacement, dependency, or declining command over the conditions of life?
  - Which parts of capitalist reproduction require markets, which require law and government, and which require historically produced class relations?
  - When money's functions are distributed among coin, paper, deposits, cheques, and clearing, where do liquidity, convertibility, and settlement risk reside?
  - Which parts of monetary order emerge through decentralized exchange, and which are created, standardized, or enforced by political authority?
  - What standards can judge an economic order if preference, production, or historical success cannot supply the human good by themselves?

