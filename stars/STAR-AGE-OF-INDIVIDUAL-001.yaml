star_id: STAR-AGE-OF-INDIVIDUAL-001
name: The historical formation of the age of the individual
status: FACT

fact: >-
  The contemporary order in which individual feeling, desire, identity, and
  self-expression became central objects of commerce and politics arose through
  a series of historically distinguishable transformations rather than from a
  single doctrine, institution, or moment. In the Mediterranean, European, and
  Atlantic line mapped here, inherited sacred, household, and civic orders were
  subjected to philosophical judgment by nature; classical philosophy was
  confronted by revelation; modern political philosophy reconstructed order
  around security, natural rights, and the separate individual; modern science
  joined knowledge to the mastery of nature; autonomy, history, revolution,
  nihilism, historicism, positivism, and existentialism successively altered the
  grounds on which human purposes were understood; and twentieth-century
  psychology, public relations, market research, and electoral technique made
  inner life increasingly measurable and administrable. By the late twentieth
  century, institutions could govern not only by repressing or adjusting desire
  but also by releasing, classifying, and satisfying it, allowing individuals to
  experience conduct studied and shaped by institutions as an expression of
  their own freedom. Older forms of authority were not simply abolished: they
  persisted, collided, and changed institutional form within the newer order.

scope:
  subject: >-
    The historical formation of the self-governing and psychologically legible
    individual, and the changing relations between that individual and older
    forms of religious, political, economic, scientific, and administrative
    authority.
  geography:
    - ancient Mediterranean
    - Jewish, Christian, and Islamic philosophical worlds where they enter the mapped line
    - early modern and modern Europe
    - twentieth-century United States and United Kingdom
  period: Prehistoric religious forms through the digital present
  narrative_companion: narratives/STAR-AGE-OF-INDIVIDUAL-001.md
  exclusions:
    - A universal history of every civilization
    - A complete history of religion, philosophy, psychology, capitalism, or democracy
    - A claim that every later development was caused by every earlier one

shape:
  model: BOUNDED_LONGUE_DUREE_GENEALOGY_AND_NETWORK
  rules:
    - Chronological succession does not by itself establish causal descent.
    - A transformation may preserve, displace, appropriate, or coexist with an older form.
    - Intellectual teaching, institutional practice, popular reception, and later use are distinct relations.
    - Similar concepts used in different periods are not presumed to have identical meanings.
    - Power is mapped through identifiable authorities, regimes, laws, institutions, property relations, practices, and techniques; it is not treated as an invisible substance.
    - Curtis supplies a documented twentieth-century sequence and an interpretive frame; his narration is not treated as independent proof of every causal claim it proposes.
    - Strauss supplies analytical distinctions and readings of the history of political philosophy; his interpretations are not substituted for the historical existence of the thinkers and institutions he analyzes.
    - Desire, choice, judgment, and freedom remain distinct relations.
    - The digital layer extends the mapped process beyond Curtis's 2002 documentary and is not attributed to him.
    - No thinker, text, institution, or regime exhausts the Star.

claim_policy:
  documented_fact: >-
    An event, institution, practice, text, teaching, or relationship directly
    witnessed by the listed sources.
  attributed_teaching: >-
    A proposition assigned to a thinker only as that thinker is presented in a
    primary text, seminar, or named interpretation.
  analytical_synthesis: >-
    A bounded relation drawn across documented facts. It organizes inquiry but
    does not erase differences between periods or establish inevitability.
  interpretive_bridge: >-
    A proposed connection requiring continued testing against independent
    historical evidence. Such bridges may orient navigation but are not allowed
    to harden into an unsupported causal law.

historical_spectrum:
  sacred_cosmic_order:
    period: Before and alongside the ancient city
    claim_class: DOCUMENTED_PATTERN_AND_INTERPRETATION
    facts:
      - Religious worlds surveyed by Eliade organized human life through sacred places, sacred times, origin myths, rites, divine or ancestral acts, and distinctions between sacred and profane.
      - These forms located birth, sexuality, subsistence, kingship, suffering, and death within an order represented as preceding any individual will.
      - Authority in this setting concerned what was real, where human beings belonged, and which acts renewed or violated the order of the world.
    boundary: >-
      This stage records recurring forms in Eliade's history of religious ideas;
      it is not a claim that all early religions were identical or that a single
      institution ruled every early society.
    evidence:
      - SRC-ELIADE-HISTORY-RELIGIOUS-IDEAS-V1

  household_ancestral_order:
    period: Archaic Greek and Roman worlds as reconstructed by Fustel de Coulanges
    claim_class: DOCUMENTED_RECONSTRUCTION
    facts:
      - Household worship joined the dead, the hearth, kinship, marriage, inheritance, adoption, property, and paternal authority.
      - The family's continuity depended upon rites transmitted through generations and attached to a household and its land.
      - Law in this reconstruction emerged from religious distinctions and obligations before it appeared as an agreement among naturally separate individuals.
    people:
      - household head
      - heir
      - ancestor
    institutions:
      - domestic cult
      - hearth
      - tomb
      - inheritance
      - household property
    boundary: >-
      Fustel's reconstruction is a governing source for this layer but is not
      treated as an uncontested or universal account of every ancient household.
    evidence:
      - SRC-FUSTEL-ANCIENT-CITY

  polis_and_regime:
    period: Ancient Greek city and classical political life
    claim_class: DOCUMENTED_INSTITUTIONAL_FORM
    facts:
      - The polis joined territory, worship, law, citizenship, education, military obligation, office, and a publicly authoritative way of life.
      - Conflicts among kings, aristocratic families, magistrates, assemblies, and popular classes concerned who ruled, under what claim, and toward which end.
      - A regime was more than a written constitution: it joined rulers, institutions, laws, education, honored human types, and a conception of the good.
      - Citizenship formed persons as members of a political whole rather than merely protecting pre-political private selves.
    institutions:
      - polis
      - civic cult
      - assembly
      - magistracy
      - law
      - civic education
    evidence:
      - SRC-FUSTEL-ANCIENT-CITY
      - SRC-STRAUSS-CITY-AND-MAN
      - SRC-STRAUSS-ARISTOTLE-POLITICS-1967
      - SRC-STRAUSS-INTRO-POLITICAL-PHILOSOPHY-1965

  discovery_of_nature_and_socratic_turn:
    period: Classical Greek philosophy
    claim_class: ATTRIBUTED_PHILOSOPHICAL_TRANSFORMATION
    facts:
      - The distinction between nature and convention made ancestral custom available for rational examination.
      - The traditional account of Socrates says that he brought philosophy down to the city by directing inquiry toward justice, courage, moderation, law, virtue, and the good.
      - Socratic inquiry began from authoritative opinions, exposed their contradictions, and replaced confident possession with knowledge of the question.
      - The trial of Socrates disclosed a recurring tension between a city's need for authoritative opinions and philosophy's examination of those opinions by a standard not created by the city.
    people:
      - Socrates
    boundary: >-
      The phrase that Socrates brought philosophy down to the city is preserved
      as the traditional account, not asserted as a literal first beginning of
      every philosophical reflection on human affairs.
    evidence:
      - SRC-STRAUSS-ORIGINS-1960
      - SRC-STRAUSS-PROBLEM-SOCRATES
      - SRC-STRAUSS-CITY-AND-MAN
      - SRC-STRAUSS-INTRO-POLITICAL-PHILOSOPHY-1965

  plato_aristotle_and_cicero:
    period: Classical and Roman political philosophy
    claim_class: ATTRIBUTED_TEACHINGS
    facts:
      - Plato's dialogues relate argument to character, circumstance, action, and the limits of political communication.
      - The Republic connects regimes to corresponding orders of the soul and shows political orders educating characteristic human types and desires.
      - The best city in speech supplies a standard for judging actual cities while displaying the improbability and limits of uniting philosophy with political rule.
      - Aristotle treats the polis as natural because it completes capacities for speech, judgment, and action concerning justice and the good.
      - Aristotle distinguishes correct regimes ordered to a common good from deviant regimes ordered primarily to the rulers' advantage, while judging practicability through circumstance and political prudence.
      - Cicero carries Greek political philosophy into Roman law and statesmanship by presenting natural right as a rational standard above enacted law and political prudence as action within imperfect circumstances.
    people:
      - Plato
      - Aristotle
      - Cicero
    evidence:
      - SRC-STRAUSS-CITY-AND-MAN
      - SRC-STRAUSS-ARISTOTLE-POLITICS-1967
      - SRC-STRAUSS-ARISTOTLE-ETHICS-1968
      - SRC-STRAUSS-CICERO-1959

  revelation_and_divine_law:
    period: Medieval Jewish, Christian, and Islamic philosophical worlds
    claim_class: ATTRIBUTED_THEOLOGICAL_POLITICAL_TRANSFORMATION
    facts:
      - Biblical revelation confronted the city and philosophy with a law claiming divine rather than civic or merely rational authority.
      - The resulting conflict concerned not only church and state but whether the highest life was grounded in obedient faith or autonomous inquiry.
      - In Strauss's treatment of Maimonides, philosophical writing had to address different readers and protect both political law and philosophic inquiry through careful modes of presentation.
      - The theological-political problem became a lasting question about the relation among revelation, philosophy, law, and political authority.
    people:
      - Maimonides
    boundary: >-
      This layer maps the revelation-philosophy problem relevant to the later
      sequence; it is not a complete history of Judaism, Christianity, Islam, or
      medieval political institutions.
    evidence:
      - SRC-STRAUSS-MAIMONIDES
      - SRC-STRAUSS-SPINOZA-CRITIQUE-RELIGION
      - SRC-STRAUSS-ORIGINS-1960

  modern_project_machiavelli_bacon_descartes:
    period: Sixteenth and seventeenth centuries
    claim_class: ATTRIBUTED_TEACHINGS_AND_SYNTHESIS
    facts:
      - Machiavelli lowered the immediate standard of political action from the best regime and classical virtue toward effectual truth, necessity, acquisition, founding, and preservation under adverse conditions.
      - The modern scientific project associated with Bacon redirected knowledge toward invention, relief of the human condition, and the enlargement of human power over natural processes.
      - Descartes's method made radical doubt and the certainty of the thinking subject a point of departure for reconstructing knowledge.
      - Nature was increasingly represented as measurable process rather than an intrinsically purposive whole whose ends governed human action.
      - The joining of method to prediction and intervention made knowledge operational: to know a process increasingly meant to acquire a capacity to reproduce, redirect, or overcome it.
    people:
      - Niccolo Machiavelli
      - Francis Bacon
      - Rene Descartes
    boundary: >-
      The three projects are related but not identical. The map does not reduce
      early modern science to Machiavelli's politics or claim that every modern
      scientist shared one political intention.
    evidence:
      - SRC-STRAUSS-THOUGHTS-MACHIAVELLI-1958
      - SRC-STRAUSS-NATURAL-RIGHT-1962
      - SRC-STRAUSS-BASIC-PRINCIPLES-1961
      - SRC-STRAUSS-INTRO-POLITICAL-PHILOSOPHY-1965

  sovereignty_natural_right_and_the_separate_individual:
    period: Seventeenth and eighteenth centuries
    claim_class: ATTRIBUTED_TEACHINGS_AND_INSTITUTIONAL_TRANSFORMATION
    facts:
      - Grotius articulated natural law in a form intended to remain intelligible across confessional division and to regulate relations among states and persons.
      - Hobbes reconstructed political order from fear of violent death, self-preservation, authorization, and the consent of naturally separate individuals.
      - In Hobbes, natural right precedes civil society, while enforceable law and stable obligation require a sovereign power capable of ending the condition of mutual insecurity.
      - Spinoza's critique of revealed religion separated philosophy from theological authority and joined freedom of thought to a political order able to contain religious conflict.
      - Locke connected natural rights to life, liberty, property, consent, limited government, and a right of resistance.
      - Across these differences, the individual increasingly appeared as the bearer of rights prior to the particular political society that protected them.
    people:
      - Hugo Grotius
      - Thomas Hobbes
      - Baruch Spinoza
      - John Locke
    institutions:
      - sovereign state
      - natural right
      - contract
      - property
      - toleration
    boundary: >-
      Natural right did not acquire one uncontested meaning. The positions of
      Grotius, Hobbes, Spinoza, and Locke remain distinct and may not be collapsed
      into a single liberal doctrine.
    evidence:
      - SRC-STRAUSS-GROTIUS-1964
      - SRC-STRAUSS-HOBBES-1964
      - SRC-STRAUSS-SPINOZA-CRITIQUE-RELIGION
      - SRC-STRAUSS-NATURAL-RIGHT-1962

  autonomy_history_and_revolution:
    period: Eighteenth and nineteenth centuries
    claim_class: ATTRIBUTED_TEACHINGS_AND_SYNTHESIS
    facts:
      - Rousseau exposed dependence, inequality, amour-propre, and artificial desire within commercial society and placed legitimate authority in a general will through which citizens would obey laws they prescribed to themselves.
      - Kant located freedom in rational autonomy: the capacity of a rational being to give itself a universal moral law rather than being ruled by inclination.
      - Hegel located freedom within historical institutions of recognition, law, civil society, and the state rather than in an isolated will outside history.
      - Marx transformed the historical account of freedom into a critique of class society, private property, alienated labor, ideology, and the material organization of production.
      - The promise of liberation thus moved through different accounts of self-legislation, recognition, historical development, and revolutionary transformation.
    people:
      - Jean-Jacques Rousseau
      - Immanuel Kant
      - G. W. F. Hegel
      - Karl Marx
    boundary: >-
      Rousseau, Kant, Hegel, and Marx do not teach one continuous doctrine. Their
      sequence records successive transformations in the location and meaning of
      freedom, not a proof that one position mechanically caused the next.
    evidence:
      - SRC-STRAUSS-ROUSSEAU-1962
      - SRC-STRAUSS-KANT-1967
      - SRC-STRAUSS-HEGEL-1965
      - SRC-STRAUSS-MARX-1960
      - SRC-STRAUSS-NATURAL-RIGHT-1962

  nietzsche_historicism_positivism_and_existentialism:
    period: Late nineteenth and twentieth centuries
    claim_class: ATTRIBUTED_TEACHINGS_AND_INTELLECTUAL_HISTORY
    facts:
      - Nietzsche diagnosed the collapse of inherited standards as nihilism and interpreted values as human creations bound to rank, will, perspective, and the problem of future legislation.
      - Historicism denied that standards could be understood apart from the historical horizons in which they arose.
      - Positivism restricted valid knowledge toward empirically observable and scientifically testable relations while excluding final ends from scientific determination.
      - Existentialism began, in Strauss's formulation, where positivism left off: scientific explanation could describe conditions of conduct but could not supply the fundamental choice of an end.
      - Existentialism affirmed decision, responsibility, authenticity, and self-creation in a world whose ends could no longer be secured by inherited nature, revelation, or progressive history.
      - Strauss treated existentialism as a serious response to relativism while arguing that its preference for authenticity already relied upon a judgment it could not ground through groundless choice alone.
    people:
      - Friedrich Nietzsche
      - Edmund Husserl
      - Martin Heidegger
    boundary: >-
      Psychology did not simply turn into existentialism. Positivistic explanation
      and existential self-creation formed distinct intellectual lines that later
      crossed in institutions and popular practices.
    evidence:
      - SRC-STRAUSS-NIETZSCHE-BGE-1971
      - SRC-STRAUSS-NIETZSCHE-ZARATHUSTRA
      - SRC-STRAUSS-HISTORICISM-RELATIVISM-1956
      - SRC-STRAUSS-RELATIVISM
      - SRC-STRAUSS-PHILOSOPHY-RIGOROUS-SCIENCE
      - SRC-STRAUSS-EXISTENTIALISM
      - SRC-STRAUSS-GERMAN-NIHILISM

  straussian_reopening_of_the_socratic_question:
    period: Twentieth century
    claim_class: ATTRIBUTED_INTERPRETIVE_PROJECT
    facts:
      - Strauss returned to Socratic political philosophy to reopen questions of the good, justice, nature, and the best way of life against the claim that all standards were historically enclosed.
      - His critique identified a self-referential problem in historicism when the universal historical limitation of truth was itself asserted as a transhistorically valid truth.
      - His critique of positivism distinguished scientific explanation of means and causes from rational judgment of ends.
      - His treatment of psychology resisted reducing rational judgment to subrational drives and preserved a distinction between desiring something and choosing or approving it.
      - The return to Socrates did not claim guaranteed possession of final answers; it defended rational inquiry into permanent questions against their premature closure.
    people:
      - Leo Strauss
      - Socrates
    boundary: >-
      This layer records Strauss's project and distinctions. It does not make
      Strauss the hidden cause of later political movements or treat every later
      appropriation of his work as faithful to his teaching.
    evidence:
      - SRC-STRAUSS-PROBLEM-SOCRATES
      - SRC-STRAUSS-RELATIVISM
      - SRC-STRAUSS-PHILOSOPHY-RIGOROUS-SCIENCE
      - SRC-STRAUSS-EXISTENTIALISM
      - SRC-STRAUSS-NATURAL-RIGHT-1962
      - SRC-STRAUSS-CITY-AND-MAN

  psychoanalysis_and_mass_management:
    period: Late nineteenth century through the interwar twentieth century
    claim_class: DOCUMENTED_INTELLECTUAL_AND_INSTITUTIONAL_HISTORY
    facts:
      - Freud described conscious reason as limited by unconscious conflict, repression, fantasy, sexuality, aggression, and inherited psychic structures.
      - Freud regarded civilization as requiring restraints upon drives whose unrestricted expression could threaten durable cooperation.
      - Edward Bernays applied psychological ideas to public relations by associating goods and public images with unconscious wishes, identity, status, and emotional attachment.
      - These techniques contributed to a model of mass democracy in which institutions sought to stabilize populations by organizing desires rather than relying only upon rational persuasion or direct command.
    people:
      - Sigmund Freud
      - Edward Bernays
    institutions:
      - psychoanalysis
      - public relations
      - advertising
      - corporation
      - mass media
    boundary: >-
      Nietzsche's influence forms part of the background to depth psychology, but
      Freud's psychology is not reduced to Nietzsche's philosophy and its
      institutional history remains distinct.
    evidence:
      - SRC-CURTIS-CENTURY-SELF-2002
      - SRC-CURTIS-CENTURY-SELF-TRANSCRIPT
      - SRC-STRAUSS-PHILOSOPHY-RIGOROUS-SCIENCE

  adjustment_repression_and_revolt:
    period: Mid-twentieth century
    claim_class: DOCUMENTED_INTELLECTUAL_AND_INSTITUTIONAL_HISTORY
    facts:
      - Ego psychology and postwar therapeutic practice often emphasized a stronger ego capable of managing impulse and adapting to social reality.
      - Psychological expertise entered family life, education, personnel management, government, and consumer research as a means of producing stable and cooperative personalities.
      - Critics of adjustment argued that conformity reproduced the needs of corporations, bureaucracies, and established social authority.
      - Wilhelm Reich and later liberation movements reversed the valuation of repression by treating release of the inner self as a path toward emancipation from authoritarian society.
      - When collective political revolt met institutional resistance and fragmentation, important parts of the counterculture redirected political hope inward toward personal transformation.
    people:
      - Anna Freud
      - Wilhelm Reich
      - Herbert Marcuse
    institutions:
      - therapy
      - education
      - personnel management
      - counterculture
      - New Left
    evidence:
      - SRC-CURTIS-CENTURY-SELF-2002
      - SRC-CURTIS-CENTURY-SELF-TRANSCRIPT

  human_potential_and_self_creation:
    period: 1960s and 1970s
    claim_class: DOCUMENTED_CULTURAL_AND_INSTITUTIONAL_HISTORY
    facts:
      - The human-potential movement developed practices intended to free an authentic or unrealized self from inherited social roles and internal restraints.
      - Esalen became an institutional center for encounter groups, therapeutic experiment, bodily practice, and personal transformation.
      - EST joined confrontational training to the proposition that the individual was responsible for the meaning of experience and could create a self rather than discover a fixed one.
      - Curtis presents Werner Erhard's formulation as a popular endpoint of existential self-creation, not as a direct continuation of academic existential philosophy.
    people:
      - Abraham Maslow
      - Fritz Perls
      - Werner Erhard
    institutions:
      - Esalen Institute
      - encounter group
      - EST
      - human-potential movement
    boundary: >-
      Similar language does not establish that EST faithfully represented
      Nietzsche, Heidegger, Sartre, or Strauss. The relation is one of cultural
      reception and institutional convergence, not doctrinal identity.
    evidence:
      - SRC-CURTIS-CENTURY-SELF-2002
      - SRC-CURTIS-CENTURY-SELF-TRANSCRIPT
      - SRC-STRAUSS-EXISTENTIALISM

  measured_lifestyles_and_the_market_of_identity:
    period: 1970s through the late twentieth century
    claim_class: DOCUMENTED_INSTITUTIONAL_HISTORY
    facts:
      - Stanford Research Institute's Values and Lifestyles program used questionnaires and psychological categories to segment consumers by values, aspirations, and forms of self-expression.
      - Market researchers converted anti-conformity, authenticity, spirituality, sexuality, ecological concern, rebellion, and personal growth into differentiated consumer profiles.
      - Flexible production and proliferating product varieties allowed firms to sell goods as instruments of identity rather than only as answers to stable material needs.
      - Individuals could experience consumption as self-creation while organizations treated their choices as predictable expressions of a lifestyle group.
      - Positivistic measurement and existential language crossed institutionally: one described a self creating meaning, while the other translated its expressions into data.
    institutions:
      - Stanford Research Institute
      - Values and Lifestyles program
      - market research
      - segmented production
      - advertising
    evidence:
      - SRC-CURTIS-CENTURY-SELF-2002
      - SRC-CURTIS-CENTURY-SELF-TRANSCRIPT

  consumer_democracy:
    period: 1980s through the early twenty-first century
    claim_class: DOCUMENTED_POLITICAL_AND_INSTITUTIONAL_HISTORY
    facts:
      - Reagan and Thatcher linked political freedom to market choice, private initiative, and reduced collective direction by the state.
      - Clinton's Democrats and New Labour adopted focus groups, lifestyle research, and psychological segmentation to reach voters no longer understood primarily through class or durable collective identity.
      - Political organizations increasingly treated fears, aspirations, frustrations, and private wants as demands to be discovered, reflected, and satisfied.
      - This made politics more responsive to expressed preferences without transferring control of major institutions to the people whose preferences were measured.
      - The citizen was increasingly addressed as a political consumer, while collective judgment about common ends became harder to sustain.
    people:
      - Ronald Reagan
      - Margaret Thatcher
      - Bill Clinton
      - Tony Blair
    institutions:
      - focus group
      - political consultancy
      - lifestyle segmentation
      - permanent campaign
    boundary: >-
      Responsiveness, manipulation, democratic participation, and institutional
      control are distinct relations. The use of market techniques does not prove
      that every voter preference was manufactured or that elections ceased to
      matter.
    evidence:
      - SRC-CURTIS-CENTURY-SELF-2002
      - SRC-CURTIS-CENTURY-SELF-TRANSCRIPT

  digital_extension:
    period: Twenty-first century
    claim_class: ANALYTICAL_EXTENSION_REQUIRING_CONTINUED_PROBE
    facts:
      - Digitally mediated activity produces continuous behavioral records from searches, attention, purchases, movement, communication, and social relations.
      - Organizations can use those records to segment people, predict conduct, test responses, personalize environments, and alter subsequent behavior.
      - Personalization can appear to users as an environment produced by their own choices while the system observes and modifies the conditions under which later choices are made.
      - The digital system enlarges the scale and speed at which the measured self and the self-creating individual can be joined institutionally.
    institutions:
      - digital platform
      - behavioral advertising system
      - recommender system
      - data broker
      - computational political campaign
    boundary: >-
      This is a post-Curtis extension of the mapped structure, not part of the
      historical endpoint narrated in The Century of the Self. Specific platform
      claims require their own sources and may become separate Stars.
    evidence:
      - SRC-CURTIS-CANT-GET-YOU-OUT-2021

crossing_lines:
  positivistic_explanation:
    proposition: >-
      Human conduct can be treated as an object produced by observable causes,
      classified through repeatable methods, and predicted with varying degrees
      of success.
    strength: It creates operational knowledge of patterns and means.
    limit: It cannot by its own method determine the human end for which that knowledge should be used.

  existential_self_creation:
    proposition: >-
      The individual is not exhausted by causal description and may understand
      himself as responsible for choosing, creating, or affirming meaning.
    strength: It preserves responsibility and the experience of freedom against reduction to mechanism.
    limit: Choice alone cannot establish why one commitment is just, good, or worthy rather than another.

  institutional_convergence:
    proposition: >-
      Modern institutions can invite individuals to experience themselves as
      creators of meaning while measuring the expressions of that creation as
      preferences, lifestyles, probabilities, and administrable signals.
    result: >-
      Liberation and classification cease to be simple opposites. The release of
      desire can enlarge both individual options and institutional capacities to
      organize conduct.
    evidence:
      - SRC-CURTIS-CENTURY-SELF-2002
      - SRC-STRAUSS-EXISTENTIALISM
      - SRC-STRAUSS-PHILOSOPHY-RIGOROUS-SCIENCE

