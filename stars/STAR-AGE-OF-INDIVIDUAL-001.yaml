connections_to_other_stars:
  STAR-NEOCON-001:
    relation: >-
      Leo Strauss's recovery of classical political philosophy became one of
      several intellectual influences carried by people and institutions later
      associated with American neoconservatism. The present Star maps Strauss's
      place within a much longer history of nature, right, historicism, nihilism,
      and the modern individual; STAR-NEOCON-001 maps the separate historical
      movement in which some of those ideas were received, transformed, combined
      with other streams, and applied politically.
    shared_people_and_nodes:
      - Leo Strauss
      - classical political philosophy
      - natural right
      - critique of relativism
      - modernity
    boundary: >-
      Strauss is not reducible to neoconservatism, and neoconservatism is not
      treated as the necessary political result of Strauss's teaching.

  STAR-US-NATSEC-001:
    relation: >-
      The postwar national-security architecture became one institutional field
      in which psychological strategy, covert action, scientific expertise,
      surveillance, and mass administration operated as permanent governmental
      capabilities. The present Star maps the longer transformation through which
      human conduct and inner life became objects of scientific and political
      technique; STAR-US-NATSEC-001 maps the distinct American institutions that
      exercised some of those capabilities after World War II.
    shared_functions_and_techniques:
      - psychological strategy
      - scientific and technical expertise
      - surveillance
      - classification
      - mass administration
      - public persuasion
    boundary: >-
      The national-security state is institutionally older and broader than the
      twentieth-century psychological sequence mapped here. Neither Star is
      derived from the other, and an overlap of techniques does not establish a
      single purpose or unified control.

boundaries:
  - The Star does not treat power as a single agent, substance, or intention moving unchanged through history.
  - The Star does not claim that sacred order inevitably produced the digital platform.
  - The Star does not claim that later forms wholly replaced earlier religious, household, civic, legal, or sovereign forms.
  - The Star is a bounded Mediterranean-European-Atlantic genealogy, not a universal ranking of civilizations.
  - Fustel, Eliade, Strauss, and Curtis remain identifiable interpreters whose frameworks must not be mistaken for unmediated total history.
  - Documentary narration and archival montage establish a source record and historical sequence but do not independently prove every broad causal interpretation.
  - The existence of psychological or market influence does not prove that individual desires are unreal, wholly fabricated, or never freely affirmed.
  - The capacity to predict conduct does not establish complete control over persons.
  - The use of consumer research in politics does not erase elections, law, political conflict, or institutional differences.
  - Strauss's criticism of reductive psychology does not entail denial of unconscious motivation, bodily influence, or empirical psychological findings.
  - Existentialism is not treated as a stage produced by positivistic psychology; the two lines remain analytically distinct.
  - The digital extension requires additional institution-specific Stars and sources before claims about particular platforms can be fixed as canonical fact.

navigational_questions:
  - Which older forms of authority remain active inside a later regime, and in what altered institutional form?
  - When does an appeal to individual freedom transfer effective control, and when does it only personalize the options offered by existing institutions?
  - Which institutions possess the power to classify desires, define alternatives, and act on the resulting knowledge?
  - How does a regime educate the characteristic human type it publicly honors?
  - Where do causal explanation and judgment of ends become confused?
  - Which connections are documented transmissions, which are parallel responses to a shared problem, and which are only retrospective resemblance?
  - What collective capacities are lost when the citizen is addressed primarily as a consumer?
  - What standards remain available for judging desires after nature, revelation, and historical progress have lost public authority?

