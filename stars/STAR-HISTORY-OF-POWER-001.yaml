  authoritative_syntheses:
    - title: Sacred Science - The King of Pharaonic Theocracy
      author: R. A. Schwaller de Lubicz
      role: Sacred science, theocracy, the royal principle, divine names, crowns, coronation, priest-kingship, myth, and the Osirian and Horian paths.
    - title: The Egyptian Miracle - An Introduction to the Wisdom of the Temple
      author: R. A. Schwaller de Lubicz
      role: Natural symbol, hieroglyphic thought, number, House of Life, intelligence of the heart, Anthropocosmos, temple architecture, and royal ascent.
    - title: Serpent in the Sky - The High Wisdom of Ancient Egypt
      author: John Anthony West
      role: Egyptian civilization as inherited sacred science, the symbolist reading of myth and temple, Luxor as Temple of Man, earliest completeness, Sphinx weathering, and the older civilization named Atlantis.
    - title: The Religion of Ancient Egypt
      author: W. M. Flinders Petrie
      role: Gods, human constitution, future life, cosmogony, daily ritual, priestly grades, the king as priest of the land, sacred books, private worship, and ethics.
      url: https://www.gutenberg.org/ebooks/29010
    - title: Egyptian Decorative Art
      author: W. M. Flinders Petrie
      role: Uraeus, winged disc, ankh, was, djed, sema, royal judgment, protection, destruction, stability, union, and the distinction between symbol and ornament.
      url: https://www.gutenberg.org/ebooks/70049
    - title: The Arts and Crafts of Ancient Egypt
      author: W. M. Flinders Petrie
      role: Art as civilizational character, monument as illustrated service-book, architectural form, craft training, hard-stone technique, and early precision.
      url: https://www.gutenberg.org/ebooks/52830
    - title: The Status of the Jews in Egypt
      author: W. M. Flinders Petrie
      role: Foreign rule, labor status, skilled artisans, protected settlements, Egyptian legal assimilation, temple communities, and the reversibility of security.
      url: https://www.gutenberg.org/ebooks/56444
  classical_witnesses:
    - title: The Histories
      author: Herodotus
      translator: Robin Waterfield
      editor: Carolyn Dewald
      role: Book Two on Egyptian priestly memory, historical inquiry, custom, the Nile, ritual, institutions, kingship, monuments, foreign settlement, and transmission to Greece; Books One and Three through Nine on Median monarchy, Cyrus's Persian liberation and conquests, Persian custom, Cambyses, the constitutional debate, Darius's satrapies and tribute, the Royal Road, the Scythian expedition, dependent tyrants, the Ionian revolt, Athenian freedom, Xerxes's invasion, Demaratus on law, Salamis, Plataea, imperial defeat, and Cyrus's final warning about land, character, rule, and slavery.
    - title: The History of the Peloponnesian War
      author: Thucydides
      translator: Henry Dale
      role: Archaeology of Greek power, the growth of Athens and Spartan fear, Athenian accounts of empire, Periclean democracy and leadership, plague, the Mytilenean debate, and Corcyraean stasis as witnesses to the relation among regime, speech, necessity, and action.
    - title: Hellenica - Selections
      author: Xenophon
      editor: Carleton L. Brownson
      role: Arginusae, Aegospotami, the fall of Athens, the Thirty, Theramenes, democratic restoration and amnesty, Spartan governors and oligarchic boards, the King's Peace, the Cadmea, Leuctra, and Mantinea as witnesses to law, revolution, reconciliation, autonomy, and successive hegemonies.
