  xenophontic_second_level_tension:
    subject: SOCRATIC_SELF_RULE_POLITICAL_COMMAND_AND_WILLING_OBEDIENCE
    strauss_1963_position: >-
      Socrates and Cyrus form the two poles of Xenophon's corpus; Hiero
      distinguishes lawful kingship from the improvement of tyranny,
      Lacedaemonian praise is governed by the closing departure from Lycurgan
      law, and the Cyropaedia moves from constitutional education through
      personal imperial rule to degeneration after Cyrus.
    strauss_1969_70_position: >-
      The Oeconomicus must be read beside the Memorabilia without being
      collapsed into it: property becomes useful through knowledge, appetite
      makes apparently free householders slaves, Ischomachus's competence is
      real but not identical with Socratic wisdom, and the household analogy
      raises rather than settles the question of political rule.
    strauss_socratic_discourse_position: >-
      The Memorabilia is ordered chiefly toward the defense of Socrates'
      justice, whereas the Oeconomicus permits Socratic discourse to examine
      use apart from rightful possession and to distinguish the practical
      gentleman from Socrates through the dialogue's structure, reported
      speech, and ending.
    attribution_control: >-
      Xenophon's Socratic Discourse is authored by Leo Strauss, includes a
      literal Oeconomicus translation by Carnes Lord, and is not a Seth
      Benardete interpretation merely because the acquired file is stored in
      the Benardete directory.
    governing_rule: >-
      These readings authorize attention to Xenophon's literary structure,
      differences of genre, reversals, and endings, but do not make every
      ancient praise ironic, convert silence into denial, or replace the deeds
      and speeches of the primary witnesses.
  aristotelian_primary_witnesses:
    - title: Aristotle, Complete Works
      path: /Users/onepiece/Downloads/ancient greece/Aristotle-The-Complete-Aristotle.pdf
      represented_extent:
        - Nicomachean Ethics
        - Politics
        - Constitution of Athens
        - Rhetoric
        - Poetics
      witness_class: ANCIENT_ETHICAL_POLITICAL_HISTORICAL_RHETORICAL_AND_POETIC_INQUIRY
      governing_constraint: >-
        The works govern as distinct but connected inquiries: ethical action
        leads into legislation and regime; political distinctions are tested
        against concrete institutions; rhetoric examines persuasion under
        conditions of civic judgment; and poetics examines how action becomes
        intelligible through imitation and story. No second-level synthesis
        replaces the differences among those works.
  aristotelian_second_level_tension:
    subject: MORAL_POLITICAL_WHOLE_REGIME_AND_THE_LIMITS_OF_CIVIC_COMPLETION
    strauss_practical_science_position: >-
      Aristotle founds political science by making the moral-political sphere
      available as a differentiated whole whose principles can be known from
      practical experience without deduction from theoretical science, while
      that practical understanding remains in need of defense against false
      accounts of nature and the whole.
    strauss_polis_regime_position: >-
      The movement from polis to regime corresponds to the tension between the
      human being and the citizen: the regime gives political form, education,
      and end to the city, while the difference between the good citizen and
      the good human being is resolved only in the best regime.
    strauss_best_city_difficulty: >-
      The best city's leisure and education depend upon workers excluded from
      citizenship and upon slaves who cannot simply be identified with the
      narrowly defined natural slave; the account therefore exposes an
      injustice within the apparent political completion rather than allowing
      nature to legitimate every Greek practice.
    davis_introduction_to_benardete_davis_translation: >-
      Davis's introduction presents On Poetics as concerning the structure of
      human action as well as tragedy: muthos joins inherited story to
      constructed plot, character becomes visible through deed, and resolution
      can function as a reflective analysis that discloses what was present but
      unseen in the action from its beginning.
    governing_rule: >-
      These second-level readings direct attention to structure, tension, and
      the relation among Aristotle's works without displacing his arguments,
      the concrete constitutional history, or the tragic witnesses. The
      translation is the work of Benardete and Davis, while its introduction
      is attributed to Davis rather than silently to Benardete alone.
  greek_number_second_level:
    subject: ARITHMOS_PYTHAGOREAN_COSMOLOGY_PLATONIC_TRANSFORMATION_AND_MODERN_SYMBOLISM
    primary_ancient_anchors:
      - Plato, Theaetetus 198c
      - Plato, Republic 510b-511b and 525c-531d
      - Plato, Sophist 238a-259e
      - Aristotle, Metaphysics A 5-6, M 6-9, and N 3
      - Aristotle, Physics 3.7 and 4.12-14
      - Euclid, Elements 7, definitions 1-2
    second_level_source:
      title: Greek Mathematical Thought and the Origin of Algebra
      author: Jacob Klein
      path: /Users/onepiece/Downloads/jacob klein/Jacob Klein - Greek Mathematical Thought and the Origin of Algebra.pdf
    bounded_findings:
      - >-
        Arithmos means a determinate multitude of determinate things; the one
        is the source or measure of number rather than itself an arithmos.
      - >-
        Pythagorean number concerns the ordered being of sensible things and
        is not separated from them into a domain of modern abstract symbols.
      - >-
        Plato separates homogeneous mathematical units from sensible things
        while keeping mathematics hypothetical and subordinate to dialectic.
      - >-
        Klein interprets eidetic number as the articulated community and order
        of unique forms rather than as mathematical quantity; the evidence is
        partly Aristotelian and the interpretation remains explicitly
        second-level.
      - >-
        Aristotle denies separate being to mathematical numbers and restores
        number's dependence upon what is counted under a chosen unit.
      - >-
        Modern symbolic mathematics replaces determinate counted assemblages
        with possible determinacy inside a systematic method; Greek
        generality is not therefore an incomplete use of modern variables.
    governing_rule: >-
      Klein corrects the modern conceptual vocabulary brought to the ancient
      texts but does not replace Pythagorean testimonia, Plato, Aristotle, or
      Euclid as the governing witnesses.
