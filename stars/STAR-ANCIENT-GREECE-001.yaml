supersession_rules:
  - >-
    The integrated comedy body supersedes the earlier stand-alone Aristophanes
    draft; the earlier text remains research material and must not become a
    duplicate narrative section.
  - >-
    The integrated Homeric, Hesiodic, and Hymnic bodies supersede shallower
    preliminary passes while preserving any distinct findings verified from
    the ancient witnesses.
  - >-
    Socrates, Plato, Xenophon, Aristotle, and the Hellenistic philosophical
    transformation remain distinct research bodies, but their earlier drafts
    do not foreclose the source-grounded expansions identified by the authority
    audit.

