preserved_modern_disagreements:
  finley_and_de_ste_croix:
    question: >-
      Whether ancient economic order is understood primarily through juridical
      status and civic standing or through class relations grounded in ownership,
      labor, exploitation, and appropriation of surplus.
    finley: >-
      Status, citizenship, land, and elite valuation organize economic conduct
      within a social order that cannot be reconstructed as a modern autonomous
      economy.
    de_ste_croix: >-
      Status describes legal position but cannot replace the class relations
      through which propertied groups appropriated the labor and surplus of
      slaves, dependents, tenants, and poorer producers.
    preservation: >-
      Legal and political status remains irreducible to class, while exploitation
      and control of productive resources remain irreducible to status.
  hansen_and_ober:
    question: >-
      Whether the rule of the Athenian demos is adequately disclosed by the
      formal competences of Assembly, Council, courts, and magistrates or also
      requires the mass capacity to judge, discipline, and redirect elite action.
    institutional_account: >-
      Constitutional reconstruction locates popular authority in the defined
      powers, procedures, and relations of the democratic institutions.
    ober: >-
      Institutional anatomy does not exhaust democratic power because elite
      speakers and leaders competed before citizen audiences able to authorize,
      reject, audit, punish, and recall them.
    preservation: >-
      Formal competence and mass judgment disclose distinct dimensions of how
      the demos ruled and neither is silently substituted for the other.

