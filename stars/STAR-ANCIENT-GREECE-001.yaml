governing_questions:
  - How did divine and ancestral order become the order of the polis?
  - What did it mean for the polis to claim the citizen's body and soul?
  - How did household, property, cult, military formation, and citizenship fit together?
  - How were Sparta and Athens different expressions of Greek freedom?
  - How could citizen freedom coexist with slavery, exclusion, and empire?
  - How did tragedy and comedy permit the city to examine itself?
  - How did logos become a political power?
  - Why did philosophy emerge from the city while becoming capable of judging it?
  - Did Macedonia complete the Greek political movement or overcome the polis?
  - What survived of the polis after its political independence was lost?

