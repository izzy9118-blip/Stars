star_id: STAR-ANCIENT-GREECE-001
name: Ancient Greece
status: FACT

fact: >-
  Ancient Greece joined household, cult, sacred place, inherited law, public
  speech, military formation, citizenship, and competition within the polis,
  a self-governing community whose regime ordered rulers and ruled toward an
  authoritative way of life. The poleis formed a civilization through common
  gods, language, poetry, sanctuaries, festivals, contests, kinship claims,
  colonization, and inquiry without becoming one sovereign Greece. Greek
  freedom meant both the independence of a city and participation by its
  citizens in a shared order, while remaining inseparable from exclusions,
  slavery, dependent labor, subject allies, and recurrent struggles for
  hegemony. Poetry allowed the city to remember and examine the divine, heroic,
  and political worlds that formed it; tragedy made law, household, divine
  necessity, and civic judgment answer to actions no speaker fully controlled;
  comedy made war, democracy, empire, education, sex, property, poetry, and
  philosophy answer to the regimes produced by their victorious wishes;
  inquiry into nature discovered a standard not created by ancestral
  convention; Greek number joined
  determinate things, cosmic order, musical harmony, intelligible form, and
  political measure without yet becoming the abstract symbolic instrument of
  modern mathematics;
  sophistry disclosed speech as a power capable of constituting or dissolving
  civic opinion; and Socratic philosophy brought the question of nature into
  the city by examining the souls, speeches, regimes, and claims about justice
  through which human beings act. The polis gave philosophy its political
  setting without becoming philosophy's final measure. Macedonian monarchy
  later subordinated the inter-polis order without erasing civic institutions;
  successor kingdoms joined royal liberation, benefaction, and garrison to
  negotiated civic autonomy; federal leagues attempted to make many poleis act
  as one; and Rome finally subjected that federal order in 146 BCE. Epicurean
  and Stoic philosophy developed opposed accounts of nature, justice, duty, and
  freedom for a world in which the polis survived without remaining politically
  sovereign.

scope:
  subject: >-
    Ancient Greece as a complete civilization: the sacred, poetic, household,
    political, military, economic, dramatic, historical, and philosophical
    development of the polis; the plurality of Greek regimes; the conflict
    between civic freedom, exclusion, empire, and philosophy; and the
    Macedonian and Hellenistic transformation of the inter-polis world.
  period: >-
    The civilization's remembered heroic and divine beginnings through the
    destruction of Corinth and Roman constitutional settlement of Greece in
    146 BCE. The Greek philosophical afterlives of Epicureanism and Stoicism
    are followed through Lucretius, Epictetus, and Marcus Aurelius under Roman
    rule without extending the political endpoint. No modern chronology is
    imposed upon the sacred and mythic beginnings described by the ancient
    witnesses.
  geography:
    - the Aegean and mainland Greek worlds, including the distinct Ionian cities
    - Crete and the islands as plural civic and sacred orders rather than peripheral extensions of Athens
    - Magna Graecia, Sicily, and the colonies and settlements of the wider Mediterranean and Black Sea
    - Sparta, Athens, Thebes, Corinth, Argos, Syracuse, and the other autonomous poleis
    - Olympia, Delphi, Nemea, the Isthmus, Delos, and the Panionium as inter-polis sacred centers without sovereignty over the cities
    - Macedonia and the Hellenistic kingdoms insofar as they transform the polis
    - Rome insofar as its intervention terminates the independent Greek contest among polis, federation, and monarchy
  narrative_companion: narratives/STAR-ANCIENT-GREECE-001.md
  source_manifest: sources/primary/ancient/greece/manifest.yaml

shape:
  model: POLIS_REGIME_AND_PHILOSOPHIC_EXAMINATION
  center: >-
    The polis joins gods, households, territory, law, office, citizenship,
    education, military service, public speech, property, honor, and judgment
    into a regime and way of life, while inter-polis cult, colonization,
    competition, diplomacy, and inquiry create a common Greek world that no
    polis contains.
  freedom: >-
    Greek freedom includes both the autonomy of a polis and the political
    standing of citizens within it; neither meaning extends automatically to
    women, slaves, metics, dependents, conquered populations, or subject allies.
  philosophy: >-
    Inquiry into nature and the good arises within the Greek city while
    becoming capable of judging the regime and ancestral law by a standard the
    city did not create.
  dramatic_examination: >-
    Tragedy places inherited stories, civic laws, household claims, sacred
    limits, and human choices inside actions whose reversals exceed every
    speaker's doctrine. Comedy releases an impossible remedy into a recognizable
    civic grievance and judges the temporary regime produced when that remedy
    succeeds. Neither genre becomes an official verdict of the polis.
  number_and_measure: >-
    Arithmos begins as a determinate multitude of determinate things;
    Pythagorean inquiry joins count, ratio, harmony, initiation, and cosmic
    order; Plato separates mathematical units from sensible things and turns
    mathematics toward intelligible being; Aristotle denies separate being to
    number; and the Laws makes numerical divisibility an architecture of
    households, cult, taxation, office, and defense.
  account_of_power: >-
    Power has no single Greek substance. It acts through household authority,
    sacred jurisdiction, law, office, speech, education, wealth, military
    formation, empire, knowledge, and the ordering end of a regime.
  terminal_transformation: >-
    Macedonian kingship subordinates the inter-polis order without abolishing
    the civic forms, cults, laws, and identities of the poleis; successor
    kingdoms make autonomy a negotiated relation among city, benefactor,
    garrison, and king; Achaean and Aetolian federation enlarge common action
    without dissolving the member poleis; and Rome's destruction of Corinth and
    settlement of Greece in 146 BCE terminate the independent Greek contest
    among city, league, and monarchy without terminating the polis itself.

witness_architecture:
  governing_rule: >-
    Ancient Greek witnesses govern the realities they articulate. Poetry,
    ritual regulation, ancestral norm, civic decree, drama, history, oratory,
    philosophy, inscriptions, and material remains retain their differences of
    genre and voice. Strauss, Klein, and Benardete form a second interpretive
    level that deepens the questions posed to the ancient witnesses without
    replacing them. Modern specialists enter only where material,
    institutional, philological, or archaeological facts cannot be established
    adequately from the ancient witnesses themselves.
  ancient_governing_witnesses:
    poetry:
      - Homer
      - Hesiod
      - the Homeric Hymns
      - Tyrtaeus
      - Solon
      - Theognis
      - Sappho
      - Pindar
    sacred_and_epigraphic:
      - sacrificial calendars
      - sanctuary regulations, leases, inventories, and accounts
      - purification regulations and ancestral ritual norms
      - divine commands and civic decrees concerning sacred affairs
      - oracular and mystery witnesses
      - funerary and hero-cult inscriptions
      - citizenship, property, alliance, tribute, and financial inscriptions
    drama:
      - Aeschylus
      - Sophocles
      - Euripides
      - Aristophanes
    history_and_oratory:
      - Herodotus
      - Thucydides
      - Xenophon
      - Isocrates
      - Demosthenes
      - Aeschines
      - Arrian
      - Diodorus
      - Plutarch
      - Polybius
    philosophy:
      - the extant Presocratic fragments and ancient testimonia identified by thinker
      - the sophistic fragments and testimonia identified by thinker
      - Platonic dramatic presentations, distinguished from historical testimony
      - Plato
      - Xenophon
      - Aristotle
      - Epicurus
      - Cleanthes' Hymn to Zeus
      - Lucretius
      - Epictetus
      - Marcus Aurelius
  second_interpretive_level:
    - Leo Strauss
    - Jacob Klein
    - Seth Benardete
  bounded_modern_controls:
    rule: >-
      Used only when necessary for textual establishment, archaeology,
      institutional reconstruction, economy, social structure, or religion;
      their disagreements remain visible and do not govern the civilization.
    directly_examined:
      - Walter Burkert, Greek Religion
      - The Oxford Handbook of Ancient Greek Religion
      - François de Polignac, Cults, Territory, and the Origins of the Greek City-State
      - Moses I. Finley, The Ancient Economy
      - G. E. M. de Ste. Croix, The Class Struggle in the Ancient Greek World
      - Josiah Ober, The Athenian Revolution
    comparison_registered_through_an_examined_source:
      - Mogens Herman Hansen through Josiah Ober's direct engagement with his institutional account

