qualification: >-
  Naoroji is an authority within the history being reconstructed, not merely a later reception of
  British rule. His drain analysis challenges imperial economic and moral claims through Indian
  revenue, expenditure, remittances and administrative relations. Particular numerical estimates
  require table- and edition-level control before reuse.
