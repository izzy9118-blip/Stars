qualification: >-
  Nietzsche is used to identify the late-modern crisis of authoritative ends: inherited
  standards lose their self-evidence while historical and scientific explanation cannot by
  themselves legislate the good. His critique is not treated as the cause of imperialism,
  nationalism, racial doctrine, administrative expansion or the First World War. Strauss's
  readings govern the interpretive relation but do not replace Nietzsche's primary text.
