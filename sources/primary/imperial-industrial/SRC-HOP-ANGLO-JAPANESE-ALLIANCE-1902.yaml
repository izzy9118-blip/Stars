key_relations:
  - Britain and Japan recognize special interests in China and Korea.
  - One ally remains neutral if the other fights one power in defense of listed interests.
  - Joint war follows if additional powers join hostilities against the ally.
qualification: >-
  The 1902 agreement is conditional and regional. It should not be treated as an unconditional
  global military commitment or as proof that Japan merely entered a Western-directed system.
