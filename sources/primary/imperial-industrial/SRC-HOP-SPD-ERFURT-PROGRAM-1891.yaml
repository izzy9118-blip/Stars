qualification: >-
  The program combines a Marxian account of capitalist development and class conflict with an
  immediate program of suffrage, civil rights, labor protection, an eight-hour day, freedom of
  association and worker participation in insurance. Its revolutionary diagnosis and institutional
  demands must remain visible together rather than being reduced to either one.
