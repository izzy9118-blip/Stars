    proposition: Compulsory insurance covers broad categories of wage and salary earners from age sixteen.
  - section: 161
    proposition: Eligibility and employment histories are evidenced through local administrative certification or employer certificates authenticated by public authority.
qualification: >-
  The law makes age, employment, contributions, administrative certification and claims
  part of a durable state-supervised record system; coverage and benefits remain historically bounded.
