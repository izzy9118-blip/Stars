validation:
  - Nietzschean crisis of ends and institutional means remain related but causally distinct.
  - Workers retain independent organization and agency.
  - Imperial doctrine retains contemporary disagreement and colonized counter-judgment.
  - Japan remains a distinct path.
  - Naval, alliance, mobilization and political-decision evidence classes remain distinct.
  - July 1914 remains sequential and contingent rather than mechanically inevitable.
