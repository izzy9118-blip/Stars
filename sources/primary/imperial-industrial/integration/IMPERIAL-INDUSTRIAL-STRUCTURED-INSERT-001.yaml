narrative_candidate: sources/primary/imperial-industrial/integration/IMPERIAL-INDUSTRIAL-NARRATIVE-INSERT-001.md

fact_extension_summary: >-
  Imperial-industrial power emerges when administrative national states acquire permanent
  financial, corporate, labor, welfare, scientific, infrastructural, colonial, naval,
  alliance and mobilization systems at the moment Nietzsche discloses a crisis in the ends
  by which modern power can be judged. Workers organize counter-power; imperial doctrines
  are contested by metropolitan and colonized critics; Japan follows a distinct path into
  constitutional and imperial power; and the July Crisis shows actors converting inherited
  organizational capacities into war through sequential political decisions.

