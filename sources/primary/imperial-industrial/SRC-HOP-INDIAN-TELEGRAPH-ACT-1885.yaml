key_passages:
  - section: 4
    proposition: Government holds an exclusive privilege over telegraphs and may grant licenses.
  - section: 5
    proposition: Government may take possession of licensed telegraphs and order interception under statutory conditions.
  - section: 6
    proposition: Telegraph lines may be established on railway-company land.
qualification: >-
  The Act demonstrates communications as colonial governmental jurisdiction and infrastructure.
  Later amendments in the current consolidated text must not be mistaken for the 1885 original provisions.
