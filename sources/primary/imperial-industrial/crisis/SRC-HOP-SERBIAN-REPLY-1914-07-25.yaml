work:
  corporate_author: Royal Serbian Government
  title: Serbian Reply to the Austro-Hungarian Ultimatum
  date: 1914-07-25
  original_language: French
  role: acceptance_constitutional_limits_investigation_and_international_arbitration
governing_witness:
  witness_type: FRENCH_DIPLOMATIC_TEXT_TRANSCRIPTION
  locator: https://www.gwpda.org/1914/reponseserb.html
supporting_english:
