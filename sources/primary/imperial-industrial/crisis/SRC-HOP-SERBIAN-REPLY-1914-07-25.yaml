key_relations:
  - Serbia accepts or conditionally accepts many demands concerning press, associations, education, officials and border controls.
  - Serbia limits Austro-Hungarian participation where it says constitutional or legal procedure would be violated.
  - Serbia proposes pacific settlement through the Hague tribunal or Great Powers if the reply is deemed insufficient.
qualification: >-
  The reply is not total acceptance. Its legal reservations and alternative dispute proposals must remain visible alongside its extensive concessions.
