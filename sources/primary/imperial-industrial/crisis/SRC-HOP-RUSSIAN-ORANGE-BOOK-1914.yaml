key_documents:
  - number: 58
    date: "1914-07-29 (16 July Old Style)"
    author: Russian Minister for Foreign Affairs
    recipient: Russian Ambassador at Paris
    proposition: >-
      Sazonov states that Russian military preparations followed Austrian mobilization and Austria's refusal of peaceful settlement,
      rejects Germany's demand that preparations cease, and tells Paris that Russia must accelerate preparations and regard war as probably inevitable.
  - number: 40
    proposition: Tsar proposes Hague adjudication as a possible route before irreversible events.
witness_policy:
  rule: >-
    The Orange Book is an official wartime publication and is not neutral by status. Individual telegrams are evidence
    of communications the Russian government chose to publish; disputed dates and omissions must be checked against archival editions before blame claims.
qualification: >-
  This record adds an independent Russian governmental voice to the crisis map but does not substitute for an original general-mobilization order.
