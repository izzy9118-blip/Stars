key_relations:
  - Moltke treats Austro-Russian escalation as activating Germany's alliance obligation.
  - He argues that delay worsens Germany's military position as Russian and French preparations continue.
  - He expects German mobilization to produce a two-front war.
qualification: >-
  This is Moltke's military assessment presented to the chancellor, not a constitutional rule or proof that civilian leaders had no choices.
