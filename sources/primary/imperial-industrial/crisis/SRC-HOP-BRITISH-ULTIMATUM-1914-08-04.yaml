key_relation: >-
  Britain demands an immediate assurance that Germany will not proceed with its demand upon Belgium
  and will respect Belgian neutrality, with a same-day deadline after reports of German violation.
qualification: >-
  Belgian neutrality was central to the ultimatum, but Britain's full decision-making also involved French security,
  strategic position, cabinet politics and prior naval commitments. This document may not be made the sole explanation of British entry.
