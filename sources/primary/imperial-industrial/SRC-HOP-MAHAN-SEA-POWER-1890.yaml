passages:
  - location: Introductory, opening pages
    proposition: Mahan treats sea-power history as a history of national rivalry in which sea commerce materially affects wealth and strength and conflict over commercial advantage can produce war.
  - location: Chapter I, pp. 25-26
    anchor: "The first and most obvious light in which the sea presents itself ... is that of a great highway"
    proposition: Sea routes are political-economic highways shaped by recurring trade paths.
  - location: Chapter I, p. 26
    proposition: The necessity of a navy arises from peaceful shipping when war requires armed protection of commerce.
  - location: Chapter I, pp. 27-28
    proposition: Overseas shipping creates demand for secure ports, refuges, supply points and trading stations, which can develop into colonies.
  - location: Chapter I, contents/argument
    proposition: Production, shipping and colonies form linked elements within Mahan's account of sea power.
witness_policy:
  rule: >-
    Mahan is evidence for a strategic interpretation of maritime power. His argument can be compared with
    naval policy and legislation, but it may not be treated as the cause of German, British, American or Japanese policy without independent evidence.
