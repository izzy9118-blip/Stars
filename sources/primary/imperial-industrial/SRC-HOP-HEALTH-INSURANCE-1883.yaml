    proposition: Wage and salary workers in mines, factories, railways, shipyards, building and other listed employments become subject to compulsory insurance.
qualification: >-
  Coverage was occupationally defined and not universal. The law creates a compulsory
  administrative relation among workers, employers, funds, local authorities and Reich law.
