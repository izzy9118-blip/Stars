qualification: >-
  Ferry's speech explicitly joins outlets for industry, naval and strategic stations, national
  rank, and a racialized claim of civilizing right and duty. It records an influential parliamentary
  defense of empire, not an uncontested French consensus or an adequate description of colonized peoples.
