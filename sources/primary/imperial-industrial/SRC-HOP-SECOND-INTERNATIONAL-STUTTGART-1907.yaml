qualification: >-
  The proceedings establish organized cross-border debate among socialist parties and trade unions
  concerning labor organization, colonialism, migration, militarism and war. They do not establish
  a single socialist doctrine or prove that international resolutions overrode national party and
  state loyalties in the crisis of 1914.
