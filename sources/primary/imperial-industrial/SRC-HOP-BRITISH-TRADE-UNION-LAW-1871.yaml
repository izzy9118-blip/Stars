qualification: >-
  The paired statutes show that legal recognition and legal restraint developed together.
  Registration and protection of union funds did not make every union agreement judicially
  enforceable or remove criminal restrictions surrounding pressure, intimidation and picketing.
  British labor law therefore cannot be narrated as either simple emancipation or simple repression.
