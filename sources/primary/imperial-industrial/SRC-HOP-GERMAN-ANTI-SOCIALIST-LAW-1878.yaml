qualification: >-
  The statute is evidence of Reich repression of socialist organization and publicity. It does
  not establish the disappearance of socialist electoral or associational life, nor may it be
  collapsed into the later social-insurance statutes; repression and incorporation were distinct
  policies directed at the same industrial-social conflict.
