qualification: >-
  Clemenceau's reply demonstrates that racial hierarchy and civilizing conquest were contested
  within metropolitan politics at the moment they were invoked. His opposition does not stand in
  for colonized judgment and must not erase other anti-imperial arguments or his later political career.
