core_relations_now_documented:
  - National monetary coordination can combine Reich supervision with private share capital.
  - Private industrial concentration and public regulation develop together rather than as mutually exclusive systems.
  - Social insurance turns industrial life risks and employment histories into administered legal relations.
  - Colonial power operates through metropolitan treaty and law, separately budgeted administration and extraction, and coercive practice on the ground.
  - Strategic infrastructure joins public credit, commercial movement and naval mobility.
  - Naval force becomes a long-horizon statutory construction, procurement and replacement program; policy memoranda can state opponent-specific strategic rationales.
  - Telegraph and wireless systems become internationally standardized while imperial governments maintain monopoly, licensing and interception powers.
  - Alliance treaties range from conditional consultation to explicit simultaneous mobilization commitments and region-specific imperial interests.
  - General-staff planning integrates mass armies, railways, supply, fortifications and territorial schedules.
  - Official statistics make national productive and transport capacity quantitatively legible.
  - Japan develops a distinct constitutional-imperial path joining imperial sovereignty, education, war settlement, alliance and colonial annexation.
