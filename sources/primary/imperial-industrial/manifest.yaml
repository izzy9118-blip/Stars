core_relations_now_documented:
  - National monetary coordination can combine Reich supervision with private share capital.
  - Private industrial concentration and public regulation develop together rather than as mutually exclusive systems.
  - Social insurance turns industrial life risks and employment histories into administered legal relations.
  - Colonial power operates through both metropolitan treaty/jurisdiction and coercive military practice.
  - Strategic infrastructure joins public credit, commercial movement and naval mobility.
  - Naval force becomes a long-horizon statutory construction and replacement program.
  - Telegraph and wireless systems become internationally standardized while remaining nationally strategic infrastructures.
  - Alliance treaties range from conditional consultation to explicit simultaneous mobilization commitments.
  - General-staff planning integrates mass armies, railways, supply, fortifications and territorial schedules.
  - Official statistics make national productive and transport capacity quantitatively legible.
next_targets:
