working_branch: history-of-power-imperial-industrial-001
period_focus: "1871-1914"
purpose: >-
  Reconstruct the fusion of national administration, industrial production,
  corporate and banking organization, social insurance, colonial jurisdiction,
  strategic infrastructure, naval power, global communications, educational formation,
  and alliance systems into imperial-industrial great-power capacity.
acquisition_rules:
  - Primary statutes, treaties, corporate agreements, technical conventions, official statistics, archival orders, and first-edition strategic texts govern.
  - Industrial concentration, finance, imperialism, navalism, alliance, communications, education and general-staff planning remain distinct evidence classes until synthesis.
  - Germany is a major case rather than a universal model; British, American, colonial Indian and Japanese pathways remain independently visible.
  - State and private corporate power are not presumed identical merely because they cooperate.
  - International communications are treated through treaty and technical regimes alongside national or colonial monopoly, licensing and interception powers.
  - Social insurance is treated as administration of industrial society, not reduced to benevolence or repression.
  - Colonial texts preserve the distinction between metropolitan legal claims, economic administration and actual coercive practice.
  - Strategic writings such as Mahan and Schlieffen are attributed plans or interpretations, not automatic explanations of state policy or later operations.
  - Secret diplomatic treaties governed through later documentary publication retain that witness limitation.
  - Official statistical categories require unit and boundary controls before numerical claims are admitted.
  - No claim that the period inevitably leads to 1914 is admitted merely from chronology.
