core_relations_now_documented:
  - The crisis of authoritative ends identified through Nietzsche is related to expanding modern means without being made the cause of institutional or military action.
  - National monetary coordination can combine public supervision with private share capital.
  - Private industrial concentration and public regulation develop together rather than as mutually exclusive systems.
  - Social insurance turns industrial life risks and employment histories into administered legal relations.
  - Workers form counter-organizations through unions, socialist parties, strikes and international congresses; repression, incorporation and bargaining are rival relations rather than a one-way administration of labor.
  - Colonial power operates through metropolitan treaty and law, separately budgeted administration and extraction, and coercive practice on the ground.
  - Imperial economic, strategic, racial and civilizing arguments are contemporaneously disputed, including within metropolitan parliaments and by critics among the governed.
  - Strategic infrastructure joins public credit, commercial movement and naval mobility.
  - Naval force becomes a long-horizon statutory procurement and replacement program; policy memoranda can state opponent-specific strategic rationales.
  - Telegraph and wireless systems become internationally standardized while imperial governments maintain monopoly, licensing and interception powers.
  - Alliance treaties range from conditional consultation to explicit mobilization commitments and region-specific imperial interests.
  - General-staff planning integrates mass armies, railways, supply, fortifications and territorial schedules.
  - Japan develops a distinct constitutional-imperial path joining imperial sovereignty, education, war settlement, alliance and colonial annexation.
  - During July-August 1914, these long-built systems became constraints and options, but identifiable actors still made sequential diplomatic, mobilization and war decisions.
remaining_controls:
  - controlled extraction of coal, iron, steel, railway, shipping and corporation series from the locked 1913 German yearbook remains open; no secondary figures substitute for the inaccessible primary table delivery
  - firm- or procurement-level steel and armaments witnesses may be added where national statistics and naval statutes are insufficient
  - operational cable and wireless network evidence beyond convention rules remains desirable
  - colony-specific land, labor and economic extraction evidence should continue beyond German mining, budget and military witnesses
  - additional colonized political voices should extend the Naoroji witness as later geographic layers require them
  - strike and union evidence beyond Britain, Germany and the United States should be added only where the final narrative makes a broader comparative claim
  - British cabinet records are needed only if the final July-crisis synthesis extends beyond the bounded Belgian-neutrality ultimatum claim
  - Russian and French archival editions should supersede wartime Orange/Yellow Book wording if direct quotation becomes central
