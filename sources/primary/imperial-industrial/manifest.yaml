corpus_id: HOP-IMPERIAL-INDUSTRIAL-001
name: Imperial-Industrial World Power Primary Source Corpus
status: GATHERED_THROUGH_OUTBREAK_OF_WORLD_WAR_1914
parent_star: STAR-HISTORY-OF-POWER-001
base_branch: history-of-power-administrative-state-001
working_branch: history-of-power-imperial-industrial-001
period_focus: "1871-1914, including July Crisis through 4 August 1914"
purpose: >-
  Reconstruct the fusion of national administration, industrial production,
  corporate and banking organization, social insurance, colonial jurisdiction,
  strategic infrastructure, naval power, global communications, educational formation,
  alliance systems and mobilization planning into imperial-industrial great-power capacity,
  then test those capacities against the actual political decisions of July-August 1914.
acquisition_rules:
  - Primary statutes, treaties, corporate agreements, technical conventions, official statistics, archival orders, first-edition strategic texts and dated crisis documents govern.
  - Industrial concentration, finance, imperialism, navalism, alliance, communications, education, general-staff planning and crisis decisions remain distinct evidence classes until synthesis.
  - Germany is a major case rather than a universal model; British, American, colonial Indian, Japanese, Austro-Hungarian, Serbian, Russian, French and Belgian pathways or voices remain independently visible where relevant.
  - State and private corporate power are not presumed identical merely because they cooperate.
  - Official wartime document books are primary evidence for published governmental communications, not neutral verdicts on responsibility.
  - Colonial texts preserve the distinction between metropolitan legal claims, economic administration and actual coercive practice.
  - Strategic writings such as Mahan and Schlieffen are attributed plans or interpretations, not automatic explanations of policy or later operations.
  - Official statistical categories require unit and boundary controls before numerical claims are admitted.
  - No claim that the institutional developments of 1871-1914 inevitably caused war is admitted from chronology alone.
