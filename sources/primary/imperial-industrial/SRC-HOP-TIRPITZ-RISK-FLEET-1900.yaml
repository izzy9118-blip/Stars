key_passages:
  - proposition: England's maritime trade cannot realistically be attacked through cruiser warfare because of Britain's lead in bases and overseas ships.
  - proposition: The fleet is conceived around the danger to England if the British home fleet were defeated or seriously weakened.
qualification: >-
  This is a draft from the Imperial Naval Office budget department and is used as a policy-level
