qualification: >-
  Galton is evidence for a program that made inherited human difference an object of measurement,
  comparison and selective reproduction. His text must not be treated as the source of every racial
  hierarchy, as a scientific validation of its own claims, or as proof that every imperial government
  adopted one coherent eugenic policy.
