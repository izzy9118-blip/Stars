core_relations_now_documented:
  - emergency law enlarges regulatory capacity beyond ordinary peacetime administration
  - munitions supply becomes a specialized ministry and legal regime reaching labor relations and controlled establishments
  - military conscription and civilian auxiliary service widen state jurisdiction over manpower
  - blockade turns maritime command into regulation of enemy and neutral trade networks
  - war borrowing converts future revenue into current military resources through repeated securities issues
  - excess-profits taxation converts extraordinary business gains into a measured wartime fiscal category
  - public information and propaganda become explicit executive-administrative functions
