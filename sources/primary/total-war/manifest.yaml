core_relations_now_documented:
  - emergency law enlarges regulatory capacity beyond ordinary peacetime administration
  - scarcity is made administratively legible and raw materials are allocated through state-private organizations
  - industrial labor is mobilized through compulsion, bargaining, arbitration, dilution and restoration promises
  - Britain, France and Germany develop different manpower and production settlements
  - blockade and domestic food administration join naval power to civilian subsistence without becoming one cause
  - borrowing, taxation and publicity extend command through future revenue, accounts and mass communication
  - imperial manpower joins metropolitan command to colonial soldiers while censorship converts their correspondence into intelligence
  - occupation converts civilian labor into a coercive resource under openly contested claims of legality
  - industrial combat consumes bodies and reshapes soldier experience beyond the administrative categories counting them
  - soldiers' and workers' organization redistributes authority within armies, factories and states
  - revolutionary governments repudiate wartime institutions while retaining the problem of production, subsistence and organized force
  - separate peace and armistice dismantle wartime systems through coercive legal settlements rather than a simple return to 1914
  - Weber, Lenin, Keynes, Ludendorff and Jünger preserve incompatible interpretations of state, command, economy, responsibility and war experience
review_boundaries:
  - No statute or administrative chart is treated as proof of complete obedience or penetration.
  - No one national arrangement is projected across all belligerents.
  - Blockade is not made the sole cause of Central European hunger.
  - Official imperial statistics do not absorb colonial experience or consent.
  - The German occupying power's legal defense is not accepted as neutral description.
  - Order No. 1 is not made the single cause of Russian military collapse.
  - Ludendorff's allocation of blame is preserved as a participant claim, not adopted as verdict.
  - Jünger's first-edition witness is not overwritten by later revisions.
  - Revolution and armistice terminate particular authorities and institutions without dissolving administration, coercion or economic interdependence.
