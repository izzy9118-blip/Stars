period_focus: 1914-1918_with_immediate_post_festum_witnesses_to_1922
purpose: >-
  Reconstruct how belligerent states converted prewar administrative, industrial, financial,
  communications, imperial and military capacities into systems for directing manpower,
  production, subsistence, information and sacrifice, and how the persons organized through
  those systems bargained with, resisted, divided and finally reorganized the authorities
  directing them.
acquisition_rules:
  - Wartime statutes, orders, agreements, budgets, administrative records, treaties and dated executive acts govern institutional claims.
  - Contemporary reflective and immediate post-festum witnesses interpret mechanisms but do not replace operational evidence.
  - Total war is a cross-source synthesis, not a license to assume total state control.
  - Britain, France, Germany, Russia, the United States, colonies and occupied territories retain distinct institutional paths.
  - Belligerent propaganda, memoir and official postwar accounting remain attributed and bounded.
  - Civilian, worker, colonial, occupied and soldier agency remains visible rather than being absorbed into state plans.
  - Revolution is treated as a transformation of authority produced within wartime society, not as an external epilogue.
