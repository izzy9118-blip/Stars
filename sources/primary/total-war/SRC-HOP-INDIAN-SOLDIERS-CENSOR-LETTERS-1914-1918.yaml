key_relations:
  - imperial manpower consisted of persons who interpreted war through family, village, religious, material and military worlds
  - postal communication joined the front to colonial society while censorship made private expression an intelligence object
  - reports selected letters for command purposes, so the archive records both soldier speech and the surveillance apparatus reading it
qualification: >-
  The surviving passages are selected, translated and censored; they are neither statistically representative nor unmediated.
  They nevertheless prevent official imperial totals from substituting for the voices and relationships those totals classify.
