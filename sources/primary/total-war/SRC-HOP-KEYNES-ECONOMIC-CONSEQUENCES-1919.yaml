disagreement_boundary: >-
  Keynes's economic diagnosis does not share Lenin's class theory of the state, Ludendorff's command perspective or Weber's
  institutional remedy. His proximity to the negotiations gives evidence and insight but also a participant's selection,
  estimates and polemical judgments, which remain attributed rather than converted into unqualified fact.
