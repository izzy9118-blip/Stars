core_diagnosis:
  - prewar Europe formed an interdependent system of population, imported food and materials, production, transport, credit and confidence
  - war dislocated that system and exhausted fiscal, monetary and productive capacities without making national economies self-sufficient
  - a punitive settlement that ignores subsistence, trade and reconstruction threatens social and political order across victor and defeated states
