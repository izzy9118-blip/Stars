core_diagnosis:
  - the imperialist war accelerates the fusion Lenin calls state-monopoly capitalism and turns advanced states into coercive wartime orders for workers
  - the state is treated as an organ of class antagonism resting on special bodies of armed men, prisons and administrative machinery
  - proletarian revolution must break rather than merely occupy the inherited bourgeois state apparatus
  - the Commune supplies the model for replacing standing army and separated officialdom with armed and recallable popular institutions
