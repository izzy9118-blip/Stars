disagreement_boundary: >-
  Lenin's program is not Weber's sociology of unavoidable modern bureaucracy and responsible leadership. The text states
  a revolutionary theory written before Bolshevik rule; later Soviet administrative practice cannot be read back into it
  as either its simple fulfillment or refutation without separate evidence.
