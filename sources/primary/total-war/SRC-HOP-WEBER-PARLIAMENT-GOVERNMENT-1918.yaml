disagreement_boundary: >-
  Weber does not identify bureaucracy with total state omnipotence or call for its abolition. His remedy of parliamentary
  control and leader selection differs from Lenin's project of breaking the inherited state apparatus and from Ludendorff's
  retrospective defense of high command.
