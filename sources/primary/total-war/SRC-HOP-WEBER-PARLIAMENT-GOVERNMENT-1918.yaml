core_diagnosis:
  - modern daily rule necessarily lies largely in the hands of trained officials and specialized administration
  - bureaucratic expertise and official secrecy create an enduring asymmetry against rulers and parliaments lacking independent knowledge
  - parliament is defended as a place for public accountability, political selection and leadership, not as a substitute for administration
  - wartime German command and political failure expose the danger of bureaucratic and military power without responsible political direction
