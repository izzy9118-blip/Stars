key_passage:
  section: 1
  proposition: Defined categories of adult male British subjects resident in Great Britain are deemed enlisted for wartime service unless exempt.
qualification: >-
  The January Act initially covered specified unmarried men and excluded Ireland; later legislation broadened service.
  It is evidence of wartime expansion of manpower jurisdiction, not universal conscription throughout the empire.
