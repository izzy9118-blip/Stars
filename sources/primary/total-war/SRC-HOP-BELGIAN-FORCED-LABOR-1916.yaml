key_disagreement:
  belgian_and_us_position: deportation and compelled work violated humanity and the law governing occupied populations
  german_position: unemployment justified compulsory work under the 15 May 1916 ordinance and German measures conformed to international law
qualification: >-
  The paired record preserves opposing official positions; the German reply is a justification by the occupying power,
  and American transmission is not an unmediated Belgian civilian voice. The source establishes deportation and coercive
  labor as contested occupation practices without converting either diplomatic description into a neutral total account.
