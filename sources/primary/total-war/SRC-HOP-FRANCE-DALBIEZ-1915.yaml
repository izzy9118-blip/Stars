key_relations:
  - military and administrative manpower is reviewed for reassignment to combat or defense production
  - retention of certain mobilized workers in private war establishments is subjected to regional commission review
  - specified commissions contain equal employer and worker representation under ministerial presidency
qualification: >-
  The law demonstrates a French route to manpower allocation, combining military obligation, industrial necessity and review.
  It does not establish that France copied the British ministry system or that statutory reassignment operated without conflict.
