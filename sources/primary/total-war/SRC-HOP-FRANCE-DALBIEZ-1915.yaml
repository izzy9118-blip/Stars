  corporate_author: French Republic
  title: Loi assurant la juste repartition et une meilleure utilisation des hommes mobilises ou mobilisables
  date: 1915-08-17
  publication: Journal officiel de la Republique francaise, 19 August 1915, pages 5795-5797
  original_language: French
  role: allocation_of_mobilized_men_between_front_administration_and_war_industry
governing_witnesses:
  archival_notice: https://www.servicehistorique.sga.defense.gouv.fr/ark/1133306
