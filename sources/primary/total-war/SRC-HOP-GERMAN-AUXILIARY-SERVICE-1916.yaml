  supporting_translation: https://germanhistorydocs.org/en/wilhelmine-germany-and-the-first-world-war-1890-1918/auxiliary-service-law-december-1916.pdf
key_relations:
  - civilian male labor outside military service is subjected to national auxiliary-service obligations in war-relevant activities
  - law includes implementation and dispute machinery rather than pure military command
  - Reichstag committee receives information and consultative rights over major regulations
qualification: >-
  The law expands state reach into civilian labor but also institutionalizes worker/employer mediation and parliamentary involvement.
  It should not be described as complete military ownership of the German economy.
