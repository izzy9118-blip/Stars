disagreement_boundary: >-
  Weber's analytical definition does not legitimate every act of state violence, and his ethic of responsibility does not
  reduce politics to expediency. His defense of responsible political leadership contests both apolitical administration
  and revolutionary purity while leaving their conflict visible.
