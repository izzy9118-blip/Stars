core_diagnosis:
  - the modern state is defined by its successful claim to monopolize legitimate physical force within a territory
  - political organization depends on control of administrative staffs and the material means through which rule is exercised
  - politics conducted through force and power cannot escape responsibility for foreseeable consequences
  - an ethic of responsibility and an ethic of conviction remain in tension rather than collapsing into one formula
