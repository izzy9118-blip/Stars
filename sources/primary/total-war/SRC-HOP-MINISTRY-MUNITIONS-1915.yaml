key_relations:
  - creates a Minister and Ministry of Munitions
  - permits transfer of relevant powers and duties from other departments
  - gives ministerial orders and instruments formal evidentiary force
  - makes the ministry temporary in law, scheduled to end after the war
qualification: >-
  Creation of the ministry establishes a wartime administrative center; actual control over firms, labor, materials and output requires the Munitions of War Acts and ministry records.
