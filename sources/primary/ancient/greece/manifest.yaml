method: sources/SOURCE-WITNESS-METHOD.md

authority:
  rule: >-
    Ancient Greek witnesses possess authority in their own voices and genres.
    Poetry, sacred law, inscriptions, drama, history, oratory, philosophy, and
    material remains are not subordinated to a modern reconstruction. Leo
    Strauss, Jacob Klein, and Seth Benardete form a second interpretive level
    that helps recover the questions and structures of the ancient works
    without replacing them. Modern scholarship is used only where necessary
    for textual, archaeological, institutional, economic, religious, or social
    facts unavailable from the ancient witnesses alone.
  disagreements_preserved:
    - Homeric, Hesiodic, lyric, tragic, comic, historical, and philosophical accounts
    - civic cult and philosophic examination of gods, nature, and law
    - Herodotus, Thucydides, Xenophon, Isocrates, Demosthenes, and later historians
    - democratic, oligarchic, aristocratic, tyrannical, monarchical, and mixed-regime claims
    - Athens, Sparta, Thebes, Macedonia, allied cities, and subject communities
    - Plato, Xenophon, and Aristotle on Socrates, regime, law, and the best life
    - Epicurean and Stoic accounts of nature, justice, freedom, and political obligation

scope:
  civilizational_name: Ancient Greece
  sacred_extent: the gods, heroes, origins, and cult foundations remembered by the ancient witnesses
  historical_extent: the emergence of the polis through the Hellenistic transformation
  later_boundary: the Roman incorporation and transformation of Greek civic and philosophical life belongs to the Rome Star

