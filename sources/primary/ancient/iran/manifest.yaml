corpus_id: ANCIENT-IRAN-STAR-CORPUS-001
name: Ancient Iran Governing Source Corpus
status: COMPLETE
star_id: STAR-ANCIENT-IRAN-001
method: sources/SOURCE-WITNESS-METHOD.md

authority:
  rule: >-
    Ancient witnesses possess authority in their own voices and genres.
    Iranian sacred texts, royal inscriptions, administrative archives, local
    documents, monuments, and Greek ancient accounts are not subordinated to
    modern reconstructions. Modern works establish editions, transmission,
    archaeological context, and comparison without replacing the ancients.
  disagreements_preserved:
    - Gathic reform and later Avestan ritual inheritance
    - royal self-description and the voices of defeated or subject communities
    - Iranian, Babylonian, Elamite, Aramaic, Egyptian, and Greek accounts
    - the different Greek accounts of Cyrus, kingship, court, and conquest
    - ancient narratives and modern attempts at chronology or institutional reconstruction

scope:
  civilizational_name: Ancient Iran
  sacred_extent: creation through final renovation as remembered in the Iranian corpus
  historical_extent: the Achaemenid world through its transformation under Alexander
  later_boundary: Parthian and Sasanian Iran require separate source corpora and Stars

