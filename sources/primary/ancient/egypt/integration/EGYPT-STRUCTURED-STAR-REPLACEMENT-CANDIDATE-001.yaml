candidate_navigational_questions:
  - What can mature forms at the earliest surviving horizon establish, and what prior development, loss or transmission remains unknown?
  - How do distinct Egyptian creation accounts relate to royal and institutional power without collapsing into one doctrine?
  - How does authority enter body and heart in the Loyalist Teaching without becoming modern consent?
  - What can Khuninpu's petition disclose about delegated abuse that royal decree and elite autobiography cannot?
  - How do people and labor appear as conditions of rule inside an explicitly hierarchical order?
  - Why does Neferti portray the heart turned entirely toward itself as disorder rather than freedom?
  - When does office discipline restrain private preference, and when does office become an instrument of extraction?
  - Which Luxor inscriptions, rituals and architectural relations support or contest later anthropological interpretations of the temple?
  - What evidence establishes restricted spaces, priestly training and differentiated access, and what stronger initiatory claims remain modern hypotheses?
  - How do Manetho, Diodorus, Strabo and Plutarch each transform Egypt for a later reading and governing world?
  - Which current claims are Egyptian self-witness, which are ancient reception, and which are modern reconstruction?
  - How can ancient agency, inwardness and criticism be preserved without projecting the naturally separate modern individual backward?

