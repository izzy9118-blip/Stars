purpose: >-
  Supply exact candidate content for the Egyptian portions of the structured Star.
  This file is not canonical and does not alter the Star. It deliberately omits
  Horemheb and Rekhmire from admitted prose until their original-language clause
  controls are complete.

candidate_fact_egypt: |-
  Power first appears in the Egyptian witnesses not merely as one human being's
  capacity to compel another, but as efficacy within an order that brings forth,
  distinguishes, names, nourishes, rules, judges, and renews the world. The Turin
  Royal Canon places gods first, spirits after them, and human kings within the
  same succession. This sequence is retained as the witness states it. The date
  assigned to a surviving papyrus, stone, monument, or copy identifies that
  witness and does not by itself date the beginning of the reality or teaching it
  records. The Shabaka Stone likewise presents itself as the durable restoration
  of an older damaged writing. Its Memphite composition makes heart and tongue
  effective in the emergence of gods, names, forms, arts, provisions, and bodily
  action. Other Egyptian texts begin from primeval waters, Atum or Ra, the Ennead,
  or the life-giving Aten. These accounts remain distinct. The proposition that
  they join political order to a more-than-political order is an analytical
  synthesis drawn across them, not one doctrine stated identically by every text.

  The earliest surviving Egyptian evidence used here already displays mature
  writing, measure, craft, monumental form, cult, and kingship. The surviving
  record does not show every prior development through which those forms arose.
  That absence neither requires an imagined intellectual infancy nor proves
  transmission from Atlantis or any other named lost civilization. Their earlier
  development, loss, preservation, and transmission remain open historical
  questions. When this project uses the phrase sacred order—or, more cautiously,
  a sacred-scientific relation—it names specific documented conjunctions among
  creation, kingship, ritual, measure, craft, office, and judgment. It is project
  terminology, not an Egyptian word for one hidden system governing every period,
  cult center, monument, and institution.

  Kingship carries divine succession into the Two Lands. The living king appears
  as Horus and Son of Ra, bearer of the Double Crown and a fivefold titulary; the
  dead king is identified with Osiris while a successor assumes the Horian place.
  The office exceeds any one mortal bearer without abolishing the bearer’s agency
  or responsibility. Hatshepsut could take the full titulary and rule as king.
  Pyramid Text utterances place the dead king among gods and imperishable stars,
  bearing insignia, judging, and continuing royal life in another mode. The same
  tradition that magnifies the office also preserves mortal exposure: kings age,
  depend upon servants, can be murdered, and can be judged through teachings,
  monuments, successors, and the dead.

  The governing standard repeatedly named in Egyptian sources is ma'at, whose
  uses include right, truth, measure, justice, hearing, and ordered relation.
  Kingship claims to make ma'at effective through offering, boundary, office,
  judgment, protection, punishment, defense, and the defeat of isfet. That claim
  does not erase royal war, tribute, labor, exaction, unequal access, or coercion;
  it states a standard through which command presents itself as rightful and
  through which rulers and agents can also be criticized. The Teaching for
  Merikare makes a king answer for destruction committed under royal command.
  The Teaching of Amenemhat separates the enduring office from a murdered and
  dependent occupant. Akhenaten’s boundary stelae show royal power founding a
  city, fixing sacred territory, and concentrating a distinct cult without making
  that settlement the hidden completion of all earlier Egypt.

  Egyptian literary reflection also reveals persons within this order. Neferti
  describes disorder through broken mourning, the heart turned entirely toward
  itself, inversion of rank, numerous directors, heavy labor, small harvest, and
  the loss of intelligible social relations. Restoration arrives in the king who
  reunites crowns, gods, territory, roles, name, and memory. The Loyalist Teaching
  commands hearers to bear royal authority in body and heart and represents the
  king as provision, status, protection, and punishment. Yet it also says that
  people and their labor bring existing goods into being, warns against
  overwhelming the field-worker, and makes care of the human flock useful to its
  lord. In the Eloquent Peasant, a marginal trader robbed by an official’s servant
  appeals repeatedly to ma'at, hearing, and right against greed and delegated
  abuse. His eloquence exposes power, but his redress remains dependent upon the
  officials and king whom he judges; the king’s decision to prolong the petitions
  while secretly provisioning the household joins protection, curiosity, and
  coercion in one act.

  Temple, palace, and office distribute the order through institutions. Egyptian
  evidence identifies recurring ritual, divine image, offering, inscription,
  restricted space, priestly service, land, storehouse, workshop, scribe, steward,
  judge, soldier, labor, and provision. Monumental scenes can present the king
  alone before gods even where priests perform daily acts. That representation
  does not make priesthood, temple economy, or administration unreal, and their
  activity does not make them secular institutions independent of kingship and
  cult. Specialized literacy, training, office, and restricted access create
  differentiated relations to knowledge. The present evidence does not yet
  establish one comprehensive initiatory hierarchy of consciousness, Luxor as an
  Egyptian-named Anthropocosmos, or every architectural proportion as a fixed
  encoding of one total doctrine.

  Egyptian power also classifies and incorporates outsiders without guaranteeing
  equality. Foreign rulers can assume Egyptian titulary and sustain temples;
  artisans, scribes, soldiers, merchants, interpreters, laborers, and protected
  communities can enter Egyptian institutions under different obligations.
  Psammetichus and Amasis use Greek soldiers, interpreters, and regulated
  settlement; other communities hold property and enter Egyptian legal forms
  while remaining vulnerable to dynasty, local conflict, and unequal standing.
  Incorporation is therefore a capacity to assign roles, rights, dues, protection,
  and exclusion, not a modern promise of equal membership.

  Herodotus is a principal external post-festum witness to Egypt’s encounter with
  Greek inquiry. He distinguishes seeing, inferring, Egyptian report, and other
  report; consults priests and monuments; preserves disagreement; and describes
  custom, kingship, foreign settlement, institutions, and remembered conquest.
  His account remains his inquiry rather than the transparent voice of every
  Egyptian period. His Cambyses can humiliate kingship, violate tombs and
  sanctuaries, and wound Apis; Egyptian monumental evidence can also place
  Cambyses inside pharaonic forms and an Apis burial. The witnesses remain
  distinct. Nomos names inherited ways through which peoples experience piety,
  justice, shame, and necessity; ma'at and nomos are not made identical.

  Death prevents Egyptian power from ending in the command of the living ruler.
  The heart becomes a witness before a divine court; conduct, speech, memory,
  offering, and justified life accompany the person beyond office and property.
  Royal mortuary texts concentrate resurrection and celestial government in the
  king, while later mortuary corpora widen participation without proving equality
  of rank, wealth, ritual access, or material means. The evidence supports
  relations of Osirian identification, Horian succession, judgment, renewal, and
  reconciliation in identified texts. It does not presently support a
  comprehensive division between an Osirian path for the people and a Horian path
  of direct liberation for initiates.

  Egypt also becomes an object of later reflection. Manetho, an Egyptian priest
  writing in Greek under Ptolemaic rule, is credited with a dynastic history whose
  original text is lost and survives through Josephus, Africanus, Eusebius,
  Syncellus, and other transmitters with different purposes. Diodorus systematizes
  Egyptian succession, law, priesthood, and remembered kingship within late
  Hellenistic universal history. Strabo describes Egypt as an Augustan Roman
  province through prefect, fiscal and judicial officers, military forces, cities,
  production, and selected native institutions. Plutarch addresses a philosophical
  reader and turns Egyptian divine narratives into objects of interpretation.
  These are first-class ancient dusk witnesses to memory, incorporation, and
  reception; none supersedes the Egyptian-language evidence it receives and
  transforms.

  Egyptian power therefore appears as a connected but non-identical set of
  relations: creation and effective speech; divine and human succession; royal
  office; ma'at and isfet; offering and coercion; temple, land, labor, and office;
  loyalty and provision; petition and failed hearing; incorporation and unequal
  status; name, heart, death, memory, and judgment. Persons are not absent from
  this order. They speak, labor, suffer, petition, remember, bear office, exercise
  judgment, and answer for conduct. But they are not constituted primarily as
  naturally separate individuals whose desires or rights precede the order. They
  become intelligible as loyal subjects, productive laborers, petitioners,
  office-bearers, foreigners, rulers, and judged dead within relations represented
  as prior to private will. This is the first older force required by the Age of
  the Individual: not an undifferentiated totality without persons, but an order in
  which agency and inwardness operate before the separate individual becomes the
  principal ground and object of political and commercial life.

candidate_scope_egypt_subject_terms:
  retain:
    - creation
    - divine succession
    - royal office and titulary
    - ma'at and isfet
    - ritual, temple, image and offering
    - office, land, labor, dues and administration
    - coercion, protection and judgment
    - death, memory and mortuary order
    - nomos, conquest and unequal incorporation
  add:
    - loyal subjecthood and inward royal formation
    - productive labor within hierarchy
    - petition and critique of delegated office
    - disorder, restoration and royal reform
    - priestly and monumental historical memory
    - Ptolemaic, Hellenistic and Roman reception
    - person-authority relation before modern individuality
  remove_from_unqualified_scope:
    - Anthropocosmos
    - comprehensive initiatory hierarchy
    - Horian liberation as one social path
    - Atlantis or a named prior civilizational source

candidate_shape_governing_question_first_clause: >-
  How does power change when Egyptian sacred, royal, institutional and mortuary
  order joins creation, kingship, ma'at, ritual, office, labor and judgment without
  making the private individual the prior source of authority, and is followed by
  Persian empire...

candidate_claim_policy:
  egyptian_self_witness: >-
    What an Egyptian text, monument, title, image, ritual, literary composition or
    administrative record states is presented as that source's account in its genre,
    language, period and material setting. Self-witness does not make royal praise an
    independently verified practice or literary disorder a direct event chronicle.
  indigenous_reflective_witness: >-
    Egyptian wisdom, literary, autobiographical and royal reflection is attributed to
    its composition and social position. It may disclose standards, criticism and
    self-understanding without automatically describing ordinary frequency or enforcement.
  ancient_dusk_witness: >-
    Herodotus, Manetho as transmitted, Diodorus, Strabo, Plutarch and other later
    ancient observers are evidence for the accounts, memories, institutions and
    interpretive transformations they preserve. Their temporal, cultural, political
    and textual distance remains part of every claim.
  later_critical_control: >-
    Modern philology, archaeology, critical editions and major interpretation control
    damaged evidence, translation, chronology, institutional context and competing
    synthesis. They are not primary witnesses and do not speak in an ancient voice.
  egyptian_relational_synthesis: >-
    A bounded project synthesis may connect creation, kingship, ma'at, ritual, measure,
    office, labor, memory and judgment only by identifying the source-specific relations
    beneath it. No one modern phrase, including sacred science, governs every artifact.
  person_authority_crossing: >-
    Every Egypt claim identifies the historically specific person—subject, worker,
    petitioner, office-bearer, foreigner, ruler, reader or judged dead—and the authority
    relation in which that person acts before drawing any non-teleological comparison to
    the Age of the Individual.

candidate_historical_spectrum:
  earliest_surviving_horizon_and_open_chronology:
    - mature writing, measure, craft, monumental, cultic and royal forms in the earliest surviving evidence used
    - witness date distinguished from origin of practice or teaching
    - prior development, loss and transmission remain open
    - no named prior civilization admitted without independent evidence
  creation_effective_speech_and_distinct_divine_centers:
    - primeval possibility and multiple creation accounts
    - heart, tongue, name and effective speech in the Memphite composition
    - gods, arts, provisions and bodily action in source-specific relations
    - local divine centers retained in their historical difference
    - project synthesis distinguished from one hidden total doctrine
  royal_succession_and_mortal_office:
    - gods, spirits and human kings in the Royal Canon
    - living Horus, Son of Ra, Double Crown, Two Lands and fivefold titulary
    - dead king as Osiris and successor in the Horian place where attested
    - office greater than one bearer beside mortality, dependence and responsibility
  maat_isfet_coercion_and_judgment:
    - right, truth, measure, hearing, justice and ordered relation
    - offering, boundary, protection, punishment, defense and smiting
    - royal and official action judged by standards the actors claim to serve
    - coercion retained beside legitimation and criticism
  temple_ritual_economy_and_knowledge:
    - temple, divine image, inscription, offering and recurring ritual
    - royal representation and delegated priestly performance
    - land, storehouse, workshop, scribe, labor and provision
    - literacy, training, restricted space and differentiated access where documented
    - Anthropocosmos and comprehensive initiation excluded pending direct evidence
  subject_labor_petition_and_office:
    - royal authority carried in body and heart in the Loyalist Teaching
    - king represented through provision, status, protection and punishment
    - people and labor represented as conditions of goods and rule
    - restraint of excessive labor within hierarchy
    - Khuninpu's petition and ma'at claim against delegated abuse
    - distinct voice and agency without pre-political right
    - vizierial and reform evidence admitted only after clause-level control
  disorder_restoration_and_memory:
    - Neferti's broken mourning, self-directed heart, inversion, administrative excess and labor disorder
    - restored crowns, gods, territory, roles, name and memory through kingship
    - Merikare and Amenemhat on royal failure, dependence and responsibility
    - Akhenaten's foundation, oath, cultic concentration and limits of permanent reordering
  incorporation_and_unequal_status:
    - foreign rulers assuming Egyptian forms
    - artisans, scribes, soldiers, merchants, interpreters, laborers and protected communities
    - role, property, dues, protection, conflict, exclusion and reversibility
    - conquest distinguished from complete incorporation
  mortuary_judgment_succession_and_renewal:
    - royal resurrection and celestial rule in identified mortuary texts
    - heart as witness and divine judgment
    - name, offering, justified life, memory and renewal
    - widening access treated by period, rank and material means
    - no comprehensive two-path Horian/Osirian social doctrine
  ancient_memory_and_reception:
    - Herodotus as classical external inquiry
    - Manetho as lost priestly Greek history through later transmitters
    - Diodorus as late Hellenistic universal history
    - Strabo as Augustan geography and provincial observation
    - Plutarch as Roman-imperial philosophical interpretation
    - Egypt transformed into an object of chronology, administration and reflective reading

candidate_conceptual_chain_egyptian_power:
  sequence:
    - earliest surviving mature forms and open prior development
    - distinct creation accounts, heart, tongue, name and effective speech
    - gods, spirits, human kings and royal succession
    - titulary, crowns, mortal office and responsibility
    - ma'at, isfet, offering, coercion and judgment
    - temple, priestly service, image, land, workshop, labor and provision
    - loyal subjecthood, inward royal formation and productive dependence
    - petition, hearing and moral criticism of delegated power
    - office standard, administrative procedure and royal reform where directly controlled
    - Nile, survey, field, dues, city and territorial order where documented
    - incorporation and unequal foreign status
    - mortuary judgment, name, memory, succession and renewal
    - priestly and monumental historical memory
    - later ancient chronology, geography and philosophical interpretation
  governing_principle: >-
    Egyptian power joins creation, divine succession, kingship, ma'at, ritual,
    office, land, labor, memory and mortuary judgment in an order represented as
    preceding any private will. It forms persons as loyal subjects, productive
    laborers, petitioners, office-bearers, foreigners, rulers and judged dead.
    Their agency, inwardness and criticism are real but become politically
    intelligible through the order they inhabit rather than through rights or
    desires prior to it. The mortal occupant remains answerable to an office and
    standard he does not create, while delegated institutions can protect, exploit
    and be judged. Later ancient historians and philosophers preserve and transform
    this order by making it an object of chronology, comparative history,
    provincial administration and reflective interpretation.

candidate_internal_tensions:
  - tension: Earliest surviving maturity and unknown development
    sides:
      - The earliest evidence used already displays mature institutions, arts and techniques.
      - Prior development, losses, chronology and transmission remain incompletely known.
    preservation_rule: Unknown development is filled neither by an assumed primitive infancy nor by a named lost civilization without independent evidence.
  - tension: Inward loyalty and petitionary critique
    sides:
      - The Loyalist Teaching orders royal authority into body and heart.
      - The Eloquent Peasant lets a marginal speaker judge delegated authority through ma'at.
    preservation_rule: Internalization does not erase criticism, and criticism does not turn the speaker into a modern autonomous sovereign.
  - tension: Royal protection and delegated abuse
    sides:
      - King and office claim provision, protection, hearing and right order.
      - Agents can steal, overwork, extort or fail to hear, while the king can exploit the petitioner's speech.
    preservation_rule: Protection and coercion remain simultaneous relations within royal hierarchy.
  - tension: Office ideal and practice
    sides:
      - Monumental and royal texts state office, procedure, restraint and punishment.
      - Self-presentation and promulgation do not prove consistent enforcement.
    preservation_rule: Office exceeds the private occupant without becoming a modern impersonal bureaucracy.
  - tension: Restricted knowledge and public ritual
    sides:
      - Literacy, priestly training, restricted spaces and specialized texts create differentiated access.
      - Current evidence does not establish one comprehensive hierarchy of consciousness for all society.
    preservation_rule: Documented access boundaries remain; a total initiatory system stays an attributed hypothesis.
  - tension: Indigenous self-witness and ancient dusk reception
    sides:
      - Egyptian-language texts and monuments state relations in their own genres.
      - Later Greek and Roman authors preserve and transform Egypt for new readers and regimes.
    preservation_rule: Ancient reception is first-class evidence of reception, not a replacement for the order received.
  - tension: Ancient agency and modern individuality
    sides:
      - Subjects, workers, petitioners and officials possess names, hearts, speech, judgment and action.
      - Authority is not grounded primarily in separate persons whose rights or desires precede society.
    preservation_rule: Absence of modern individuality never becomes absence of personhood, agency or inwardness.

candidate_comparative_matrix_egypt:
  Egyptian_creation_and_effective_speech:
    form_of_power: source-specific creation, naming, divine generation and effective speech
    political_implication: political command is interpreted within a cosmos of effective naming and order
    unresolved_question: how far distinct creation accounts support one political synthesis
  Royal_succession_and_maat:
    form_of_power: divine succession, mortal royal office, offering, coercion, hearing and judgment
    political_implication: ruler and agents claim authority by maintaining an order they do not create
    unresolved_question: how ma'at constrains practice rather than merely legitimating command
  Loyal_subject_laborer_and_petitioner:
    form_of_power: inward loyalty, provision, productive dependence, petition and moral criticism
    political_implication: persons have agency inside hierarchy without becoming prior sovereign individuals
    unresolved_question: how literary criticism related to actual access and redress
  Office_and_royal_reform:
    form_of_power: vizierial procedure, delegated agents, decree, punishment, record and administration
    political_implication: occupants are measured against office while the king remains the formal source of reform
    unresolved_question: the relation between stated standard and local practice
  Mortuary_judgment_and_memory:
    form_of_power: heart, divine court, justified life, name, offering, succession and renewal
    political_implication: status and earthly command do not manufacture final judgment
    unresolved_question: chronology and social distribution of mortuary access
  Ancient_dusk_reception:
    form_of_power: priestly history, universal history, imperial geography and philosophical interpretation
    political_implication: Egypt becomes an object later persons and empires can classify and reinterpret
    unresolved_question: what each receiver preserves and transforms
  Modern_critical_controls:
    form_of_power: none ancient; philological and archaeological control of the evidence
    political_implication: modern synthesis can clarify or distort the older order
    unresolved_question: how to retain strong interpretation without making it ancient self-witness

