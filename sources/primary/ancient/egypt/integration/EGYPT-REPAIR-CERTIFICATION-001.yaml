verified_package_findings:
  evidence_balance:
    state: SATISFIED_FOR_REVIEW
    finding: >-
      Egyptian-language and monument evidence, indigenous reflection, ancient dusk
      witnesses and later critical reconstruction are now separately represented.
  dual_conformity:
    state: SATISFIED_FOR_REVIEW
    finding: >-
      Each acquired witness is tied to a bounded History of Power claim and to the
      historically specific relation among person, authority and the later Age of
      the Individual thesis without projecting modern individuality backward.
  modern_interpretation_control:
    state: SATISFIED_FOR_REVIEW
    finding: >-
      Schwaller de Lubicz remains attributed modern interpretation; John Anthony
      West is quarantined from FACT-level synthesis; Petrie is treated as early
      Egyptological reconstruction. Atlantis, established Anthropocosmos, a fixed
      initiatory hierarchy and a comprehensive Horian/Osirian social doctrine are
      removed from proposed unqualified Star content.
  indigenous_person_authority_relations:
    state: SATISFIED_FOR_REVIEW
    finding: >-
      The package now distinguishes loyal inward formation, productive labor,
      petition against delegated abuse, cultivated self-command, office-bearing,
      protection and exaction, foreign status, mortuary judgment and later reflective reading.
  horemheb_control:
    state: SELECTED_RELATIONS_CONTROLLED_FINE_GRAINED_HOLD_REMAINS
    finding: >-
      The monument, Urk. IV lineation, Kruchten control and bounded operative relations
      are locked. Extended quotation and every restored clause remain withheld.
  rekhmire_control:
    state: SELECTED_RELATIONS_CONTROLLED_FINE_GRAINED_HOLD_REMAINS
    finding: >-
      Installation, Duties, autobiography and image program are separated; bounded
      office, petition, reporting, tax, tribute, production and self-memory relations
      are controlled. Direct quotation and quantitative use remain withheld.
  structured_star_application:
    state: READY_FOR_OWNER_REVIEW_NOT_APPLIED
    finding: >-
      The exact candidate can replace the Egypt-specific structured fields without
      relying on held Horemheb/Rekhmire quotations. Canonical application requires a
      safe whole-file or patch-capable GitHub mechanism and owner certification.

