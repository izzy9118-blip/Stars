star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - Temple ritual depends upon recurring schedules, personnel, goods, inventory, writing, and administrative coordination.
  - Priests, workers, goods, and time become institutionally differentiated within a mortuary cult that joins sacred maintenance to practical administration.
intended_claim_class:
  - DOCUMENTED_OR_TEXTUAL_FACT
  - ANALYTICAL_SYNTHESIS

what_the_source_can_establish:
  - The administrative categories and routines preserved in specified Old Kingdom temple documents.
  - A direct connection among cult, personnel, provisioning, recordkeeping, and institutional continuity.
  - That temple power operated through ordinary repetitive administration as well as monumental theology.
what_the_source_cannot_establish:
  - One uniform temple administration for all periods or cults.
  - The beliefs or lived experience of every person listed.
  - A complete economy of the Egyptian state.
  - Modern bureaucratic impersonality independent of royal and mortuary institutions.

rival_or_counter_witnesses_where_known:
  - SRC-HOP-EGYPT-GREAT-HARRIS-PAPYRUS
  - SRC-HOP-EGYPT-WILBOUR-PAPYRUS
  - temple archaeology and settlement evidence
  - later temple papyri and priestly archives

boundary_effect: >-
  The archive grounds temple administration directly while forcing period,
  institution, document type, and fragment-level limits.

age_of_individual_crossing:
  target: historical_spectrum.sacred_cosmic_order
  authority_bearer: Mortuary temple, royal cult, priestly office, schedule, archive, and provisioning system
  human_position: Priest, worker, supplier, or official identified by role within recurring cult administration
  demanded_conduct: Attendance, ritual service, delivery, accounting, and performance of assigned rotation
  formative_technique: Roster, calendar, inventory, account, seal, scribal record, and archive
  crossing_relation: PRESERVE
  non_teleology_rule: >-
    Administrative identification of personnel does not make the worker or priest
    an autonomous individual prior to the cultic institution.

