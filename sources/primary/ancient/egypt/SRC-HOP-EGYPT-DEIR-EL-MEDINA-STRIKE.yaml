star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - Temple-state labor and royal building depend upon regular provisioning, scribal accounting, supervisors, storehouses, and channels of petition.
  - Organized workers can suspend labor and address authorities from within, rather than outside, the encompassing royal-administrative order.
intended_claim_class:
  - DOCUMENTED_OR_TEXTUAL_FACT
  - ANALYTICAL_SYNTHESIS

what_the_source_can_establish:
  - A recorded episode of ration arrears, collective work stoppage, complaint, movement, negotiation, and administrative response at Deir el-Medina.
  - The material dependence of skilled state workers upon provisioning and accounting institutions.
  - Collective agency exercised through recognized sacred, administrative, and local channels.
what_the_source_cannot_establish:
  - A modern labor movement, right to strike, or class consciousness in a later sense.
  - The normal condition of all Egyptian laborers or all royal projects.
  - The complete causes and effects of the dispute without related journals, accounts, and ostraca.

rival_or_counter_witnesses_where_known:
  - Deir el-Medina journals, ration lists, letters, and ostraca
  - royal building inscriptions
  - SRC-HOP-EGYPT-HOREMHEB-EDICT
  - SRC-HOP-EGYPT-WENI-AUTOBIOGRAPHY

boundary_effect: >-
  This witness adds worker and local-administrative agency to an elite-heavy
  corpus while remaining bounded to one exceptional community and episode.

age_of_individual_crossing:
  target:
    - historical_spectrum.sacred_cosmic_order
    - forms_of_authority.household_authority
  authority_bearer: Pharaoh's work administration, temple/storehouse provisioning, scribes, supervisors, and local officials
  human_position: Skilled worker-subject whose service depends on material obligations owed by the governing order
  demanded_conduct: Labor, attendance, and petition through recognized channels; collective withdrawal appears when provision fails
  formative_technique: Ration list, work journal, hierarchy, complaint, procession, oath, and recorded negotiation
  crossing_relation: COEXIST_WITH
  non_teleology_rule: >-
    Collective refusal shows agency without converting the workmen into modern
    contractually free individuals. Their claims arise from duties and provisions
    internal to the royal-temple order.

