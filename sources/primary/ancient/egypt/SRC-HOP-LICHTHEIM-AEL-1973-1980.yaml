what_the_source_can_establish:
  - Controlled English translations, introductions, textual notes and genre context for a broad primary Egyptian corpus.
  - A reliable navigation layer connecting modern readers to inscriptions and manuscripts.
  - Where a History of Power claim must return to a specific underlying Egyptian witness.
what_the_source_cannot_establish:
  - That Lichtheim's English wording is the ancient artifact itself.
  - That a literary composition is a direct factual chronicle of the age it depicts.
  - That selections in an anthology exhaust Egyptian political, religious or social experience.

rival_or_counter_witnesses_where_known:
  - James P. Allen and other modern translations
  - original hieroglyphic, hieratic and Demotic editions
  - alternative philological readings
  - manuscript and monument facsimiles
boundary_effect: >-
  Every use must identify both Lichtheim's editorial/translation layer and the
  underlying papyrus, stela, tomb or inscription. Translation convenience may not erase textual transmission.

age_of_individual_crossing:
  person_power_relation: modern textual control for ancient subjects, officials, petitioners, rulers and the judged dead
  authority_demand: none directly; translation mediates evidence
  conduct_formation: permits the distinct ancient person-power relations to be reconstructed without modern categories being substituted silently
  later_relation: NO_DIRECT_CROSSING_YET
  prohibition: Do not attribute Lichtheim's introductions or normalized English terminology to an ancient speaker.

quotation_state: SOURCE_BY_SOURCE_CROSSWALK_REQUIRED
star_integration_state: CONTROL_SOURCE_ONLY_NOT_YET_PROPOSED
