what_the_source_can_establish:
  - A major philological reconstruction of how unity and plurality operate in Egyptian concepts of the gods.
  - Critical restraints against flattening different deities, periods and theological formulations into one doctrine.
  - A scholarly counterweight to modern esoteric claims of a single hidden Egyptian system.
what_the_source_cannot_establish:
  - Direct ancient self-description independent of the texts Hornung interprets.
  - That every Egyptian community or period held one uniform theology.
  - Political consequences not separately documented in kingship, temple or administrative evidence.

rival_or_counter_witnesses_where_known:
  - Jan Assmann, Ma'at and later work on Egyptian religion
  - Henri Frankfort, Kingship and the Gods
  - Plutarch, De Iside et Osiride
  - primary hymns, cosmogonies, temple and mortuary texts
boundary_effect: >-
  The work controls claims about divine plurality and unity but may not be promoted
  from modern critical reconstruction into ancient FACT voice.

age_of_individual_crossing:
