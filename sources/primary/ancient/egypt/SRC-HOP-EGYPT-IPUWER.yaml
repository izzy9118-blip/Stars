star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - Egyptian reflection represents social and political breakdown as inversion of differentiated order, insecurity of persons, failed provision, and impaired authority.
  - The text supplies a counter-witness to idealized royal and administrative order without proving one specific collapse narrative.
intended_claim_class:
  - ATTRIBUTED_TEACHING_OR_JUDGMENT
  - WITNESS_METADATA
  - INTERPRETIVE_BRIDGE

what_the_source_can_establish:
  - A native literary vocabulary for disorder, inversion, deprivation, fear, failed administration, and contested authority.
  - That Egyptian political imagination included severe criticism or lament concerning the breakdown of ordered relations.
what_the_source_cannot_establish:
  - An eyewitness account of the First Intermediate Period, the Exodus, or any single identified catastrophe.
  - A secure composition date derived solely from the date of the surviving papyrus.
  - The prevalence of the conditions described across all Egypt.

rival_or_counter_witnesses_where_known:
  - SRC-HOP-EGYPT-NEFERTI
  - Teaching for King Merikare
  - royal restoration inscriptions
  - administrative records from candidate historical periods

boundary_effect: >-
  The work may challenge an overly harmonious account of Egyptian order, but its
  genre and chronology prohibit using it as direct event evidence without
  independent corroboration.

age_of_individual_crossing:
  target: historical_spectrum.sacred_cosmic_order
  authority_bearer: Contested or failing royal-administrative and sacred order
  human_position: Vulnerable inhabitant whose livelihood, status, security, and expectations disintegrate when encompassing order fails
  demanded_conduct: The text does not yield one stable prescriptive program; lament and admonition address failed authority
  formative_technique: Lament, inversion, rhetorical catalogue, and admonitory speech
  crossing_relation: PRESERVE
  non_teleology_rule: >-
    Breakdown does not create the modern autonomous individual. It reveals how
    exposed persons remain when inherited institutions and meanings cease to hold.

