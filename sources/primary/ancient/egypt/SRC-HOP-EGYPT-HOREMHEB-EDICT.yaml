star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - Royal office claims responsibility for restraining corrupt officials, soldiers, collectors, and judges whose exactions injure inhabitants.
  - Ma'at is made administrative through appointment, penalty, procedure, inspection, and protection rather than remaining only a cosmic formula.
intended_claim_class:
  - DOCUMENTED_OR_TEXTUAL_FACT
  - ATTRIBUTED_TEACHING_OR_JUDGMENT

what_the_source_can_establish:
  - The categories of abuse that Horemheb's government chose to name and condemn.
  - A royal claim to reform collection, transport, official conduct, and judicial administration through appointments and penalties.
  - The self-presentation of kingship as protector against abuses committed through delegated power.
what_the_source_cannot_establish:
  - The frequency or geographic distribution of every abuse named.
  - That the reforms were uniformly implemented or permanently effective.
  - That the decree gives the victims' own unmediated account.

rival_or_counter_witnesses_where_known:
  - administrative and legal papyri from the late Eighteenth and Nineteenth Dynasties
  - tomb and official inscriptions praising administration
  - SRC-HOP-EGYPT-DEIR-EL-MEDINA-STRIKE
  - SRC-HOP-EGYPT-ELOQUENT-PEASANT

boundary_effect: >-
  The decree supports a claim about royal jurisdiction and reforming self-description;
  implementation and lived effect require independent records.

age_of_individual_crossing:
  target:
    - historical_spectrum.sacred_cosmic_order
    - forms_of_authority.sacred_authority
  authority_bearer: King acting through judges, officials, collectors, soldiers, and penalties
  human_position: Subject vulnerable to delegated exaction yet represented as entitled to royal protection within hierarchy
  demanded_conduct: Officials must execute bounded duties; subjects remain within the fiscal and administrative order
  formative_technique: Decree, inspection, appointment, oath, penalty, and public monumental promulgation
  crossing_relation: PRESERVE
  non_teleology_rule: >-
    Protection against official abuse does not imply modern individual rights
    against the state; it shows kingship claiming to discipline its own agents in
    order to restore rightful hierarchy.

