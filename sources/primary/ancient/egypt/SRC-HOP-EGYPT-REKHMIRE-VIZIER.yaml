star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - The vizierate joins palace access, petitions, records, land, taxation, local officials, judgment, reporting, and execution within delegated royal office.
  - Egyptian official ideology distinguishes the office's standard from the private appetite or partiality of its occupant.
intended_claim_class:
  - DOCUMENTED_OR_TEXTUAL_FACT
  - ATTRIBUTED_TEACHING_OR_JUDGMENT
  - ANALYTICAL_SYNTHESIS

what_the_source_can_establish:
  - The institutional functions, routines, hierarchy, and ethical expectations represented in the Rekhmire tomb program.
  - A model of office in which hearing, impartiality, record, access, reporting, and royal delegation are joined.
  - How elite service and personal commemoration are presented through performance of an office larger than one holder.
what_the_source_cannot_establish:
  - That every vizier performed every listed duty in the same way across Egyptian history.
  - That the tomb program is a neutral administrative manual detached from funerary self-presentation.
  - The actual frequency of impartial judgments or successful petitions.

rival_or_counter_witnesses_where_known:
  - Teaching of Ptahhotep
  - SRC-HOP-EGYPT-HOREMHEB-EDICT
  - SRC-HOP-EGYPT-ELOQUENT-PEASANT
  - administrative papyri and local court records

boundary_effect: >-
  The text can define an Egyptian ideal and represented jurisdiction of high
  office, but practice-level claims require independent administrative evidence.

age_of_individual_crossing:
  target:
    - historical_spectrum.sacred_cosmic_order
    - forms_of_authority.sacred_authority
  authority_bearer: King delegated through a durable office, records, subordinate officials, and procedure
  human_position: Officeholder whose dignity and identity arise through disciplined service; petitioner who reaches rule through an administrative mediator
  demanded_conduct: Impartial hearing, accurate record, obedience to office, and restraint of personal favor
  formative_technique: Installation speech, oath-like instruction, routine, recordkeeping, hierarchy, tomb image, and memorial exemplarity
  crossing_relation: PRESERVE
  non_teleology_rule: >-
    Bureaucratic role differentiation does not imply the modern impersonal state
    or autonomous civil servant. Office remains embedded in royal, sacred, and
    funerary order.

