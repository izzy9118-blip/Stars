what_the_source_can_establish:
  - The royal government promulgated provisions addressing specified abuses by soldiers, tax or revenue agents, judges and officials.
  - Protection of people and property could be stated as a royal duty enforced through appointment, oath, procedure and punishment.
  - The decree joins administrative reform to Horemheb's claim to restore order.
what_the_source_cannot_establish:
  - How consistently the provisions were enforced across Egypt.
  - That abuse disappeared or that all subjects possessed equal legal standing.
  - Every claimed institutional innovation until the damaged Egyptian text is cross-checked clause by clause.

rival_or_counter_witnesses_where_known:
  - Eloquent Peasant
  - Rekhmire office inscriptions
  - taxation and labor records
  - later royal restoration inscriptions
boundary_effect: >-
  Separate operative provisions from royal self-praise, and formal protection from
  demonstrated practice. Lacunae and older translations cannot be silently repaired.

age_of_individual_crossing:
  person_power_relation: subject vulnerable to delegated officials but placed under royal protection and exaction
  authority_demand: service, dues and obedience within an order whose agents are also answerable to the king
  conduct_formation: law and punishment define proper office before the population
  later_relation: OLDER_ADMINISTRATIVE_FORM_LATER_TRANSFORMED
  prohibition: Royal protection is not equivalent to impersonal equal rights held prior to the state.

