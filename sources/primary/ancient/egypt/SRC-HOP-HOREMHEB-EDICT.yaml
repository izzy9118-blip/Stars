boundary_effect: >-
  Separate operative provisions from royal self-praise, and formal protection from
  demonstrated practice. Lacunae, detached fragments and editorial restorations remain
  visible in every quotation-sensitive claim.

age_of_individual_crossing:
  person_power_relation: subject vulnerable to delegated officials but placed under royal protection and exaction
  authority_demand: service, dues and obedience within an order whose agents are also answerable to the king
  conduct_formation: written rule and punishment define proper office before the population
  later_relation: OLDER_ADMINISTRATIVE_FORM_LATER_TRANSFORMED
  prohibition: Royal protection is not equivalent to impersonal equal rights held prior to the state.

