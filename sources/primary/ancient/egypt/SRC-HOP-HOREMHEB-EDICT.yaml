what_the_source_can_establish:
  - The royal government promulgated provisions addressing specified abuses by soldiers, tax or revenue agents, judges and officials.
  - Protection of people, goods and labor could be stated as a royal duty enforced through written command, appointment and punishment.
  - The decree joins administrative reform to Horemheb's claimed restoration of ma'at.
  - Delegated royal service is not represented as unlimited license for private appropriation by officials.
what_the_source_cannot_establish:
  - How consistently the provisions were enforced across Egypt.
  - That abuse disappeared or that all subjects possessed equal legal standing.
  - That Egyptian administration formed a modern law code, independent judiciary or separated constitutional branches.
  - Every restored sign, object, penalty and title before the final clause table is completed.

rival_or_counter_witnesses_where_known:
