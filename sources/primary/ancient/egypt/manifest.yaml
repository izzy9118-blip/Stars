person_power_finding: >-
  Egyptian evidence now shows loyal subjecthood, productive labor, marginal
  petition, vulnerability to delegated office, disciplined office-bearing,
  priestly historical memory and later philosophical observation without turning
  any of those persons into a modern naturally separate rights-bearer. Agency and
  criticism remain visible inside older sacred, royal, social and mortuary forms.

