  - disciplined_office_bearer
  - royal_priestly_historian_of_past_rule
  - external_or_cosmopolitan_interpreter
  - judged_person_within_a_cosmic_social_mortuary_order

age_of_individual_boundary:
  finding: >-
    The first Egyptian repair strengthens rather than weakens the Age of the Individual
    thesis. Persons speak, labor, petition, judge and bear office, but they are not yet
    constituted primarily as naturally separate individuals whose rights or desires precede
    the order. Their identities and claims operate through ma'at, kingship, office, household,
    labor, memory, mortuary judgment and inherited sacred forms.
  prohibition: >-
    Do not infer that absence of modern individuality means absence of agency, interiority,
    criticism or moral judgment.

cross_source_questions:
  - How can authority be praised within body and heart while abusive agents remain open to judgment by ma'at?
  - Does royal protection restrain delegated coercion, legitimate it, or do both at once?
  - How does office discipline distinguish the role from the private occupant without creating a modern impersonal state?
  - What can a marginal petitioner's speech disclose that royal decree and elite autobiography cannot?
  - Which later ancient interpretations preserve Egyptian relations, and which transform them for Greek or Roman readers?
  - Which present History of Power claims depend chiefly on Schwaller de Lubicz or John Anthony West rather than the primary and controlled critical corpus?

remaining_before_star_native_integration:
  - Extract Neferti disorder/restoration passages from the governing manuscript edition.
  - Cross-walk Horemheb operative clauses against the hieroglyphic critical text.
  - Cross-walk Rekhmire appointment and duty passages against TT100 and Davies/van den Boorn.
  - Build a transmitter-by-transmitter Manetho fragment table.
  - Extract targeted Greek passages from Diodorus, Strabo and Plutarch.
  - Complete explicit reclassification of Schwaller de Lubicz, John Anthony West and Petrie.
  - Test Anthropocosmos, initiation, Horian/Osirian path, inherited-civilization, Sphinx-weathering and Atlantis claims.
  - Prepare bounded proposals for the native egyptian_power historical_spectrum node; do not revise narrative first.
