Q0_witness_identity:
  composition: The Tale of Sinuhe
  original_language: Middle Egyptian
  principal_witnesses:
    - object: Papyrus Berlin P 3022
      conventional_siglum: B
      repository: Egyptian Museum and Papyrus Collection, Staatliche Museen zu Berlin
    - object: Papyrus Berlin P 10499
