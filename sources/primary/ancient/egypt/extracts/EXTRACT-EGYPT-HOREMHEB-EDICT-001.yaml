Q4_star_claim_mapping:
  relation_id: EGYPT-PA-005
  star_claim_target: >-
    Kingship claims to protect inhabitants by disciplining the officials, soldiers,
    collectors, and judges through whom administration and coercion operate.
  intended_claim_class:
