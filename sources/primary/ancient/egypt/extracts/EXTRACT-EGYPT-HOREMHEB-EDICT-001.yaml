Q5_boundary_and_rival_test:
  boundaries:
    - decree is royal claim, not implementation audit
    - named abuse is not automatically quantified prevalence
    - protected inhabitant is not modern rights-bearer outside royal jurisdiction
    - institutional reforms may differ by region and office
  rival_controls:
    - administrative papyri from late Eighteenth and Ramesside periods
    - SRC-HOP-EGYPT-DEIR-EL-MEDINA-STRIKE
    - SRC-HOP-EGYPT-ELOQUENT-PEASANT
    - archaeological and legal evidence for collection and transport

