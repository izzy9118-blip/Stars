star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - Subordinate members of a specialized state community can accuse a superior through writing and appeal to higher authority.
  - Local office may become a site of coercion, favoritism, appropriation, or abuse that the official ideal does not disclose.
intended_claim_class:
  - SELF_WITNESS
  - ATTRIBUTED_TEACHING_OR_JUDGMENT
  - WITNESS_METADATA

what_the_source_can_establish:
  - The accusations, offices, relationships, and procedures actually preserved in the papyrus.
  - A documentary form through which alleged abuse by a foreman is named and transmitted.
  - The existence of conflict and appeal within the Deir el-Medina hierarchy.
what_the_source_cannot_establish:
  - The truth of each allegation without corroboration.
  - A complete biography of Paneb or Amennakhte.
  - The normal behavior of all foremen or workers.
  - A modern whistleblower protection system or equal access to justice.

rival_or_counter_witnesses_where_known:
  - other Deir el-Medina journals, ostraca, court records, and family documents
  - SRC-HOP-EGYPT-DEIR-EL-MEDINA-STRIKE
  - SRC-HOP-EGYPT-REKHMIRE-VIZIER
  - archaeological and prosopographical studies of the workmen's village

boundary_effect: >-
  The papyrus supplies a local subordinate voice and a counter-witness to official
  self-presentation, while its accusatory and unresolved character remains explicit.

