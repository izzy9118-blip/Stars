    title: The Duties of the Vizier: Civil Administration in the Early New Kingdom
    publisher: Kegan Paul International
    year: 1988
    extent: 432 pages
    status: GOVERNING_MODERN_TRANSLATION_COMMENTARY_AND_SOURCE_ANALYSIS
