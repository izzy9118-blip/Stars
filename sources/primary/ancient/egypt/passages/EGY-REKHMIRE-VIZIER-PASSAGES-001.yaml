witness_basis:
  monument:
    description: Theban Tomb 100, Sheikh Abd el-Qurna
    owner: Rekhmire, southern vizier under Thutmose III and early Amenhotep II
    evidence_components:
      - Installation of the Vizier text
      - Duties of the Vizier text
      - autobiographical inscriptions
      - administrative, tribute, tax, agricultural, workshop and temple-provision scenes
    status: ORIGINAL_MONUMENTARY_CONSTELLATION
  documentary_edition:
    author: Norman de Garis Davies
    title: The Tomb of Rekh-mi-Re at Thebes
    series: Publications of the Metropolitan Museum of Art Egyptian Expedition 11
    publisher: Metropolitan Museum of Art
    year: 1943
    volumes:
      - volume: I
        digital_record: https://libmma.contentdm.oclc.org/digital/collection/p15324coll10/id/168855
      - volume: II
        digital_record: https://libmma.contentdm.oclc.org/digital/collection/p15324coll10/id/169100
    status: GOVERNING_DOCUMENTARY_PUBLICATION_OF_TT100
  installation_critical_control:
    author: R. O. Faulkner
    title: The Installation of the Vizier
    journal: Journal of Egyptian Archaeology
    volume: 41
    year: 1955
    pages: 18-29
    doi: 10.2307/3855232
    status: CRITICAL_TEXTUAL_CONTROL
