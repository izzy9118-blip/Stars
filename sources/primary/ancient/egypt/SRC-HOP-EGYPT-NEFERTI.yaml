star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - Egyptian reflections on disorder preserve a distinction between rightful royal office and failed or absent rule.
  - Kingship represents itself as restoration of ma'at against social and cosmic disorder.
intended_claim_class:
  - ATTRIBUTED_TEACHING_OR_JUDGMENT
  - WITNESS_METADATA

what_the_source_can_establish:
  - A native Egyptian literary representation of disorder, social inversion, fear, and royal restoration.
  - A courtly form in which political renewal is spoken prospectively through a sage while legitimating a later king.
  - The dependence of ordinary security and social position upon a restored encompassing order.
what_the_source_cannot_establish:
  - That the narrated disorder is an eyewitness record of one datable historical collapse.
  - That every Egyptian accepted the text's royal ideology.
  - That Amenemhat I personally commissioned the composition absent separate evidence.

rival_or_counter_witnesses_where_known:
  - SRC-HOP-EGYPT-IPUWER
  - SRC-HOP-EGYPT-ELOQUENT-PEASANT
  - Teaching for King Merikare
  - contemporaneous royal and administrative inscriptions

boundary_effect: >-
  The source may support a bounded claim about Egyptian political imagination and
  legitimation; it may not turn literary chaos into unqualified social history.

age_of_individual_crossing:
  target: historical_spectrum.sacred_cosmic_order
  authority_bearer: Sacred royal office and the king represented as restorer
  human_position: Dependent inhabitant whose security, occupation, and social place require restored order
  demanded_conduct: Recognition of renewed kingship and return to ordered relations
  formative_technique: Prophecy, courtly speech, memory of disorder, and royal legitimation
  crossing_relation: PRESERVE
  non_teleology_rule: >-
    The text does not anticipate the autonomous individual. It clarifies an older
    order in which personal security is intelligible through restoration of a
    royal-cosmic whole.

