what_the_source_can_establish:
  - The vizierial office was represented through specified procedures, reporting relations, records and jurisdictions.
  - Royal instruction demanded impartiality, disciplined hearing and restraint of personal preference.
  - Petitioners were represented as approaching high office for judgment and vindication.
  - Monumental scenes join the office to taxation, accounting, tribute, agriculture, production, workshops and temple provision.
  - Rekhmire's tomb joins administrative office to reputation and mortuary memory.
what_the_source_cannot_establish:
  - That every vizier performed these duties exactly as represented.
  - That TT100 describes all periods, regions or levels of Egyptian government.
  - That every petitioner possessed equal practical access or a modern right of appeal.
  - That autobiographical moral claims are independently verified facts about Rekhmire's conduct.
  - Quantities, frequency or ordinary experience from selected funerary scenes alone.

rival_or_counter_witnesses_where_known:
  - Horemheb Edict
  - Eloquent Peasant
  - tax, labor, treasury and letter records
  - other Installation and Duties copies, including Useramen and Hepu
boundary_effect: >-
  Preserve Installation, Duties, autobiography and image program as related but
  non-identical witness components. Normative office, represented practice and personal
  commemoration cannot be collapsed into one neutral organization chart.

age_of_individual_crossing:
  person_power_relation: official formed as an office-bearer mediating royal command, procedure, records and the governed population
  authority_demand: impartial hearing, reporting, supervision, record and restraint of private preference
  conduct_formation: the person is subordinated to a role whose legitimacy exceeds the private occupant
  later_relation: PRESERVES_AND_TRANSFORMS_IN_LATER_OFFICE_AND_ADMINISTRATIVE_LEGIBILITY
  prohibition: Do not equate office discipline with modern autonomous civil service, universal legal equality or an omniscient state.

