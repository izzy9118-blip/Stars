governing_witness_and_exact_edition_or_archive:
  original_witness: inscriptions and scenes in TT100
  documentary_edition: Norman de Garis Davies, The Tomb of Rekh-mi-Re at Thebes, Metropolitan Museum of Art Egyptian Expedition 11, New York, 1943, two volumes
  digital_edition: https://libmma.contentdm.oclc.org/digital/collection/p15324coll10/id/168715/
