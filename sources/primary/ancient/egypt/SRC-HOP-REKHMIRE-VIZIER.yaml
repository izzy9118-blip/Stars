participant_or_observer_position: elite office-holder's monumental representation of appointment, duties and proper conduct
temporal_distance_if_retrospective: contemporary office monument, but selective and self-presentational

star_layer_target: egyptian_power
star_claim_target:
  - vizier_as_delegated_royal_office
  - hearing_impartiality_judgment_and_procedure
  - treasury_agriculture_military_and_civil_administration
  - office_as_mediation_between_king_and_population
intended_claim_class: DOCUMENTED_OR_TEXTUAL_FACT

what_the_source_can_establish:
  - The vizierial office was represented through specified procedures, reporting relations and jurisdictions.
  - Royal speech and office instruction demanded impartiality and disciplined hearing.
  - Monumental scenes join administrative office to taxation, production, tribute, workshops and social hierarchy.
what_the_source_cannot_establish:
  - That every vizier performed these duties exactly as represented.
  - That TT100 describes all periods or regions of Egyptian government.
  - That autobiographical moral claims are independently verified facts about Rekhmire's conduct.

rival_or_counter_witnesses_where_known:
  - Horemheb Edict
  - Eloquent Peasant
  - tax, labor and treasury records
  - other Installation of the Vizier copies
boundary_effect: >-
  Preserve office ideal, operational description, pictorial program and personal
  self-presentation as related but non-identical evidentiary layers.

age_of_individual_crossing:
  person_power_relation: official formed as an office-bearer mediating royal command, procedure and the governed population
  authority_demand: impartial hearing, record, reporting, supervision and restraint of personal preference
  conduct_formation: the person is subordinated to a role whose legitimacy exceeds the private occupant
  later_relation: PRESERVE_AND_TRANSFORM_IN_LATER_BUREAUCRATIC_OFFICE
  prohibition: Do not equate office discipline with modern autonomous civil service or legal equality.

quotation_state: NOT_YET_ADMITTED
star_integration_state: NOT_YET_PROPOSED
