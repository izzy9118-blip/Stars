what_the_source_can_establish:
  - A major twentieth-century comparative reconstruction of Egyptian kingship as integrating society and nature.
  - Historically influential scholarly distinctions between Egyptian and Mesopotamian conceptions of kingship.
  - Questions and comparisons to test against Egyptian primary witnesses.
what_the_source_cannot_establish:
  - Egyptian self-description merely because its synthesis is learned or influential.
  - One timeless Egyptian political theology valid without period, region or genre controls.
  - The divinity of every historical king in exactly the same sense across all evidence.

rival_or_counter_witnesses_where_known:
  - Erik Hornung, Der Eine und die Vielen
  - Jan Assmann, Ma'at
  - Barry Kemp, Ancient Egypt: Anatomy of a Civilization
  - indigenous royal, mortuary, administrative and wisdom texts
boundary_effect: >-
  Frankfort remains an indispensable modern reconstruction, but the comparative
  thesis must remain attributed and broken down against period-specific Egyptian evidence.

age_of_individual_crossing:
  person_power_relation: modern reconstruction of a sacred order in which king, society and nature precede private individual will
  authority_demand: none directly; the work interprets ancient authority
  conduct_formation: helps define the older form against which the later separate individual becomes intelligible
  later_relation: NO_DIRECT_CROSSING_YET
  prohibition: Do not make Frankfort's synthesis the voice of ancient subjects.

