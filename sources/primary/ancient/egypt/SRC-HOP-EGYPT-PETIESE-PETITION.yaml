star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - Family, priestly office, property, temple jurisdiction, local violence, documentary memory, and appeal to superior authority can remain entangled across generations.
  - The archive allows a petitioner to construct a self and claim through lineage, inherited grievance, documents, and institutional history.
intended_claim_class:
  - SELF_WITNESS
  - ATTRIBUTED_TEACHING_OR_JUDGMENT
  - DOCUMENTED_OR_TEXTUAL_FACT
  - INTERPRETIVE_BRIDGE

what_the_source_can_establish:
  - The claims, genealogy, offices, property relations, accusations, and appeals Petiese's petition records.
  - A long-form Demotic legal narrative in which the petitioner uses documentary and family memory to seek redress.
  - The persistence and contestability of priestly office and temple-linked property under foreign imperial rule.
what_the_source_cannot_establish:
  - The truth of every retrospective episode without corroborating documents.
  - A neutral history of the temple, family, or officials accused.
  - A general right of petition equally available to all inhabitants.
  - Modern individual ownership or legal standing independent of family, priestly office, and status.

rival_or_counter_witnesses_where_known:
  - other Demotic petitions, temple archives, and contracts
  - Persian-period administrative and Aramaic evidence
  - SRC-HOP-EGYPT-ELEPHANTINE-ARAMAIC-ARCHIVE
  - archaeological and prosopographical evidence for Teudjoi and related institutions

boundary_effect: >-
  The petition adds a native late-Egyptian dusk-like family reconstruction from
  within legal practice while keeping allegation, memory, and documentary fact distinct.

age_of_individual_crossing:
  target:
    - historical_spectrum.sacred_cosmic_order
    - historical_spectrum.revelation_and_divine_law
  authority_bearer: Temple office, family lineage, property, local officials, imperial administration, document, and petition
  human_position: Named petitioner whose claim is constituted through ancestry, office, inherited grievance, and preserved record
  demanded_conduct: Recognition of office/property claims and lawful redress as framed by the petition
  formative_technique: Genealogy, archive, narrative, contract memory, petition, accusation, and appeal to superior authority
  crossing_relation: COEXIST_WITH
  non_teleology_rule: >-
    A richly documented personal claim does not make Petiese an abstract individual
    prior to corporate, familial, priestly, and imperial relations.

