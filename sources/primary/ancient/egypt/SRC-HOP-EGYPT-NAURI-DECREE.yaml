star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - Royal law protects sacred estates and their personnel against seizure, requisition, displacement, or abuse by officials and military agents.
  - Protection operates as institution-specific privilege and jurisdiction rather than a general doctrine of equal rights.
intended_claim_class:
  - DOCUMENTED_OR_TEXTUAL_FACT
  - ATTRIBUTED_TEACHING_OR_JUDGMENT

what_the_source_can_establish:
  - The personnel, property, goods, activities, offenses, and penalties named in the decree.
  - A royal claim to shield one temple estate and its dependents from other agents of the state.
  - The fragmentation and overlap of authority within an ostensibly centralized kingship.
what_the_source_cannot_establish:
  - General immunity for all temples, workers, or inhabitants.
  - Actual enforcement in every case.
  - The frequency of every prohibited abuse.
  - A modern separation between church property and state power.

rival_or_counter_witnesses_where_known:
  - SRC-HOP-EGYPT-HOREMHEB-EDICT
  - SRC-HOP-EGYPT-GREAT-HARRIS-PAPYRUS
  - temple administrative papyri
  - evidence for royal requisition, taxation, and military supply

boundary_effect: >-
  The decree adds direct evidence for corporate privilege, protected personnel,
  and conflict among royal agents while remaining bounded to a named estate.

age_of_individual_crossing:
  target: historical_spectrum.sacred_cosmic_order
  authority_bearer: King, temple estate, sacred corporate privilege, officials, military agents, and penal decree
  human_position: Temple worker, priest, cultivator, or dependent protected because of institutional attachment
  demanded_conduct: Service to the estate; officials must respect the bounded protected jurisdiction
  formative_technique: Monumental decree, enumeration of offenses, corporate status, penalty, oath, and royal promulgation
  crossing_relation: COEXIST_WITH
  non_teleology_rule: >-
    Protection of persons through corporate sacred status is not individual right
    prior to membership; it illustrates an older form later legal individualism may displace or appropriate.

