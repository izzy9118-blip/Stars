what_the_source_can_establish:
  - A major modern reconstruction of ma'at across linguistic, social, political, mortuary and intellectual contexts.
  - A framework for testing how cosmic order, social justice, memory and immortality relate without assuming they are one simple doctrine.
  - Specific primary-text pathways that must be checked before History of Power generalizes ma'at.
what_the_source_cannot_establish:
  - That every occurrence of ma'at has one identical meaning across genre and period.
  - Egyptian self-description merely through the authority of modern synthesis.
  - A direct genealogy from Egyptian order to later western individuality or emancipation.

rival_or_counter_witnesses_where_known:
  - Miriam Lichtheim's translations and ma'at studies
  - Erik Hornung, Der Eine und die Vielen
  - Barry Kemp, Ancient Egypt: Anatomy of a Civilization
  - wisdom texts, autobiographies, royal decrees and mortuary sources
boundary_effect: >-
  Assmann may organize a controlled inquiry into ma'at, but every institutional or
  historical proposition must return to genre-specific Egyptian evidence and rival modern readings.

age_of_individual_crossing:
  person_power_relation: person situated within cosmic, social and mortuary judgment rather than constituted first as a separate rights-bearer
  authority_demand: truthful speech, just conduct, reciprocity, memory and judgment within an order exceeding private will
  conduct_formation: ma'at may join public office, interpersonal conduct and postmortem accountability
  later_relation: PRESERVE_AS_OLDER_NORMATIVE_FORM_AND_LATER_TRANSFORM
  prohibition: Do not translate ma'at into modern autonomy, conscience or universal rights without an explicit intervening genealogy.

