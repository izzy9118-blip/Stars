evidence_class: POST_FESTUM_DUSK_WITNESS_EXTERNAL_OBSERVER_AND_COMPILER
participant_or_observer_position: Greek historian who presents Egypt through travel, inquiry, earlier authorities, and comparative universal history
temporal_distance_if_retrospective: Hellenistic-era witness reflecting on pharaonic institutions and traditions extending far earlier

governing_witness_and_exact_edition_or_archive:
  ancient_textual_state: Survives through medieval Greek manuscript transmission, not an autograph
  Greek_critical_text_target:
    editor_tradition: Immanuel Bekker / Ludwig Dindorf / Friedrich Vogel critical-text tradition
    repository: Perseus Digital Library or equivalent page-image critical edition
    status: EXACT_EDITION_URN_AND_BOOK_SECTION_CROSSWALK_PENDING
