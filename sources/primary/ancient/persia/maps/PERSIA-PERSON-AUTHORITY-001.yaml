age_of_individual_boundary:
  finding: >-
    Persian imperial evidence does not reveal one undifferentiated mass of slaves or
    one uniform nomos. It reveals named peoples, communities, officials, workers,
    families, commanders, petitioners and mediators with differentiated agency. Yet
    authority is not primarily grounded in equal naturally separate individuals: it
    proceeds through king, god, dynasty, city, cult, household, army, archive and office.
  prohibition: >-
    Do not infer that absence of modern sovereignty of the individual means absence
    of personal agency, self-control, property, speech, grief, petition or judgment.

cross_source_questions:
  - How does Cyrus's Babylonian legitimation differ from Darius's Achaemenid truth claim?
  - What do routine archives reveal that royal victory monuments suppress?
  - How do provincial persons preserve cult, household and property while remaining imperial subjects?
  - Does multilingual documentation coordinate difference, classify it, or do both at once?
  - Where does personal self-command appear—in king, official, petitioner, soldier or learner—and who is entitled to judge others?
  - How do Greek reflective works humanize and distort Persian political experience at the same time?

remaining_before_star_native_integration:
  - extract controlled Akkadian passages from Cyrus Cylinder and Nabonidus Chronicle
  - extract Old Persian/Elamite/Babylonian passages from Behistun and DNa/DNb
  - select tablet-level Persepolis administrative samples
  - select document-level Elephantine and Arsames samples
  - cross-walk Udjahorresnet against governing hieroglyphic edition
  - extract Greek passages from Aeschylus and Xenophon
  - build explicit Herodotus reattribution table
  - prepare bounded structured-Star correction proposal before narrative revision