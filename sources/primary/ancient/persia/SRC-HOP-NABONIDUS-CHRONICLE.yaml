what_the_source_can_establish:
  - A Babylonian chronicle tradition preserved a dated sequence concerning Nabonidus, Cyrus and the transition of rule.
  - The chronicle supplies a non-Cyrus royal narrative against which the cylinder's claims can be tested.
  - Babylonian political order is represented through regnal chronology, cultic observance, city and military event rather than through one Persian imperial self-description.

what_the_source_cannot_establish:
  - Eyewitness certainty for every entry.
  - The complete motives of Cyrus, Nabonidus, Babylonian elites or inhabitants.
  - That silence or damage in the tablet proves an event did not occur.
  - A neutral account free from Babylonian scribal selection and later copying.

rival_or_counter_witnesses_where_known:
  - SRC-HOP-CYRUS-CYLINDER
  - Babylonian business and temple archives
  - Herodotus, Histories book I
  - later Berossus fragments

boundary_effect: >-
  The chronicle prevents Cyrus's foundation inscription from becoming the sole account
  of 539 BCE while also preventing the later copy from being mistaken for a contemporary
  diary. Event sequence, cultic perspective and royal legitimation remain separate.

