    title: Aeschylus, with an English Translation, volume I
    publisher: W. Heinemann
    year: 1922
    cts_urn: urn:cts:greekLit:tlg0085.tlg002.perseus-grc1
    catalogue: https://catalog.perseus.tufts.edu/catalog/urn:cts:greekLit:tlg0085.tlg002
  supporting_critical_edition:
    editor: Henri Weil
    series: Bibliotheca Teubneriana
    publication: Leipzig, 1926
    cts_urn: urn:cts:greekLit:tlg0085.tlg002.opp-grc5
  rule: >-
    The Greek text and its manuscript-critical tradition govern. Dramatic persona,
    chorus, ghost and messenger remain literary voices attributed within the play.

