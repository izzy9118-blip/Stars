author_or_corporate_author: Aeschylus
work_or_document_title: Persians / Persae
performance_date: 472 BCE
events_reflected: Xerxes's invasion and defeat, especially Salamis in 480 BCE
original_language: Ancient Greek
evidence_class: CONTEMPORARY_REFLECTIVE_WITNESS
witness_subclass: GREEK_TRAGIC_REFLECTION_ON_PERSIAN_IMPERIAL_DEFEAT

participant_or_observer_position: >-
  Athenian tragic poet and veteran of the Persian Wars presenting Persian court,
  grief, kingship and defeat to a civic festival audience. The drama adopts Persian
  speakers but remains a Greek theatrical construction, not a Persian court transcript.
temporal_distance_if_retrospective: approximately eight years after Salamis

governing_witness_and_exact_edition_or_archive:
  ancient_textual_state: medieval manuscript transmission; no authorial copy survives
  governing_digital_greek_witness:
