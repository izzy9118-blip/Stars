purpose: >-
  Test the existing fourteen-source Persia preparatory corpus against the exact
  deficiencies identified in the retroactive audit, then add only those missing
  witnesses or critical controls that materially change source balance, attribution,
  provincial perspective, transmission control or the person-authority relation.

admission_boundary:
  authorized: preparatory source selection, witness locking, metadata control and passage-target planning
  prohibited: claim admission, structured-Star integration, narrative revision, certification and movement to Greece
  rule: >-
    Selection for controlled review does not certify a source, a proposition or a
    layer. Every selected record remains outside STAR-HISTORY-OF-POWER-001 until later
    passage control, source conflict testing, Star-native proposal and owner approval.

existing_selection_test:
  royal_and_operational_archive:
    present:
      - SRC-HOP-CYRUS-CYLINDER
      - SRC-HOP-NABONIDUS-CHRONICLE
      - SRC-HOP-BEHISTUN
      - SRC-HOP-DARIUS-DNA-DNB
      - SRC-HOP-PERSEPOLIS-FORTIFICATION
      - SRC-HOP-ELEPHANTINE-PAPYRI
      - SRC-HOP-ARSAMES-LETTERS
      - SRC-HOP-UDJAHORRESNET
    deficit:
      - SRC-HOP-DARIUS-SUEZ-STELAE
    finding: >-
      The core selection already replaces a purely Herodotean Persia with royal,
      Babylonian, Elamite, Aramaic, Egyptian and routine administrative witnesses.
      Darius's canal stelae remain necessary because they join royal titulary,
      multilingual proclamation, Egypt, infrastructure and interregional mobility.

  ancient_reflective_and_dusk_witnesses:
    present:
      - SRC-HOP-AESCHYLUS-PERSIANS
      - SRC-HOP-XENOPHON-ANABASIS
      - SRC-HOP-XENOPHON-CYROPAEDIA
    deficit:
      - SRC-HOP-CTESIAS-PERSICA
      - SRC-HOP-PLUTARCH-ARTAXERXES
    finding: >-
      Aeschylus and Xenophon supply tragedy, participant history and philosophical
      reconstruction. Ctesias is required as a fragmentary court-connected rival to
      Herodotus; Plutarch is required only as a much later biographical reception of
      Persian court and kingship, not as independent Achaemenid evidence.

  subject_and_community_witnesses:
    present:
      - SRC-HOP-ELEPHANTINE-PAPYRI
      - SRC-HOP-UDJAHORRESNET
    deficit:
      - SRC-HOP-EZRA-NEHEMIAH-PERSIAN-PERIOD
    finding: >-
      Elephantine and Udjahorresnet already prevent the provinces from appearing only
      through royal command. Ezra-Nehemiah is added as a composite Persian-period and
      post-Persian community witness whose embedded documents, law, temple, taxation,
      authorization and local authority must be controlled rather than presumed contemporary.

  later_critical_reconstruction:
    present:
      - SRC-HOP-HALLOCK-PFT-1969
      - SRC-HOP-KUHRT-PERSIAN-EMPIRE
      - SRC-HOP-BRIANT-EMPIRE-PERSE
    deficit:
      - SRC-HOP-WIESEHOFER-ANCIENT-PERSIA-1996
      - SRC-HOP-DANDAMAEV-POLITICAL-HISTORY-1989
    finding: >-
      Hallock governs a major archive; Kuhrt supplies a multilingual corpus; Briant
      supplies comprehensive synthesis. Wiesehöfer adds Iranian-centered source
      criticism across Achaemenid and later Persia, while Dandamaev supplies a distinct
      political reconstruction. Neither becomes primary evidence or an automatic arbiter.

