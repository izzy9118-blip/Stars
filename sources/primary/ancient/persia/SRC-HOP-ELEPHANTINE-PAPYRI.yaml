what_the_source_can_establish:
  - Named provincial inhabitants used contracts, petitions, letters and archives to organize marriage, property, manumission, debt, temple life and communal claims.
  - A Judaean military community lived among Egyptian, Aramaean, Iranian and other persons inside Persian imperial jurisdiction.
  - Subject communities could address officials, preserve claims and invoke administrative channels without becoming sovereign political bodies.
  - Family and personal status became durable through documentary practice.

what_the_source_cannot_establish:
  - One uniform legal system for all Elephantine inhabitants or all imperial provinces.
  - Equal status among free, enslaved, military, gendered, ethnic and religious persons.
  - That preservation of a document guarantees enforcement of its claim.
  - The entire policy of Achaemenid rulers toward Jews, Egyptians or temples.
  - Modern individual rights simply because named persons own, marry, petition or contract.

rival_or_counter_witnesses_where_known:
  - Arshama correspondence
  - Egyptian temple and administrative sources
  - Persian royal inscriptions
  - local Demotic archives
  - Ezra and Nehemiah as separately transmitted Persian-period community texts

boundary_effect: >-
  Elephantine prevents Persian subjects from appearing only as tribute-paying masses
  in Greek or royal accounts. It also prevents documentary personhood from being
  conflated with equal citizenship or natural rights.

