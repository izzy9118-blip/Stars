what_the_source_can_establish:
  - Plutarch's era interpreted Persian kingship through character, household, kinship, advisers, women, eunuchs, military command and moral decision.
  - Late ancient biography preserved and reorganized earlier traditions about Artaxerxes II.
  - Plutarch's use of Ctesias helps control one branch of the lost Persica's reception.
  - The text shows how Persian monarchy became an object of moral and political biography in the Roman imperial world.
what_the_source_cannot_establish:
  - A contemporaneous Achaemenid account of court or administration.
  - The factual accuracy of every anecdote, speech, motive or character judgment.
  - The wording of lost sources where Plutarch paraphrases or combines them.
  - A complete institutional history of Artaxerxes II's reign.

rival_or_counter_witnesses_where_known:
  - Ctesias fragments and Photius epitome
  - Xenophon Anabasis and Cyropaedia
  - royal inscriptions and Babylonian evidence
  - later classical historians
boundary_effect: >-
  Plutarch is admitted to preparatory research as evidence for ancient reception and
  moral biography, not as transparent testimony from the Persian court.

age_of_individual_crossing:
  historically_specific_human_positions:
    - king_as_biographical_subject
    - royal_relative
    - court_adviser
    - eunuch_or_household_actor
    - commander
    - moral_reader
  authority_form: dynastic_kingship_reconstructed_through_character_and_household
  person_power_relation: >-
    Public consequences are narrated through the character and relationships of named
    persons because monarchy gives household proximity and personal judgment imperial range.
  later_relation: LATE_ANCIENT_PERSONALIZATION_AND_MORALIZATION_OF_IMPERIAL_POWER
  prohibition: Do not confuse biographical individualization with modern sovereign individuality or with contemporaneous Persian self-understanding.

passage_control:
  state: TARGETS_IDENTIFIED_GREEK_EDITION_CROSSWALK_PENDING
  targets:
    - Plutarch's source statements and references to Ctesias
    - accession and dynastic conflict
    - court and household actors
    - relation between character and public consequence
    - passages that diverge from Xenophon or direct documentation
  release_condition: >-
    Lock the final Greek critical edition, identify Plutarch's named and inferred
    sources, and separate narrative, quotation and moral inference before use.

star_integration_state: NOT_ADMITTED_PREPARATORY_ONLY
