    series: Loeb Classical Library
    publisher: William Heinemann / G. P. Putnam's Sons
    year: 1926
    language_relation: Greek with English translation on facing pages
    status: WORKING_GREEK_WITNESS_AND_HISTORICAL_TRANSLATION_AID
  final_critical_target:
    work: Plutarchi Vitae Parallelae, Vita Artaxerxis
    edition_family: Teubner critical edition associated with Konrat Ziegler and successors
    status: EXACT_FASCICLE_AND_PAGINATION_TO_VERIFY_BEFORE_PASSAGE_EXTRACTION
