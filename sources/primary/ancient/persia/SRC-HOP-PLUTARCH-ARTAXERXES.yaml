history_of_power_targets:
  star_claim_target:
    - late_ancient_reception_of_Persian_kingship
    - royal_character_household_and_court_as_explanatory_forms
    - succession_family_women_eunuchs_commanders_and_advisers
    - use_of_Ctesias_and_other_lost_sources
    - distinction_between_Achaemenid_evidence_and_Roman_imperial_biography
  intended_claim_class:
    plutarchan_judgment: ATTRIBUTED_TEACHING_OR_JUDGMENT
