source_identity:
  author_or_corporate_author: Plutarch of Chaeronea
  work_or_document_title: Life of Artaxerxes
  date_or_period: late first to early second century CE; narrates Artaxerxes II and earlier fourth-century BCE events
  original_language: Ancient Greek
  evidence_class: POST_FESTUM_DUSK_WITNESS
  genre: moral_and_political_biography

participant_or_observer_position: >-
  Greek moral biographer writing under the Roman Empire with no direct access to the
  Achaemenid court; he assembles earlier literary traditions, including Ctesian material.
temporal_distance_if_retrospective: approximately four to five centuries after Artaxerxes II

governing_witness_and_exact_edition_or_archive:
