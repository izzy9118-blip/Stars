what_the_source_can_establish:
  - Controlled readings, transliterations, translations and identifiers for the published tablet corpus.
  - Document-level evidence for administrative transactions when tied to a specific tablet.
  - A foundation for later archive, seal and prosopographic research.

what_the_source_cannot_establish:
  - The whole Persepolis archive, including unpublished and differently written materials.
  - A complete imperial economy or labor system.
  - That Hallock's translations or restorations are immune from later revision.
  - Subjective experience or consent of persons listed in administrative records.
  - A Star FACT without an identified underlying tablet and bounded inference.

rival_or_counter_witnesses_where_known:
  - ongoing Persepolis Fortification Archive Project editions
  - OCHRE records, images and seal studies
  - later Elamite philology and prosopography
  - Aramaic and uninscribed sealed components of the archive

boundary_effect: >-
  Hallock makes administrative claims auditable at tablet level while preventing
  'the Persepolis archive' from functioning as a vague proof-text. Later corrections
  and unpublished materials remain open.

age_of_individual_crossing:
  relevance: >-
    Hallock permits precise reconstruction of recorded persons through work, ration,
    movement and authorization. The interpretation of those records in the history of
    individuality remains a separate analytical step.
  prohibition: >-
    Do not equate being individually named in an account with modern legal equality,
    autonomy or psychological individuality.

quotation_state: PRIMARY_TABLET_TRANSLATIONS_REQUIRE_IDENTIFIER_AND_IMAGE_CONTROL
