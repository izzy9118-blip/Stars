intended_claim_class: DOCUMENTED_OR_TEXTUAL_FACT

what_the_source_can_establish:
  - A Persian satrap's authority operated through written Aramaic instructions, delegated agents, estate managers and routes of communication.
  - Provincial command joined public office, household and estate interests rather than separating them according to a modern public/private distinction.
  - Named subordinates, workers, travelers and local authorities entered a documentary chain of order, entitlement, supervision and report.
  - Imperial rule could continue across physical absence through scribes, sealed letters and trusted intermediaries.

what_the_source_cannot_establish:
  - That every order was executed as written.
  - A complete constitutional definition of the satrapy or the whole Achaemenid Empire.
  - That estate management and state administration were identical in every context.
  - The subjective experience or consent of laborers and dependents mentioned by elites.
  - That Imperial Aramaic erased local languages, identities or documentary practices.

rival_or_counter_witnesses_where_known:
  - SRC-HOP-ELEPHANTINE-PAPYRI
  - Egyptian Demotic and temple archives
  - Herodotus on satraps and imperial administration
  - Persepolis Fortification Archive
  - royal inscriptions of Darius and Xerxes

boundary_effect: >-
  Arsames's correspondence replaces an abstract satrapy with documented relations of
  letter, agent, estate, travel and delegated authority. It also blocks the assumption
  that a provincial governor was either a modern bureaucrat or a purely private magnate.

