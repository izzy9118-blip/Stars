work_or_document_title: Letters and documents of Arsames, satrap of Egypt
date_or_period: principally later fifth century BCE
original_language: Imperial Aramaic, written mainly on leather or parchment
evidence_class: OPERATIONAL_OR_DIRECT_PRIMARY_WITNESS
witness_subclass: SATRAPAL_ADMINISTRATIVE_AND_ESTATE_CORRESPONDENCE

participant_or_observer_position: >-
  Orders, reports and memoranda generated within the network of a Persian satrap,
  his estate managers, subordinate officials, travelers and agents. Arsames's voice
  is mediated by scribes and documentary convention; the archive is not a reflective
  constitutional treatise.
temporal_distance_if_retrospective: contemporary administrative correspondence

