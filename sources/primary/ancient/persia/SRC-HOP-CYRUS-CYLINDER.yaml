what_the_source_can_establish:
  - Cyrus's regime commissioned a Babylonian royal account of conquest and legitimate kingship.
  - The text presents Marduk as selecting Cyrus and represents entry into Babylon, cult restoration, return of divine images and displaced populations, tribute and building work.
  - Persian imperial rule could adopt the political theology and royal idiom of a conquered center rather than impose one undifferentiated Persian vocabulary.

what_the_source_cannot_establish:
  - That Babylon was entered without violence simply because the inscription says so.
  - That every displaced population was returned or every cult restored.
  - A universal empire-wide policy from one Babylonian foundation deposit.
  - That the cylinder is a charter of modern human or individual rights.
  - Cyrus's Iranian religious self-understanding beyond this Babylonian presentation.

rival_or_counter_witnesses_where_known:
  - SRC-HOP-NABONIDUS-CHRONICLE
  - Babylonian administrative and business archives
  - Herodotus, Histories book I
  - biblical Ezra and Second Isaiah as separately positioned subject-community receptions
  - later Greek and Iranian Cyrus traditions

boundary_effect: >-
  The cylinder replaces the simple contrast between Persian conqueror and passive
  subjects with a relation of conquest, local legitimation, cult restoration and
  tribute. It also blocks the modern rights-charter reading and any inference that
  local religious restoration equals political equality.

