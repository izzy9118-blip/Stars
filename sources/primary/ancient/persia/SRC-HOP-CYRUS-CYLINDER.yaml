participant_or_observer_position: >-
  A royal foundation inscription composed after conquest in the conventional
  theological and scribal idiom of Babylon. Cyrus speaks through a Babylonian
  legitimating form; the text is neither neutral chronicle nor transparent Iranian autobiography.
temporal_distance_if_retrospective: contemporary with the initial Persian settlement in Babylon

