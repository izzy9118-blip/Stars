  knowledge_relations: the ruler studies characters, desires and incentives in order to organize willing obedience
  freedom_relation: followers may cooperate willingly, but the work does not found authority upon equal antecedent individual rights
  crossing_relation: RULE_THROUGH_CHARACTER_AND_DESIRE_LATER_APPROPRIATED_BY_MODERN_GOVERNANCE
  age_of_individual_relevance: >-
    Xenophon makes the knowledge and formation of human motives central to rule while
    preserving hierarchy. This is a distant older relation—not yet modern psychological
    administration, but important for understanding that power has long worked through
    desire, honor and character as well as force.

