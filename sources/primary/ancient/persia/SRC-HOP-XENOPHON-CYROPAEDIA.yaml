intended_claim_class: ATTRIBUTED_TEACHING_OR_JUDGMENT

what_the_source_can_establish:
  - Xenophon constructed a major philosophical-historical account of how Cyrus learns to command, persuade, reward, organize and preserve obedience.
  - The work makes education, character, friendship, fear, honor, household, military organization and institutional arrangement parts of imperial power.
  - It reflects critically on the relation between one superior ruler and the willing or interested cooperation of diverse followers.
  - Its ending raises the problem of whether an empire ordered by an exceptional founder can survive his death.

what_the_source_cannot_establish:
  - The actual childhood, education or precise institutions of Cyrus II.
  - That Xenophon's ideal or ironic Cyrus represents Persian political self-understanding.
  - That every apparently laudatory passage is simple endorsement.
  - A direct causal account of Achaemenid decline.
  - That affection for a ruler equals free consent among political equals.

rival_or_counter_witnesses_where_known:
  - Cyrus Cylinder
  - Herodotus, Histories book I
  - Achaemenid royal and administrative archives
  - Ctesias fragments
  - Xenophon, Anabasis
  - Plato and Isocrates on education and rule as separate Greek reflections

boundary_effect: >-
  Cyropaedia permits the project to study empire as a problem of education and
  cultivated obedience without presenting Xenophon's Cyrus as the historical Cyrus.
  It also prevents institutional survival from being inferred solely from founder virtue.

age_of_individual_crossing:
  authority_bearer:
    - exceptionally educated founder-ruler
    - household and military hierarchy
    - laws, customs, rewards and personal relationships
  human_position:
    - pupil and ruler-in-formation
    - companion and subordinate
    - subject people
    - friend, beneficiary and rival
  claimed_end: durable empire through superior character, order, cooperation and care of followers
  claimed_obligations:
    - obedience and service
    - self-discipline
    - loyalty and reciprocal recognition
  formation_mechanisms:
    - education and habituation
    - emulation of ruler
    - honor, gift and reward
    - friendship and personal attachment
  coercive_mechanisms:
    - army and punishment
    - court hierarchy and dependence
  material_relations:
    - distribution of offices and gifts
    - household and camp
