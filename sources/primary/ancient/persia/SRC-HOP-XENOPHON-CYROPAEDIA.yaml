participant_or_observer_position: >-
  Greek author with military and political experience writing long after Cyrus.
  The work combines Persian and Median settings with Socratic, Spartan, Greek and
  authorial reflection. It is neither straightforward biography nor Persian self-witness.
temporal_distance_if_retrospective: roughly one and a half centuries after Cyrus; exact composition chronology uncertain

