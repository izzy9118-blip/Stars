intended_claim_class: WITNESS_METADATA

what_the_source_can_establish:
  - A documented modern route to a wide range of primary witnesses in different languages and regions.
  - Translation, dating, provenance and contextual problems that must be checked before use.
  - The existence of rival and complementary evidence outside Greek narrative.
  - Source relationships suitable for further verification in governing editions and artifacts.

what_the_source_cannot_establish:
  - That Kuhrt's translations replace the ancient-language governing witnesses.
  - That editorial selection creates a complete imperial archive.
  - An ancient Persian voice independent of the sources translated.
  - A Star FACT merely through citation to the modern corpus rather than the underlying text.

rival_or_counter_witnesses_where_known:
  - language-specific critical editions
  - Pierre Briant, Histoire de l'Empire perse
  - regional specialist corpora and archaeological publications
  - alternate translations and textual restorations

boundary_effect: >-
  Kuhrt enables the project to escape monolingual and Greek-only history while requiring
  every admitted claim to return to the original artifact, language and source position.

age_of_individual_crossing:
  relevance: >-
    The corpus helps identify differentiated persons—king, official, worker, spouse,
    temple community, soldier and subject—but those positions must be reconstructed
    from the ancient witnesses rather than from modern editorial categories alone.
  prohibition: Do not make a modern corpus the speaker of an ancient person or empire.

quotation_state: MODERN_TRANSLATION_USED_FOR_NAVIGATION_PENDING_ORIGINAL_LANGUAGE_CONTROL
star_integration_state: CRITICAL_CONTROL_NOT_PRIMARY_EVIDENCE