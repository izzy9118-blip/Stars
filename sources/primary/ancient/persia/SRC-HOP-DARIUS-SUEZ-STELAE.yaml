what_the_source_can_establish:
  - Darius's government represented the canal as a royal work joining Egypt to the Red Sea.
  - Royal command was issued through multiple imperial languages and Egyptian monumental form.
  - The inscription joins conquest, territorial possession, engineering and maritime movement in one royal claim.
  - Egypt could be represented simultaneously as a conquered land, a governed province and a site of imperial infrastructure.
what_the_source_cannot_establish:
  - The full construction history, labor force, cost, traffic volume or economic effects of the canal.
  - That the project was completed exactly as the inscription claims without archaeological and administrative corroboration.
  - Consent or equal standing among the peoples named or governed.
  - A uniform translation relation among all language versions before item-by-item crosswalk.

rival_or_counter_witnesses_where_known:
  - Herodotus on Darius and Egyptian administration
  - Egyptian canal traditions and archaeological surveys
  - Udjahorresnet statue inscription
  - Darius DNa/DNb and Behistun
  - later Ptolemaic and Roman canal evidence
boundary_effect: >-
  The stelae add royal infrastructure and multilingual proclamation to the Persia
  layer without turning royal achievement language into an independently verified
  administrative history of the canal.

