release_conditions:
  - Owner certifies EGYPT-REPAIR-CERTIFICATION-001.
  - Egypt correction is safely applied or explicitly adopted as the governing pending correction under a stated exception.
  - Owner or governing workflow authorizes formal movement to Persia.
  - Persia audit is read again before any preliminary record, mapped claim or reattribution is promoted.
  - This manifest is amended from PRE_ACQUISITION_HOLD to ACQUISITION_IN_PROGRESS through an explicit commit.

prohibited_inferences:
  - File existence does not equal source acquisition.
  - Metadata locking does not equal passage verification.
  - Preliminary map existence does not equal active claim mapping or narrative readiness.
  - A preliminary reattribution plan does not alter Herodotus's current canonical role.
  - A royal inscription does not become neutral imperial history.
  - A preliminary Age crossing does not establish causal descent toward modern individuality.
  - These artifacts do not satisfy the Persia narrative gate.

