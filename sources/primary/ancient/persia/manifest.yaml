purpose: >-
  Preserve a complete preparatory Persia package under the owner's instruction to
  continue while maintaining the unresolved Egypt certification boundary. The package
  separates Persian royal self-description, Babylonian public memory, routine imperial
  administration, provincial documentary life, Greek contemporary and post-festum
  reflection, and modern critical reconstruction. It prepares but does not admit any
  Persian claim into STAR-HISTORY-OF-POWER-001.

exception_boundary:
  authorized:
    - source discovery and governing-witness locking for controlled review
    - evidence-class, author-position and transmission control
    - non-teleological Age-of-the-Individual person-power analysis
    - non-admitted claim decomposition and passage-target selection
    - Herodotus reattribution as binding research control
    - a non-operative structured-Star correction proposal
  not_authorized:
    - certification or canonical application of the Egypt correction
    - admission of Persian propositions or quotations into STAR-HISTORY-OF-POWER-001
    - canonical narrative revision
    - declaration that the Persian narrative gate is satisfied
    - movement beyond Persia to Greece
  no_self_certification: >-
    The owner's instruction to continue authorizes preparatory production only. It is
    not treated as certification, source admission, adoption of the correction proposal,
    or approval of every provisional claim.

