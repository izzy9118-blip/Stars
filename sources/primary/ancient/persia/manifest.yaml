preparatory_findings:
  - >-
    Cyrus's Babylonian foundation inscription, the Babylonian chronicle tradition
    and Darius's multilingual royal inscriptions are distinct political voices.
  - >-
    Persepolis tablets, Arsames correspondence and Elephantine documents reveal
    imperial power through rations, travel, property, petitions, agents and family
    relations rather than only through conquest narratives.
  - >-
    Udjahorresnet supplies an Egyptian elite self-presentation under Persian rule
    that must stand beside, not disappear beneath, Herodotus's Cambyses.
  - >-
    Aeschylus, Xenophon's Anabasis and Xenophon's Cyropaedia are tragedy,
    participant post-festum history and philosophical reconstruction respectively;
    their disagreement is evidence and may not be smoothed into one Persian teaching.
  - >-
    The Age-of-the-Individual crossing concerns historically specific subjecthood,
    household and documentary agency, labor, travel, property, religious community,
    military service and imperial classification—not a hidden march toward modern rights.

verification_required_before_any_admission:
  - Lock exact governing editions, archive identifiers, languages and transmission chains for every source.
  - Extract original-language passages or document samples against those witnesses.
  - Distinguish royal legitimation from event sequence and routine administration.
  - Test mapped claims against counter-witnesses and modern critical controls.
  - Convert only supported relations into native Star claim classes.
  - Preserve Egypt's pending correction and certification status.

structured_integration_release_conditions:
  - Owner certifies and safely applies the Egypt correction, or expressly authorizes a further bounded exception.
  - Persian governing witnesses and proposed passages are independently checked.
  - The non-operative proposal is reviewed against the current structured Star.
  - Owner or governing workflow separately authorizes Persian admission.

prohibited_inferences:
  - Acquisition for review does not equal evidentiary admission.
  - Passage targeting does not equal quotation verification.
  - A preparatory map does not equal a verified claim map.
  - Herodotus reattribution control does not erase Herodotus or rewrite the Star.
  - A royal inscription does not become neutral imperial history.
  - A person-power crossing does not establish causal descent toward modern individuality.
  - The structured proposal does not satisfy the Persian narrative gate.

