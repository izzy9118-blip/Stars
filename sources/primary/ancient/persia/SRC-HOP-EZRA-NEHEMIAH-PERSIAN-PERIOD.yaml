source_identity:
  author_or_corporate_author: composite Judean scribal and community traditions
  work_or_document_title: Ezra-Nehemiah, with Persian-period narratives and embedded Aramaic documents
  narrated_period: sixth to fifth centuries BCE
  composition_and_editing: debated; final literary forms may be later than several narrated events and embedded documents
  original_languages:
    - Biblical Hebrew
    - Imperial Aramaic sections in Ezra
  evidence_class: COMPOSITE_SUBJECT_COMMUNITY_TEXTUAL_WITNESS_WITH_EMBEDDED_DOCUMENTS
  genre_relations:
    - community_history
    - memoir_like_first_person_material
    - genealogy_and_list
    - decree_letter_and_petition_forms
    - temple_and_law_narrative

participant_or_observer_position: >-
  A subject-community textual tradition presenting imperial authorization, local
  officials, return, temple, genealogy, taxation, law and communal reconstitution;
  it is not one contemporaneous author or an official Persian archive.
temporal_distance_if_retrospective: mixed and disputed; document, memoir and editorial layers require separate dating

governing_witness_and_exact_edition_or_archive:
  principal_textual_witness:
    tradition: Masoretic Text of Ezra-Nehemiah
    languages: Hebrew and Aramaic
  working_critical_edition:
    title: Biblia Hebraica Stuttgartensia
    editor: Karl Elliger and Wilhelm Rudolph, with later corrections
    edition: fifth corrected edition
    publisher: Deutsche Bibelgesellschaft
    year: 1997
    status: WORKING_HEBREW_ARAMAIC_CRITICAL_TEXT
  final_critical_target:
    title: Biblia Hebraica Quinta
    scope: Ezra-Nehemiah fascicle when available and fully controlled for this project
    status: EXACT_FASCICLE_AND_APPARATUS_TARGET_TO_VERIFY
  additional_textual_controls:
    - Septuagint Ezra traditions
    - 1 Esdras and related textual witnesses where relevant
    - Dead Sea and later manuscript evidence where extant
  modern_document_authenticity_control:
    requirement: >-
      Each embedded decree, letter or administrative formula must be assessed
      individually; literary inclusion does not prove archival authenticity.

history_of_power_targets:
  star_claim_target:
    - provincial_subject_community_under_imperial_authorization
    - temple_property_tax_exemption_and_local_office
    - letter_decree_petition_and_travel_permission
    - imperial_law_local_law_and_community_boundary
    - genealogy_household_and_collective_reconstitution
  intended_claim_class:
    textual_representation: ATTRIBUTED_TEACHING_OR_JUDGMENT
