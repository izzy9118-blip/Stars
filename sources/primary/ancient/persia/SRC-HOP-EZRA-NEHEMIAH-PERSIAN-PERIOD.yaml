what_the_source_can_establish:
  - A Judean textual tradition represented Persian rule through kings, governors, treasurers, letters, decrees, travel authorization, temple policy, taxation and local enemies or petitioners.
  - Community reconstruction was narrated through genealogy, household, law, worship, property, office and imperial permission rather than through naturally separate individuals.
  - Aramaic documentary forms were incorporated into the literary account and can be compared with independent Imperial Aramaic archives.
  - Named persons such as Ezra and Nehemiah are represented as agents whose authority depends upon community role, law, office and royal authorization.
what_the_source_cannot_establish:
  - That every embedded Persian decree or letter is an unchanged contemporary archival document.
  - A complete or neutral history of Persian imperial policy toward Judean communities.
  - The experience of all subjects, provinces or religious communities.
  - Exact chronology where literary, memoir and editorial layers remain disputed.
  - A modern doctrine of religious liberty, citizenship or church-state separation.

rival_or_counter_witnesses_where_known:
  - Elephantine papyri
  - Cyrus Cylinder and Babylonian evidence
  - Arsames correspondence
  - Persian royal inscriptions
  - archaeological evidence from Yehud and neighboring provinces
  - Septuagint and 1 Esdras textual traditions
boundary_effect: >-
  Ezra-Nehemiah adds a subject-community voice and documentary forms while preserving
  the distinction among narrated event, embedded document, memoir, editorial theology
  and later textual transmission.

age_of_individual_crossing:
  historically_specific_human_positions:
    - returned_exile_or_descendant
    - scribe
    - governor
    - priest
    - household_head
    - temple_community_member
    - imperial_subject
  authority_form: imperial_permission_local_office_divine_law_genealogy_and_community_discipline
  person_power_relation: >-
    Named persons act through offices, letters, genealogies, households, law and a
    covenantal community whose restoration depends partly upon imperial permission;
    individual action is neither absent nor sovereign over these relations.
  later_relation: OLDER_SUBJECT_COMMUNITY_AND_DOCUMENTARY_MEDIATION_COEXISTS_WITH_LATER_INDIVIDUAL_FORMATION
  prohibition: Do not translate petition, authorization or conscience-like fidelity into prepolitical individual rights.

passage_control:
  state: DOCUMENT_UNITS_AND_THEMES_TARGETED_NOT_EXTRACTED
  targets:
    - Aramaic correspondence and decrees in Ezra 4 through 7
    - tax, tribute, toll and temple-exemption formulas
    - royal authorization and travel
    - Nehemiah's governor relation, taxation and local administration
    - genealogy, assembly and community-boundary passages
    - first-person memoir material separated from editorial frame
  release_condition: >-
    Establish Hebrew-Aramaic textual units, apparatus variants, literary setting,
    document-authenticity scholarship and independent Aramaic comparanda before
    historical claims or direct quotation are admitted.

star_integration_state: NOT_ADMITTED_PREPARATORY_ONLY
