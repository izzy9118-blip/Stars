passage_anchors:
  - section: Second Treatise §124
    text: "The great and chief end therefore, of Mens uniting into Commonwealths ... is the preservation of their Property"
    use: end_of_government
  - section: Second Treatise §138
    text: "The Supream Power cannot take from any Man any part of his Property without his own consent"
    use: limits_on_supreme_power
  - section: Second Treatise §140
    use: taxation_requires_consent_of_majority_directly_or_through_representatives
  - section: Second Treatise §§221-222
    text: "when the Legislative, or the Prince, either of them act contrary to their Trust"
    use: breach_of_trust_dissolution_and_resistance

claim_boundary: >-
  Publication immediately after the Revolution of 1688 does not prove that the work
  was written as a simple retrospective justification of that settlement. The text's
  arguments about trust, property, consent, legislative power, and resistance must be
  treated as Locke's teaching and then compared with, not collapsed into, the enacted
  Bill of Rights.

reuse_policy: >-
  STAR-AGE-OF-INDIVIDUAL-001 contains an existing interpretive Locke layer. This
  primary witness supplements rather than replaces that work. Any transfer into
  History of Power must preserve the distinction between Locke's own text and the
  Strauss-based interpretive source already used elsewhere in Stars.
