witness_policy:
  governing_language: Dutch
  english_translation_as_governing_witness: false
  rule: >-
    All quotations, abstractions, and institutional claims attributed to this
    work must be checked against the Dutch governing witness. Any later English
    rendering is a translation layer and must retain a link to the Dutch passage.
  spelling_policy: >-
    Preserve original spelling in direct quotation. Modernized Dutch may be
    supplied separately for navigation but may not silently replace the witness.
  attribution_caution: >-
    Johan de Witt has traditionally been treated as the author/compiler of the
    Deductie, while the document speaks in the corporate voice of the States of
    Holland and West-Friesland. Repository claims must preserve that distinction.

