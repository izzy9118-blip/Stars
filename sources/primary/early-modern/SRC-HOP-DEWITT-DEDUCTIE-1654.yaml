work:
  attributed_author: Johan de Witt
  corporate_voice: Staten van Hollandt ende West-Vrieslandt
  title: >-
    Deductie, ofte declaratie van de Staten van Hollandt ende West-Vrieslandt;
    behelsende een waerachtich, ende grondich bericht van de fondamenten der
    regieringe vande vrye Vereenichde Nederlanden; ende specialick van 't recht
    competerende de respective Staten vande gheunieerde Provincien yder apart ...
  year: 1654
  language: Dutch
  historical_context: Acte van Seclusie, passed 4 May 1654

use_in_history_of_power:
  - constitutional foundations of the free United Netherlands
  - separate rights of the respective provincial States
  - relation between provincial sovereignty and the Union
  - justification of the Act of Seclusion concerning the Prince of Orange
  - republican argument against hereditary capture of public office
  - documentary bridge between Dutch constitutional form and Johan de Witt's statesmanship

