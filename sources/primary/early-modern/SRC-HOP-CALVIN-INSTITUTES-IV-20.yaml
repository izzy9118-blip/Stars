passage_anchors:
  - section: IV.20.1
    text: >-
      "Porro, quum duplex in homine regimen superius statuerimus ... de altero etiam,
      quod ad instituendam civilem duntaxat externamque morum iustitiam pertinet"
    use: distinction_between_spiritual_and_civil_government
  - section: IV.20.3
    text: >-
      "Sunt autem tres: Magistratus, qui praeses est legum ac custos: Leges,
      secundum quas ipse imperat: Populus, qui legibus regitur et magistratui paret"
    use: magistrate_law_people_as_parts_of_civil_order
  - section: IV.20.31
    text: >-
      "Nam siqui nunc sint populares magistratus ad moderandam Regum libidinem constituti"
    continuation: >-
      "populi libertatem, cuius se Dei ordinatione tutores positos norunt,
      fraudulenter produnt"
    use: constitutionally_appointed_popular_magistrates_may_check_royal_license
  - section: IV.20.32
    text: "Obediendum Deo potius quam hominibus"
    use: obedience_to_magistrates_ends_where_commands_conflict_with_God

claim_boundary: >-
  Calvin does not grant private individuals an unrestricted right to revolt. Section
  31 distinguishes private persons from magistrates or estates constitutionally appointed
  to restrain rulers; section 32 subordinates human command to God. This institutional
  limitation must remain visible.

witness_policy:
