fact_extension_summary: >-
  Early-modern power is reconstructed through Machiavellian founding and reform;
  Reformation jurisdiction and confessional settlement; Bodinian sovereignty;
  Dutch confederal, corporate, maritime, municipal, securities, and public-credit
  institutions; English civil-war claims, Hobbesian authorization, post-1688
  constitutional limits, and funded public credit; and Montesquieu's moderation
  together with Rousseau's distinction between popular sovereignty and government.

