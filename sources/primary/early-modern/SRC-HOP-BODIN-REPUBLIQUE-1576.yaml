claim_boundary: >-
  'Absolute' must not be translated into simple lawlessness. Bodin sharply distinguishes
  sovereignty from temporary delegated office and subjects sovereign princes to divine
  and natural law, while denying that ordinary positive law stands over the sovereign in
  the same way that it stands over subjects. These relations must remain separate.

witness_policy:
  governing_language: French
  rule: >-
    The 1576 French first edition governs terminology and quotations, especially
    souveraineté, absoluë, and perpetuelle. Later French modernizations and Knolles's
    1606 English translation are subordinate witnesses.

