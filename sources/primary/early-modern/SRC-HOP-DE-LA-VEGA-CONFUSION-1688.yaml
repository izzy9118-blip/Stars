use_in_history_of_power:
  - contemporary description of the Amsterdam share market
  - transfer and speculation in VOC shares
  - brokers, options, forward-like bargains, pools, rumor and information
  - distinction between ownership claims and the secondary market in those claims

claim_boundary: >-
  De la Vega describes and dramatizes market practice through dialogues. His text
  is direct contemporary evidence for the existence and perceived operation of
  sophisticated share trading, not a statistically representative survey of every
  transaction on the Amsterdam exchange.
