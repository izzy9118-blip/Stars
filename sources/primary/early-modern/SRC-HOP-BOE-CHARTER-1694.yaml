paired_statute:
  source_id: SRC-HOP-BOE-ACT-1694
  citation: "5 & 6 Will. & Mar. c. 20"
  relation: >-
    The parliamentary Act establishes the revenue and subscription framework;
    the Charter constitutes the subscribing body as the Governor and Company of
    the Bank of England. They must be analyzed as paired but distinct instruments.

witness_policy:
  rule: >-
    Claims about corporate organization, governor, directors, shareholders, and
    chartered privileges must be checked against the Charter; claims about taxation,
    subscription, public revenue, and war finance must be checked against the Act.

