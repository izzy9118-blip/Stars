passage_targets:
  - chapter: VI
    issue: founding_new_orders_force_and_armed_innovators
    anchors:
      - "nuovi ordini e modi"
      - "non è cosa più difficile a trattare ... che farsi capo ad introdurre nuovi ordini"
      - "tutti e' profeti armati vinsono, e li disarmati ruinorno"
  - chapter: XV
    issue: effectual_truth_necessity_and_non_good_action
    anchors:
      - "verità effettuale della cosa"
      - "imparare a potere essere non buono"
  - chapter: XXV
    issue: fortune_virtue_and_adaptation_to_times
    anchors:
      - "la fortuna sia arbitra della metà delle azioni nostre"
      - "riscontrare el modo del procedere suo con la qualità de' tempi"

claim_boundary: >-
  Il Principe is not reduced to a doctrine that any end justifies any means. The
  primary inquiry is how acquisition, preservation, founding, arms, necessity,
  reputation, fortune, and institutional innovation are related under unstable
  political conditions. Claims about a philosophical 'lowering of ends' belong to
  the separately identified Strauss interpretive layer in STAR-AGE-OF-INDIVIDUAL-001.

