name: Early-Modern Primary Source Repair Corpus
status: INITIAL_WITNESS_CORPUS_LOCKED
parent_star: STAR-HISTORY-OF-POWER-001
base_branch: star-history-of-power-001
working_branch: history-of-power-primary-sources-001

purpose: >-
  Lock the primary witnesses needed to repair the missing transition from the
  post-imperial and medieval History of Power layer into Reformation jurisdiction,
  sovereignty, Dutch republican-commercial power, English constitutional conflict,
  and funded public credit before narrative integration begins.

acquisition_rules:
  - Primary texts govern over secondary summaries.
  - Original-language contemporary witnesses govern wherever a usable witness is available.
  - Translations are subordinate reading witnesses unless explicitly designated otherwise.
  - Scan, manuscript, transcription, translation, and later edition are distinct witnesses.
  - Exact edition, language, repository, locator, and translator where relevant are fixed before quotation use.
  - Source-specific witness records govern over discovery-stage notes.
  - No quotation enters STAR-HISTORY-OF-POWER-001 until checked against its governing witness.
  - Modern copyrighted editions may be linked and cited but are not copied wholesale into the repository.

