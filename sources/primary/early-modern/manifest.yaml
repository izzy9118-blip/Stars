purpose: >-
  Lock and map the primary witnesses needed to repair the missing European-Atlantic
  transition from Renaissance statecraft through Reformation jurisdiction, sovereignty,
  Dutch republican-commercial-financial power, English constitutional conflict and
  funded public credit, and Enlightenment moderation and popular sovereignty before
  narrative integration begins.

acquisition_rules:
  - Primary texts govern over secondary summaries.
  - Original-language contemporary witnesses govern wherever a usable witness is available.
  - Translations are subordinate reading witnesses unless explicitly designated otherwise.
  - Scan, manuscript, transcription, translation, later legal reproduction, and later edition are distinct witnesses.
  - Exact edition, language, repository, locator, and translator where relevant are fixed before quotation use.
  - Source-specific witness records govern over discovery-stage notes.
  - No quotation enters STAR-HISTORY-OF-POWER-001 until checked against its governing witness.
  - Modern copyrighted editions may be linked and cited but are not copied wholesale into the repository.
  - Cross-source syntheses must remain distinguishable from propositions stated by individual witnesses.
  - Prior Stars interpretations are reusable only with explicit provenance and may not replace primary witnesses.

source_registry_note: >-
  The individual source records in this directory are authoritative for witness
  metadata and quotation state. This manifest records corpus membership and production
  status rather than duplicating every source-specific field.

