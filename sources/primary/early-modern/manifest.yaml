  - Insert Machiavelli before the Reformation/Bodin/Dutch/English sequence and before the existing Bacon-centered layer.
  - Preserve existing Bacon, Hume, Voltaire, Condorcet, Franklin, Federalist, Burke, Morris, and Talleyrand material unless a direct contradiction requires an explicit correction.
  - Link existing STAR-AGE-OF-INDIVIDUAL-001 interpretations by source ID where reused; do not paraphrase them as primary evidence.
  - Maintain separate narrative roles for historical institutions, actors' self-understanding, philosophical teaching, and later interpretation.
  - Preserve De Witt 1654 Dutch edition as the governing witness.
  - Preserve manuscript/transcription distinctions for VOC, Grotius, 1642 Answer, Wisselbank, and legal settlements.
  - Non-European early-modern imperial comparisons remain a separate expansion unit and are not silently folded into this European-Atlantic repair.
