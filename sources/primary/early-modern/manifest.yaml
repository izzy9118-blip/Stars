corpus_id: HOP-EARLY-MODERN-PRIMARY-001
name: Early-Modern Primary Source Repair Corpus
status: ACQUISITION_IN_PROGRESS
parent_star: STAR-HISTORY-OF-POWER-001
base_branch: star-history-of-power-001
working_branch: history-of-power-primary-sources-001
purpose: >-
  Acquire and lock the primary witnesses needed to repair the missing transition
  from the post-imperial and medieval History of Power layer into early-modern
  sovereignty, confessional government, Dutch republican-commercial power,
  English constitutional conflict, and the fiscal-financial state before any
  narrative integration is attempted.

acquisition_rules:
  - Primary texts govern over secondary summaries.
  - Original-language witnesses govern wherever a usable original witness is available.
  - Translations are registered as subordinate witnesses unless explicitly adopted as governing.
  - Exact edition, translator where known, repository, stable locator, and access state are recorded before quotation use.
  - A digital scan and a modern transcription are distinct witnesses and must not be silently conflated.
  - Later editorial attribution must not replace original title-page attribution without an explicit note.
  - No quotation is admitted to the History of Power narrative until its governing witness is locked and checked.
  - Copyrighted modern editions may be linked and cited but are not copied into this repository merely because they are readable online.

