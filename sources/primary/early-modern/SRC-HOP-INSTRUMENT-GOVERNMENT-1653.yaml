passage_anchors:
  - article: I
    text: "the supreme legislative authority ... shall be and reside in one person, and the people assembled in Parliament"
    use: divided_form_of_supreme_legislative_authority
  - article: II
    text: "the exercise of the chief magistracy ... shall be in the Lord Protector, assisted with a council"
    use: executive_structure
  - article: IV
    use: militia_divided_between_protector_council_and_parliament
  - article: V
    use: foreign_relations_war_and_peace
  - article: VI
    text: "nor any tax, charge, or imposition laid upon the people, but by common consent in Parliament"
    use: parliamentary_taxation_rule

claim_boundary: >-
  The Instrument is a constitutional settlement produced after regicide, civil war,
  and the dissolution of earlier parliamentary arrangements. Its allocation of power
  records an attempted solution; it does not prove that actual Protectorate practice
  always conformed to the text.
