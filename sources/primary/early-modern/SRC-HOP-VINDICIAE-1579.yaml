claim_boundary: >-
  The work is printed under a pseudonym and its authorship remains disputed. The
  repository therefore preserves the title-page author and the catalog attribution
  separately. Its resistance doctrine is covenantal and institutional; it must not be
  silently rewritten as an unrestricted individual right of revolution.
