passage_anchors:
  - article: VI
    use: liberty_of_conscience_and_permission_to_live_within_the_realm_subject_to_the_edict
  - article: XXVII
    text: >-
      "capables de tenir et exercer tous États, Dignitez, Offices et Charges publiques quelconques"
    use: reformed_subjects_admissible_to_public_office
  - articles: worship_provisions
    use: specified_places_and_conditions_for_public_exercise_of_reformed_religion
  - particular_article: I
    text: "l’article sixième dudit Édit touchant la liberté de conscience"
    use: explicit_confirmation_of_conscience_clause

claim_boundary: >-
  The Edict does not establish a religiously neutral state or equal public worship
  everywhere. Catholic worship was restored and privileged; Reformed worship was
  permitted under specified territorial and legal conditions, while civil capacities
  were protected by royal law. Its significance is organized pluralism under monarchy,
  not modern separation of church and state.
