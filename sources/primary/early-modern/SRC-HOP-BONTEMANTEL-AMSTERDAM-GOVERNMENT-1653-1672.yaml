claim_boundary: >-
  Bontemantel is a contemporary participant-observer, not the formal ordinance or
  accounting ledger itself. His notes may establish what Amsterdam government
  recorded and discussed, but transaction-level monetary claims should be
  cross-checked against council resolutions or Wisselbank ledgers where possible.
