passage_targets:
  - location: Book XI, chapter IV
    issue: moderation_and_power_checking_power
    anchor: "pour qu'on ne puisse abuser du pouvoir, il faut que, par la disposition des choses, le pouvoir arrête le pouvoir"
  - location: Book XI, chapter VI
    issue: legislative_executive_judicial_power_and_political_liberty
    anchors:
      - "Il y a dans chaque État trois sortes de pouvoirs"
      - "Lorsque dans la même personne ... la puissance législative est réunie à la puissance exécutrice, il n'y a point de liberté"
      - "Il n'y a point encore de liberté si la puissance de juger n'est pas séparée"
  - location: Book XX, chapters I-II
    issue: commerce_manners_peace_and_mutual_dependence
    anchors:
      - "Le commerce guérit des préjugés destructeurs"
      - "L'effet naturel du commerce est de porter à la paix"
      - "Deux nations qui négocient ensemble se rendent réciproquement dépendantes"

claim_boundary: >-
  Montesquieu does not formulate a modern doctrine of mechanically isolated branches.
  Book XI describes a constitution of distributed powers, checks, and capacities to act
  or prevent action. Likewise, his treatment of commerce is ambivalent: commerce can
  soften manners and create interdependence while also altering or corrupting other virtues.
