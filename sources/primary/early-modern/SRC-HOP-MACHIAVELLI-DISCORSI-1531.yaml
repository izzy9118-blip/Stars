passage_targets:
  - location: Book I, Proemio
    anchors:
      - "trovare modi ed ordini nuovi"
      - "ho deliberato entrare per una via, la quale non essendo suta ancora da alcuno trita"
    use: deliberate_inquiry_into_new_modes_and_orders
  - location: Book I, chapter IV
    heading: "Che la disunione della Plebe e del Senato romano fece libera e potente quella republica"
    anchors:
      - "coloro che dannono i tumulti intra i Nobili e la Plebe"
      - "tutte le leggi che si fanno in favore della libertà, nascano dalla disunione loro"
      - "leggi e ordini in beneficio della publica libertà"
    use: political_conflict_as_source_of_liberty_and_power
  - location: Book I, chapter IX
    heading: "Come egli è necessario essere solo a volere ordinare una repubblica di nuovo"
    use: founding_and_constitutional_authority
  - location: Book I, chapter XVIII
    use: corruption_and_difficulty_of_preserving_or_found_free_government
  - location: Book I, chapter XXV
    anchor: "ritenere l'ombra almanco de' modi antichi"
    use: reform_through_continuity_of_appearances_and_names

witness_policy: >-
  The Roman Blado edition is the princeps bibliographic witness. Because a directly
  accessible full digital image set is locked for the Florentine Giunta edition of the
  same first publication year, passage verification may use that edition while explicitly
  recording its status. No claim may describe Giunta as the Roman princeps.

