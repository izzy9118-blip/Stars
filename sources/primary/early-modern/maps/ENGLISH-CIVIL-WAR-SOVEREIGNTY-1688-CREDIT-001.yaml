    - Cross-walk the 1694 Act's subscription, annual fund, and tax provisions so no amount or revenue stream is conflated.
    - Reuse Locke from STAR-AGE-OF-INDIVIDUAL-001 only after its existing source record is linked into this map; do not duplicate or silently rewrite that prior work.
