map_id: ENGLISH-CIVIL-WAR-SOVEREIGNTY-1688-CREDIT-001
status: PASSAGE_EXTRACTION_IN_PROGRESS
parent_corpus: HOP-EARLY-MODERN-PRIMARY-001
intended_parent_star: STAR-HISTORY-OF-POWER-001

method:
  - The sequence is not narrated as an inevitable rise of Parliament.
  - Royal, parliamentary, army, Protectorate, philosophical, and post-1688 claims are kept separate before synthesis.
  - Constitutional text and actual control of armed force are distinct relations.
  - Later constitutional significance does not replace what each document itself claims.
  - Funded public credit is treated as a political institution joining taxation, subscription, corporation, and war finance, not merely as a banking innovation.

claims:
  - claim_id: ENG-PWR-001
    proposition: >-
      Before civil war, Parliament presented taxation, imprisonment, billeting, and
      martial-law commissions as powers bounded by inherited law and parliamentary consent.
    source_id: SRC-HOP-PETITION-RIGHT-1628
    passage_status: VERIFIED_ENACTED_TEXT
    location: Petition of Right, clauses X-XI
    original_language: English
    anchors:
      - "no man hereafter be compelled to make or yield any gift, loan, benevolence, tax ... without common consent by act of Parliament"
      - "no freeman ... be imprisoned or detained"
      - "commissions for proceeding by martial law, may be revoked and annulled"
    qualification: >-
      The Petition addresses abuses while petitioning the king for recognition of
      existing rights; it is not yet a claim that Parliament alone is sovereign.

  - claim_id: ENG-PWR-002
    proposition: >-
      The Commons' 1641 Remonstrance shifted the constitutional problem toward who
      controlled counsel, religion, administration, and the information by which royal
      authority was exercised.
    source_id: SRC-HOP-GRAND-REMONSTRANCE-1641
    passage_status: VERIFIED_CONTEMPORARY_PRINT
    location: opening declaration and concluding reform program
    original_language: English
    anchor: "how your royal authority and trust have been abused"
    qualification: >-
      The Remonstrance is the Commons' indictment of government and must remain
      distinguishable from the King's account of the same crisis.

  - claim_id: ENG-PWR-003
    proposition: >-
      By 1642 Parliament sought powers over councillors, great offices, militia, and
      the machinery of government that the Crown regarded as constitutive royal powers.
    source_id: SRC-HOP-ANSWER-NINETEEN-PROPOSITIONS-1642
    passage_status: VERIFIED_TEXTUAL_WITNESS
    location: Nineteen Propositions and Charles I's Answer
    original_language: English
    extraction_scope:
      - parliamentary demands concerning Privy Council and great officers
      - parliamentary demands concerning militia and forts
      - royal rejection of unilateral parliamentary lawmaking and militia command
    qualification: >-
      The propositions and Answer are adversarial documents printed together; the map
      preserves the conflict rather than deciding which side possessed the true ancient constitution.

  - claim_id: ENG-PWR-004
    proposition: >-
      Charles I answered parliamentary concentration by describing England as a mixed
      constitution whose stability depended on maintaining a balance among monarchy,
      aristocracy, and democracy rather than reducing the king to a dependent magistrate.
    source_id: SRC-HOP-ANSWER-NINETEEN-PROPOSITIONS-1642
    passage_status: VERIFIED_TEXTUAL_WITNESS
    location: constitutional defense in the Answer
    original_language: English
    anchors:
      - "ancient, equal, happy, well-poised ... Constitution of the Government of this Kingdom"
      - "a mixture of these"
      - "a king of England, a duke of Venice"
    qualification: >-
      This is a royal constitutional self-understanding produced at the edge of civil war,
      not an external description of a settled constitutional equilibrium.

  - claim_id: ENG-PWR-005
    proposition: >-
      Within the victorious parliamentary army, the question of consent divided those
      who tied political voice to being subject to government from those who tied a share
      in government to a permanent material interest in the kingdom.
    source_id: SRC-HOP-PUTNEY-DEBATES-1647
    passage_status: VERIFIED_EDITED_MANUSCRIPT_TRANSCRIPTION
    location: Putney Debates, 29 October 1647, Clarke Papers
    original_language: English
    anchors:
      - speaker: Thomas Rainborough
        text: "the poorest hee that is in England hath a life to live, as the greatest hee"
      - speaker: Thomas Rainborough
        text: "every man that is to live under a Governement ought first by his owne consent to putt himself under that Governement"
      - speaker: Henry Ireton
        text: "a permanent fixed interest in this kingdom"
    qualification: >-
      The Army did not speak with one democratic doctrine. Consent, property,
      representation, military service, settlement, and fear of political dissolution
      were disputed inside the revolutionary coalition itself.

  - claim_id: ENG-PWR-006
    proposition: >-
      Hobbes reconstructed the problem exposed by civil war by making political unity
      an artificial person produced when individuals authorize one representative to
      use their combined strength for peace and common defence.
    source_id: SRC-HOP-HOBBES-LEVIATHAN-1651
    passage_status: VERIFIED_FIRST_EDITION_TRANSCRIPTION
    location: Chapter XVII
    original_language: English
    anchors:
      - "I Authorise and give up my Right of Governing my selfe"
      - "The Multitude so united in one Person, is called a Common-wealth"
      - "One Person, of whose Acts a great Multitude ... have made themselves every one the Author"
    qualification: >-
      Hobbes's sovereign may be one man or an assembly. His answer is not simply a
      defense of Stuart hereditary monarchy; it is a theory of undivided representation
      against competing claims capable of returning society to war.

  - claim_id: ENG-PWR-007
    proposition: >-
      The Protectorate attempted to write the post-regicide distribution of authority
      into a constitutional instrument that joined a Protector, Council, and Parliament
      while separately allocating militia, foreign policy, legislation, and taxation.
    source_id: SRC-HOP-INSTRUMENT-GOVERNMENT-1653
    passage_status: VERIFIED_CONSTITUTIONAL_TRANSCRIPTION
    locations: Articles I-VII
    original_language: English
    anchors:
      - "the supreme legislative authority ... shall be and reside in one person, and the people assembled in Parliament"
      - "the exercise of the chief magistracy ... shall be in the Lord Protector, assisted with a council"
      - "nor any tax, charge, or imposition laid upon the people, but by common consent in Parliament"
    qualification: >-
      The Instrument records an attempted constitutional settlement; actual Protectorate
      practice must not be inferred automatically from the written distribution.

  - claim_id: ENG-PWR-008
    proposition: >-
      The 1689 settlement made suspension of law, taxation by prerogative, and a peacetime
      standing army without parliamentary consent illegal while protecting parliamentary
      election, speech, petition, and recurrent meeting.
    source_id: SRC-HOP-BILL-RIGHTS-1689
    passage_status: VERIFIED_STATUTORY_TEXT
    location: enacted Bill of Rights, declarations of rights and liberties
    original_language: English
    anchors:
      - "levying money ... by pretence of prerogative, without grant of Parliament ... is illegal"
      - "raising or keeping a standing army ... in time of peace, unless it be with consent of Parliament, is against law"
      - "election of members of Parliament ought to be free"
      - "freedom of speech and debates or proceedings in Parliament"
    qualification: >-
      The settlement retains monarchy and succession. It relocates and conditions powers;
      it does not abolish the Crown or make Parliament a modern democratic sovereign.

  - claim_id: ENG-PWR-009
    proposition: >-
      The 1694 Bank of England Act converted parliamentary taxation and voluntary
      subscription into present wartime finance, securing rewards to persons who advanced
      large sums toward the war against France.
    source_id: SRC-HOP-BOE-ACT-1694
    passage_status: VERIFIED_STATUTORY_TEXT
    location: 5 & 6 Will. & Mar. c. 20, title/preamble and section XIX
    original_language: English
    anchors:
      - "voluntarily advance the Sum of fifteen hundred thousand Pounds, towards the carrying on the War against France"
      - "the said summe of Twelve hundred thousand pounds"
      - "one Body Corporate and Politick by the name of The Governor and Company of the Banke of England"
    qualification: >-
      The Act contains a broader package of tonnage and excise duties and a total advance
      larger than the Bank subscription itself. The Bank's £1.2 million subscription must
      not be conflated with the Act's full £1.5 million financing scheme.

  - claim_id: ENG-PWR-010
    proposition: >-
      The 1694 charter transformed subscribers to a parliamentary war-finance scheme into
      a durable corporation with succession, property, internal government, and transferable
      interests, giving public borrowing an organization capable of surviving individual creditors.
    source_id: SRC-HOP-BOE-CHARTER-1694
    passage_status: VERIFIED_OFFICIAL_CHARTER_TEXT
    location: Charter of 27 July 1694
    original_language: English
    anchors:
      - "The Governor and Company of the Bank of England"
      - "one Body Politick"
      - "perpetual succession"
    qualification: >-
      The institution of 1694 should not simply be projected backward as the fully developed
      modern central bank. The immediate relation is corporate public credit joined to state finance.

cross_source_questions:
  - >-
    Why did inherited legal claims in 1628 fail to prevent a crisis over counsel, militia,
    taxation, religion, and executive authority from becoming civil war?
  - >-
    Does the Putney dispute show popular sovereignty emerging, or does it show that the
    meaning of 'the people' itself became a contested object once monarchical authority broke down?
  - >-
    How does Hobbes's attempt to create one artificial sovereign compare with the Protectorate's
    actual written division among Protector, Council, and Parliament?
  - >-
    How did 1689 strengthen political limits on Crown taxation and standing armies while
    simultaneously enabling England to finance larger and more durable warfare after 1694?
  - >-
    Does the Bank settlement reveal a new form of power in which constraints on unilateral
    sovereignty increased the credibility of collective borrowing rather than simply weakening the state?

