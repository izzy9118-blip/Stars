    - enacted Petition of Right locked
    - contemporary Grand Remonstrance print locked
    - royal Answer to Nineteen Propositions locked
    - Putney manuscript transcription locked
    - first-edition Hobbes witness locked
    - Instrument of Government locked
    - original Parliamentary Archives Bill of Rights witness locked
    - Bank of England Act and Charter locked
  remaining:
