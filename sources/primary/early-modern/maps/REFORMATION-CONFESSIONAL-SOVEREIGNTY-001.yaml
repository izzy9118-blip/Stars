    - Calvin 1559 definitive Latin witness locked and IV.20.1, 3, 31, 32 extracted
    - Vindiciae 1579 original Latin print locked with pseudonymous authorship preserved
    - Bodin 1576 French first edition locked and sovereignty/delegation/natural-law distinctions extracted
    - Edict of Nantes contemporary registered print located and core conscience/office clauses extracted
