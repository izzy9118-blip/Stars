map_id: DUTCH-CONSTITUTIONAL-COMMERCIAL-POWER-001
status: PASSAGE_EXTRACTION_SUBSTANTIALLY_COMPLETE
parent_corpus: HOP-EARLY-MODERN-PRIMARY-001
intended_parent_star: STAR-HISTORY-OF-POWER-001

method:
  - No claim below is admitted to the History of Power narrative merely by appearing here.
  - VERIFIED_PRIMARY means wording and location were checked in the locked original-language witness or a diplomatic representation tied directly to it.
  - VERIFIED_TEXTUAL_CHAIN means exact wording and edition location are established through a reliable scholarly quotation, but a final image-level cross-check remains required before verbatim narrative quotation.
  - HISTORICAL_TRANSCRIPTION means a later historical transcription preserves the relevant clause while the original charter remains the governing witness.
  - Original wording remains primary; working English abstractions are subordinate.

claims:
  - claim_id: DUTCH-PWR-001
    proposition: >-
      The Union joins the provinces for common action without dissolving their
      particular privileges, freedoms, rights, statutes, customs, and jurisdictions.
    source_id: SRC-HOP-UNION-UTRECHT-1579
    passage_status: VERIFIED_PRIMARY
    location: Article I
    original_language: Dutch
    anchor: "ten ewygen daeghen by den anderen te blijven ... als off siluyden maer een provincie waeren"
    qualification: >-
      The same article immediately preserves the particular privileges and rights
      of each province, city, member, and inhabitant; unity must not be rewritten
      as creation of a unitary sovereign state.

  - claim_id: DUTCH-PWR-002
    proposition: >-
      The Union creates common powers of defense and common decision while
      requiring especially strong inter-provincial consent for peace, war, and
      general contributions.
    source_id: SRC-HOP-UNION-UTRECHT-1579
    passage_status: VERIFIED_PRIMARY
    location: Articles II-IX
    original_language: Dutch
    anchor: "geen accoordt van bestant oft peys maecken, noch oorloge aenveerden ... dan met gemeen advys ende consent"
    qualification: >-
      Other confederal matters could proceed by provincial majority under Article IX;
      the rule is differentiated rather than a general unanimity principle.

  - claim_id: DUTCH-PWR-003
    proposition: >-
      The Act of Abjuration presents princely authority as existing for protection
      of subjects rather than subjects existing for the prince, and treats sustained
      oppression of inherited liberties as a ground for ceasing to recognize the ruler.
    source_id: SRC-HOP-ACT-ABJURATION-1581
    passage_status: VERIFIED_PRIMARY
    location: 1581 Charles Silvius print, opening declaration, page 2 of digitized facsimile
    original_language: Dutch
    anchor: "d'ondersaten niet en sijn van Godt geschapen tot behoef van den Prince ... maer den Prince om d'ondersaten wille"
    qualification: >-
      The document grounds the action in the deliberation of the States, inherited
      privileges, contracts, oaths, and natural law; it should not be redescribed
      simply as a modern doctrine of individual popular sovereignty.

  - claim_id: DUTCH-PWR-004
    proposition: >-
      The VOC charter converts a commercial union into an instrument exercising
      delegated monopoly, diplomatic, military, judicial, and fortification powers
      within a geographically defined overseas field.
    source_id: SRC-HOP-VOC-CHARTER-1602
    passage_status: HISTORICAL_TRANSCRIPTION_WITH_ORIGINAL_CHARTER_LOCKED
    original_witness: Nationaal Archief 1.04.02 inventory 1
    working_location: later article numbering XXXIV-XXXVI in François Valentijn's 1724 transcription
    original_language: Dutch
    anchors:
      - "niemant ... anders dan die van de voorsz Compagnie ... binnen den tyd van 21 jaaren ... Beoosten de kaap de Bonne Esperance, ofte door de straat van Magellanes"
      - "met de Princen ende Potentaten verbintenis te maaken, ende contracten op den naam van de Staaten Generaal"
      - "fortressen ende verzekertheden te bouwen, gouverneurs, volk van oorlog, ende officiers van Justitie"
    qualification: >-
      The original 1602 charter remains governing. The article numbers and spelling
      above come from Valentijn's later transcription and must not be represented as
      diplomatic transcription of the original manuscript. The essential delegation,
      however, is independently confirmed by the Nationaal Archief description.

  - claim_id: DUTCH-PWR-005
    proposition: >-
      Grotius states Dutch access to Asian navigation and commerce as a rule of the
      law of nations rather than merely a privilege conceded by Portugal or Spain.
    source_id: SRC-HOP-GROTIUS-MARE-LIBERUM-1609
    passage_status: VERIFIED_PRIMARY
    location: Chapter I, page 1
    original_language: Latin
    anchor: "licere cuivis genti quamvis alteram adire, cumque ea negotiari"
    qualification: >-
      The universal form of the claim must remain connected to the concrete Dutch
      contest over Asian commerce; legal universalization and national-commercial
      interest are both part of the historical problem.

  - claim_id: DUTCH-PWR-006
    proposition: >-
      De Iure Praedae places the legal theory of prize and just war inside a concrete
      Dutch struggle over Asian commerce, public wealth, and war against Iberian power.
    source_id: SRC-HOP-GROTIUS-DE-JURE-PRAEDAE
    passage_status: VERIFIED_CRITICAL_EDITION_WITH_MANUSCRIPT_FOLIO
    location: BPL 917, fol. 2r, Caput I opening; Brill/Arkyves critical edition identifier dipms_fac002r
    original_language: Latin
    anchors:
      - "an iusto in bello ... auctoritate publica, recte spolient"
      - "corruet Asiatica omnis negotiatio, qua vel sola vel potissima publicas opes sustineri"
      - "dedit ... Deus telum in ipsa imperii Hispanici viscera"
    qualification: >-
      The manuscript contains revisions. These anchors are tied to the critical
      edition's manuscript folio and must retain the chosen textual state when quoted.
      The claim is not that commerce alone explains Grotius's law of war, but that
      the legal argument is visibly embedded in Dutch commercial and geopolitical stakes.

  - claim_id: DUTCH-PWR-007
    proposition: >-
      The Deductie treats hereditary concentration of the highest political and
      military offices as a danger by which republics can be reduced to monarchy.
    source_id: SRC-HOP-DEWITT-DEDUCTIE-1654
    passage_status: VERIFIED_TEXTUAL_CHAIN
    location: Part II, chapter I, paragraphs 9-10; 1654 edition p. 48
    original_language: Dutch
    anchor: >-
      "dat in eene Republijcque soodanighe charges niet sonder merckelijck perijckel
      vande vryheydt konnen werden gheconfereert op die geene welckers Ouders de
      selve charges daer bevoorens hebben bekleedt"
    continuation_anchor: >-
      "dat alle de Republijcquen vande gantsche Werelt, geene uytghesondert ...
      daer door onder subjectie ghebracht, ende tot een Monarchicquen staet
      ghereduceert zijn"
    corroborating_location:
      passage: Caesar example
      citation: Part II, chapter I, paragraph 12, fol. C12v
      significance: military command can turn the arms of a republic against the republic itself
    hard_rule: >-
      The Utrecht 1654 Dutch edition governs. The wording and page are established
      through scholarship quoting that edition; verbatim narrative quotation still
      requires final image-level comparison with the Utrecht scan.

  - claim_id: DUTCH-PWR-008
    proposition: >-
      De la Court begins from Holland's internal plurality rather than treating it
      as a simple unitary polity, and then connects fisheries, commerce,
      manufactures, liberty, and common material interest.
    source_id: SRC-HOP-DELACOURT-INTEREST-1662
    passage_status: VERIFIED_PRIMARY
    locations:
      - Chapter I, page 1
      - Chapters VI-VIII, pages 11-15
    original_language: Dutch
    anchors:
      - "Holland is geen een Land, en heeft niet allesins een interest"
      - "Dat alle Ingezetenen van Holland, in vryheid zijnde, door een gemeen welen qualik-varen wonderlik aan een zijn geschakeld"
    qualification: >-
      Commercial interest does not erase constitutional plurality. The map must test
      how De la Court joins freedom, livelihood, commerce, taxation, defense, and
      institutional form rather than extracting a generic free-trade doctrine.

cross_source_questions:
  - >-
    How can the provinces act 'as if one province' for union purposes while retaining
    rights that De Witt later insists belong to the respective provincial States separately?
  - >-
    How does the repudiation of tyrannical princely rule in 1581 relate to De Witt's
    fear that hereditary control of the highest civil and military offices can reduce
    a republic to monarchy?
  - >-
    How does the States General's delegation of coercive and diplomatic powers to the
    VOC coexist with a constitutional order suspicious of concentrated domestic office?
  - >-
    How do Grotius's universal claims of navigational and commercial right relate to
    De la Court's explicitly particular account of Holland's interest?
  - >-
    Which parts of Dutch power arise from central coordination, and which arise precisely
    from the inability of any single domestic center to absorb provincial, municipal,
    merchant, corporate, naval, and financial capacities?

remaining_extraction_before_narrative:
  - Perform final image-level cross-check of De Witt p. 48 against Utrecht 1654 scan before verbatim quotation.
  - If a diplomatic transcription of the original 1602 VOC charter becomes available, replace Valentijn spelling and article numbering with original manuscript locators.
  - Preserve Grotius manuscript textual-state information for every quotation.
  - Complete DUTCH-FINANCIAL-POWER-001 before narrative integration.
