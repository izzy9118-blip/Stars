key_relations:
  - the Republic treated as the political form compatible with popular rights
  - autonomy claimed for Paris and for other freely associated communes
  - communal authority over budget, taxation, services, police, education and communal property
  - election, responsibility, continuing control and recall of communal magistrates and officials
  - continuing citizen intervention through speech, association, assembly and publication
  - French unity reconstructed through voluntary association rather than administrative absorption by one center

witness_policy:
  rule: >-
    The declaration governs the Commune's official constitutional program. It does not
    establish that every stated institution was fully implemented during the Commune's
    short and besieged existence, nor that all Communards shared one doctrine.

