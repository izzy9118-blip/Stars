key_provisions:
  - article: 1
    issue: sovereignty resides in the universality of French citizens
  - articles: 18-19
    issue: public powers emanate from the people and legislative/executive/judicial functions are separated
  - articles: 24-25
    issue: direct universal suffrage and electoral body of Frenchmen aged twenty-one with civil and political rights
  - articles: 43-49
    issue: executive power delegated to a directly elected President of the Republic
  - articles: 112-113
    issue: existing laws, regulations and authorities continue until legally altered or replaced

continuity_anchor:
  article: 112-113
  proposition: >-
    Regime foundation and administrative continuity coexist: the new republic does not
    suspend the entire inherited legal-administrative apparatus at the moment of constitutional refounding.

witness_policy:
  rule: >-
    The constitution governs claims about the Second Republic's formal organization and
    explicit continuity clauses. It does not prove that every Imperial, Restoration, or July
    Monarchy institution survived unchanged; institution-specific survival requires separate evidence.

