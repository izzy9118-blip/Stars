passages:
  - issue: history of existing society interpreted through class conflict
    anchor: "Die Geschichte aller bisherigen Gesellschaft ist die Geschichte von Klassenkämpfen."
  - issue: modern public power interpreted as serving common bourgeois class interests
    anchor: "Die moderne Staatsgewalt ist nur ein Ausschuß, der die gemeinschaftlichen Geschäfte der ganzen Bourgeoisklasse verwaltet."
  - issue: proletarian acquisition of political power and transformation of capital relations
    anchor: "Das Proletariat wird seine politische Herrschaft dazu benutzen"
  - issue: association in which individual development and common development cease to oppose one another
    anchor: "die freie Entwicklung eines Jeden die Bedingung für die freie Entwicklung Aller"

witness_policy:
  rule: >-
    The Manifest is evidence for the political teaching of Marx and Engels in 1848,
    not documentary proof that every state act is reducible to one class interest.
    Its class analysis remains distinct from the constitutional programs and actual
    institutions produced during the revolutions of 1848.

