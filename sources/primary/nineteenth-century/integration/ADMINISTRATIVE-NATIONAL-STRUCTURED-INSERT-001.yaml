fact_extension_summary: >-
  Administrative and national power emerges when Rousseauian popular sovereignty,
  Kantian autonomy, Hegelian institutional freedom and Marxian class criticism enter
  the historical field created by revolution and war; Napoleonic executive, territorial,
  legal, military, educational, police, informational, fiscal and infrastructural machinery
  survives later changes of regime; 1848 opens rival democratic, constitutional, national
  and class routes; Italian and German unification join national claims to inherited states;
  and the Paris Commune proposes autonomous associated communes as an alternative to the
  centralized bureaucratic-military state.

