witness_policy:
  rule: >-
    The constitution governs its proposed legal order. Its rejection and failure require
    corroborating institutional evidence and must not be inferred from the text alone.
    The failed parliamentary route to national unity remains distinct from the later
    Prussian-federal route embodied in the constitutions of 1867 and 1871.

