article_unique:
  anchor: >-
    Quiconque transmettra, sans autorisation, des signaux d'un lieu à un autre,
    soit à l'aide de machines télégraphiques, soit par tout autre moyen...
  legal_effect:
    - unauthorized signaling subject to imprisonment and fine
    - court orders destruction of signaling posts, machines, or means

historical_context_control:
  - private and clandestine signaling experiments preceded the law
  - the law converts a previously de facto governmental telegraph privilege into statutory control
  - later opening of telegraph services to private correspondence must be treated as a separate development

witness_policy:
  rule: >-
    Use the 1837 law to establish legal control over unauthorized rapid signaling.
    The common historical label 'state monopoly' may summarize the effect only when
    distinguished from the exact wording, which creates an authorization regime.

