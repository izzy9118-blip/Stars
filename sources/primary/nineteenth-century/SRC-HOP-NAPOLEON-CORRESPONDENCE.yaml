    date, addressee, and editorial witness note.

extraction_targets:
  - instructions to prefects and ministers concerning reporting, administration, and local order
  - correspondence with Fouché and police officials on surveillance and political information
  - orders concerning conscription, troop replacement, and military logistics
  - correspondence on roads, public works, finance, taxation, and provisioning
  - instructions on education, appointments, and administrative personnel
  - statements distinguishing policy made at the center from execution through local officials

