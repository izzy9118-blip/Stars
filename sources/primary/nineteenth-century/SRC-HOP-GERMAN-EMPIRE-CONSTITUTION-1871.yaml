key_relations:
  - Reich laws take precedence over state laws
  - prior North German laws become Reich laws under the transition provisions
  - federal structure retains member kingdoms and states
  - Reich jurisdiction extends across customs, currency, railways, post/telegraph, commerce, military and legal fields
  - Bundesrat and Reichstag remain legislative organs while Prussian king becomes German Emperor
witness_policy: >-
  Preserve federal continuity from the North German Confederation and the survival of
  member states. Imperial unification is neither a wholly new administrative creation in
  1871 nor a unitary abolition of the constituent states.
