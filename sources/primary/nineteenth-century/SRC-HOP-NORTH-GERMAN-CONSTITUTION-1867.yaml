key_provisions:
  - federal laws take precedence over state laws
  - common federal citizenship/Indigenat
  - federal jurisdiction over customs, commerce, money, banking, railways, roads, waterways, post and telegraph
  - common military affairs and navy
  - Bundesrat and Reichstag share federal legislation
  - universal military duty organized at federal scale
witness_policy: >-
  Treat the Confederation as a federal construction combining member states with
  superior federal law and common administrative-military jurisdictions; do not describe
  it as a simple unitary Prussian annexation.
