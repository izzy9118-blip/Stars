key_provisions:
  - article: 1
    issue: national system of major lines from Paris to borders, coasts, Mediterranean and center, plus transverse routes
  - article: 2
    anchor: "par le concours De l'Etat, Des départements traversés et des communes intéressées ; De l'industrie privée"
    issue: combined state, local and private participation
  - article: 3
    issue: State advances land/building compensation with partial reimbursement by departments and communes
  - article: 6
    issue: track equipment, operation and maintenance borne by concessionary companies under public terms
  - article: 9
    issue: administrative regulations govern police, safety, use and preservation of railway infrastructure
  - articles: 10-17
    issue: named appropriations for national lines and studies
  - article: 18
    issue: State share financed provisionally through floating debt and Treasury advances
  - article: 19
    issue: annual special report by public-works minister to the chambers

witness_policy:
  rule: >-
    The law demonstrates deliberate national network planning through mixed public,
    local, and private institutions. It should not be simplified into either purely
    state-built railways or purely private enterprise.

