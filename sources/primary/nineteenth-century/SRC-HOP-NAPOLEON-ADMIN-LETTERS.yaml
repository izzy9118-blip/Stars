    napoleonica_id: CG5-10048
    date: 1805-05-13
    sender: Napoleon
    recipient: Fouché, minister of general police
    issues:
      - individualized intelligence request
      - surveillance
      - arrest instruction
    anchor: "Surveillez le nommé Thornton et faites-le arrêter"
