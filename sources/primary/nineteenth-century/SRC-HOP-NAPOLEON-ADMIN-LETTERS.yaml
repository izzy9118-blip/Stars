witness_policy:
  rule: >-
    Use the two Napoleonica letters as direct evidence of personal executive instruction
    because their archival minutes are identified. The 25 March 1802 road letter may
    support navigation and paraphrase, but direct quotation remains subordinate until its
    original archival or critical-edition metadata is cross-walked.

