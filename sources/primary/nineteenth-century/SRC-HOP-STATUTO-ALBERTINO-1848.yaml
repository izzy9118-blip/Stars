continuity_problem: >-
  The Statuto begins as the constitution of the Kingdom of Sardinia and later becomes
  the constitutional framework of the Kingdom of Italy, making unification partly an
  enlargement of an existing state and legal form rather than construction from zero.
witness_policy: >-
  Preserve the Sardinian origin of the document. Its later Italian operation is a
  historical continuity relation requiring post-1861 evidence, not something contained
  in the 1848 text itself.
