continuity_controls:
  - Vittorio Emanuele retains ordinal II, marking dynastic continuity with Kingdom of Sardinia
  - law changes royal title through existing Senate, Chamber, Crown and ministerial procedure
  - unification therefore requires separate evidence for administrative integration of newly annexed provinces
witness_policy: >-
  The 17 March law is the legal act of royal-national title and state proclamation. It
  does not by itself prove political, fiscal, legal, or administrative homogenization of
  the peninsula.
