primary_questions:
  - How does restored monarchy describe the source of constitutional authority after Revolution and Empire?
  - Which revolutionary/imperial legal and administrative settlements survive despite dynastic restoration?
  - How are royal executive powers related to chambers, law, taxation, and civil equality?

key_passage_targets:
  - preamble on whole authority residing in the king while its exercise may be modified according to times
  - equality before law and taxation
  - preservation of civil rights and property
  - royal appointment and executive powers
  - legislative relation between Crown and chambers

witness_policy:
  rule: >-
    Use the Charter as the restored monarchy's constitutional self-understanding.
    Administrative continuity must be demonstrated separately through institutions and practice;
    the Charter alone does not prove which Napoleonic offices survived unchanged.

