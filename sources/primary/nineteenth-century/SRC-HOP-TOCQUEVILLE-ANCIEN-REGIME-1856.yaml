witness_policy:
  rule: >-
    Tocqueville writes retrospectively in 1856. His account is primary evidence for his
    mature interpretation of centralization and continuity, not contemporaneous documentary
    proof of eighteenth-century administration. Historical claims he makes about the Old
    Regime must be checked against the underlying archival/institutional evidence if adopted as fact.

