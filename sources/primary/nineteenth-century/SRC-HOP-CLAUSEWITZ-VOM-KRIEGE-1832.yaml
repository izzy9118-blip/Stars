editorial_status:
  - work published posthumously by Marie von Clausewitz
  - Clausewitz states that the first six books remained an unfinished mass requiring revision
  - Book VIII and the late notes require special attention to textual chronology

primary_passage_targets:
  - war as an act of force to compel the opponent to fulfill our will
  - relation between political purpose and military means
  - friction, uncertainty, moral forces and limited knowledge
  - distinction between war aimed at overthrowing the opponent and limited war
  - people's war / national mobilization where relevant

witness_policy:
  rule: >-
    Preserve the unfinished and posthumous status of the text. Do not turn one famous
    formulation into a complete system or assume every passage represents Clausewitz's
    final revised position.

