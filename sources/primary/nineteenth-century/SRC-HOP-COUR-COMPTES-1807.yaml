key_provisions:
  - article: 1
    anchor: Les fonctions de la comptabilité nationale seront exercées par une Cour des comptes.
  - article: 6
    issue: members appointed for life by the Emperor; presidents changeable annually
  - article: 11
    issue: court judges accounts of Treasury receipts and expenditures, departmental receivers, indirect-tax administrations, army paymasters, military divisions, maritime districts, departments and communes whose budgets are fixed by the Emperor
  - article: 12
    issue: public accountants required to file accounts, with penalties for delay
  - article: 13
    issue: court determines whether accountants are discharged, in advance, or in debit and can order repayment to the Treasury

witness_policy:
  rule: >-
    The law demonstrates centralized judicial accounting and accountability of public
    money. It does not by itself establish that all imperial finances were transparent,
    efficient, or independent of executive influence.

