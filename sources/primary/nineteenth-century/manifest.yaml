core_findings_under_test:
  - Constitutional sovereignty can change while territorial administrative offices persist.
  - The state becomes increasingly capable of knowing property and population, collecting and auditing revenue, moving armies and officials, controlling rapid signaling, and planning national transport networks.
  - Democratic or republican reforms do not necessarily dissolve central administrative capacity; they can repurpose it.
  - Administrative centralization may have important pre-Revolutionary roots even where Revolution and Empire intensify or reorganize it.

remaining_controls:
