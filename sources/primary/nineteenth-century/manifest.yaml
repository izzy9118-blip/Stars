corpus_id: HOP-ADMINISTRATIVE-STATE-001
name: Administrative and National Power Primary Source Corpus
status: THROUGH_1856_GATHERED_NATIONAL_UNIFICATION_NEXT
parent_star: STAR-HISTORY-OF-POWER-001
base_branch: history-of-power-primary-sources-001
working_branch: history-of-power-administrative-state-001

period_focus: "1798-1815 Napoleonic administrative state mapped; 1815-1848 constitutional/administrative continuity and infrastructure gathered; 1848-1856 republican expansion and Tocqueville retrospective added"

purpose: >-
  Reconstruct how revolutionary sovereignty and mobilization were converted into durable
  executive, territorial, military, legal, educational, police, informational,
  infrastructural, fiscal, and accounting capacities; determine how those capacities
  survive constitutional regime change; and follow their fusion with democratic claims,
  industrial communications, national military organization, and nineteenth-century unification.

acquisition_rules:
  - Primary legal and administrative texts govern over later descriptions.
  - Original-language official texts and archival witnesses govern where available.
  - Revolutionary institutions inherited by Napoleon are not relabeled as Napoleonic inventions.
  - Regime change and administrative continuity are separate relations and must be demonstrated independently.
  - Constitution, administration, police, military recruitment, law, education, statistics, infrastructure, taxation, accounting, communications, and personal executive correspondence remain distinct evidence classes.
  - Philosophical and military-theoretical texts are attributed interpretations, not substitutes for institutional evidence.
  - Later retrospective texts such as Tocqueville 1856 are primary evidence for the author's interpretation, not automatically for the earlier institutions described.
  - Communications and transport are political capacities only where their legal, financial, or administrative organization is documented.
  - Claims of centralization, bureaucracy, nationalism, modernization, or state capacity must be demonstrated through institutions and documents rather than assumed from period labels.

