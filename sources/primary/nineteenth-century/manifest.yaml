period_focus: "1798-1815 core administrative unit mapped; chronological continuation into 1815-1848 beginning"

purpose: >-
  Reconstruct how revolutionary sovereignty and mobilization were converted into
  durable executive, territorial, military, legal, educational, police,
  informational, infrastructural, fiscal, and accounting capacities under the
  Consulate and Empire, then determine which capacities survive Restoration and
  how nineteenth-century thinkers understand the national and administrative state.

acquisition_rules:
  - Primary legal and administrative texts govern over later descriptions.
  - Original-language official texts and archival witnesses govern where available.
  - Revolutionary institutions inherited by Napoleon are not relabeled as Napoleonic inventions.
  - Constitution, administration, police, military recruitment, law, education, statistics, infrastructure, taxation, accounting, and personal executive correspondence remain distinct evidence classes.
  - A later critical correspondence edition may govern document identification only when each quoted letter retains its individual primary-document metadata.
  - Claims of centralization, bureaucracy, nationalism, modernization, or state capacity must be demonstrated through institutions and documents rather than assumed from period labels.
  - Later theorists may interpret earlier institutions, but their retrospective accounts do not replace contemporary administrative evidence.

