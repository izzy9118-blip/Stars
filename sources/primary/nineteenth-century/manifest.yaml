period_focus: "1798-1871: revolutionary/Napoleonic administration, Restoration and democratic continuity, communications/transport, republican expansion, and national unification"

purpose: >-
  Reconstruct how revolutionary sovereignty and mobilization were converted into durable
  executive, territorial, military, legal, educational, police, informational,
  infrastructural, fiscal, and accounting capacities; determine how those capacities
  survive constitutional regime change; and follow their fusion with democratic claims,
  industrial communications, national military organization, and national unification.

