period_focus: "1798-1815 initial unit; nineteenth-century continuation to follow"

purpose: >-
  Reconstruct how revolutionary sovereignty and mobilization were converted into
  durable executive, territorial, military, legal, educational, police, and
  informational capacities under the Consulate and Empire before extending the
  chronology through Restoration, Tocqueville, Hegel, Clausewitz, 1848, national
  unification, and industrial administration.

acquisition_rules:
  - Primary legal and administrative texts govern over later descriptions.
  - Original French official texts and archival witnesses govern where available.
  - Revolutionary institutions inherited by Napoleon are not relabeled as Napoleonic inventions.
  - Constitution, administration, police, military recruitment, law, education, statistics, and personal executive correspondence remain distinct evidence classes.
  - A later critical correspondence edition may govern document identification only when each quoted letter retains its individual primary-document metadata.
  - No narrative integration occurs until the first unit has a passage-to-claim map.
  - Claims of centralization, bureaucracy, nationalism, or modernization must be demonstrated through institutions and documents rather than assumed from period labels.

