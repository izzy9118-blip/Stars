core_relations_now_documented:
  - Revolutionary mass military obligation can be inherited by later executive regimes.
  - Prefectural, legal, fiscal and territorial administration can survive changes among Empire, Restoration monarchy, July Monarchy and democratic republic.
  - State legibility expands through statistics and cadastre; fiscal capacity through staffed collection and accounting/audit.
  - Telegraph law and railway planning make rapid information and transport part of public jurisdiction and national-scale planning.
  - Republican rights can be implemented through inherited administrative machinery, including emancipation across colonial possessions.
  - Tocqueville retrospectively identifies important roots of administrative centralization in the Old Regime rather than treating it as an invention of 1789 or Napoleon.
  - Italian national unification carries forward an existing dynastic-constitutional state form; German unification builds superior federal law and common administrative-military jurisdictions across member states.
  - The revolutions of 1848 open rival constitutional, national and class routes rather than one uniform revolutionary program.
  - The Paris Commune proposes autonomous associated communes and recallable office as an alternative to inherited centralized administration; Marx's interpretation of that experiment remains distinct from the Commune's own declaration.

remaining_controls:
