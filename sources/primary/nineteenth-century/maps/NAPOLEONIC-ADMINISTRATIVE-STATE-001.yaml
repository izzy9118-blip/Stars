cross_source_questions:
  - >-
    How did a revolution claiming popular sovereignty produce an executive able to appoint
    large portions of the administrative, diplomatic, military, and judicial apparatus?
  - >-
    Which capacities were revolutionary inheritances and which were Consular or Imperial reorganizations?
  - >-
    Did the prefectural chain strengthen the state by replacing local political initiative,
    or by making local information and execution more reliably available to the center?
  - >-
    How did legal uniformity coexist with differentiated household, property, fiscal, and administrative hierarchies?
  - >-
    How did conscription, schools, police, statistics, cadastre, roads, taxation, accounting, and law make the population and territory simultaneously bearers of sovereignty, resources to mobilize, objects to know, and fields to administer?
  - >-
    Which capacities depended upon Napoleon personally, and which were institutional enough to survive his fall?

narrative_gate:
  state: CONDITIONALLY_SATISFIED_FOR_CORE_ADMINISTRATIVE_MECHANISMS
  satisfied:
    - executive appointment and decision
    - prefectural territorial administration
    - police authority
    - revolutionary conscription inherited by the regime
    - state-organized secondary education
    - civil-law standardization
    - imperial constitutional settlement
    - road classification and public-works direction
    - property legibility through cadastre
    - indirect-tax collection machinery
    - centralized public-accounting review
    - two archival-minuted examples of personal police direction
  remaining_controls:
    - inspect the original or contemporary printed Chaptal statistical circular before direct quotation
    - cross-walk the 25 March 1802 Chaptal road letter to its original minute or critical correspondence number before direct quotation
    - acquire one quantified Treasury/budget witness only if the narrative requires claims about aggregate fiscal capacity rather than administrative machinery
    - preserve revolutionary origins of conscription and earlier antecedents of prefectural, statistical, road, cadastral, and accounting practices
