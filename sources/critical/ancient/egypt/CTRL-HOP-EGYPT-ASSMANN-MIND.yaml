star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - relations among ma'at, kingship, social order, historical memory, and Egyptian self-description
  - control of claims that Egypt possessed one continuous civilizational meaning across long periods
intended_claim_class:
  - LATER_CRITICAL_RECONSTRUCTION_NOT_PRIMARY
  - INTERPRETIVE_BRIDGE

what_the_source_can_establish:
  - A major modern reconstruction of Egyptian cultural memory, political theology, ma'at, and historical meaning.
  - Conceptual distinctions and evidentiary questions to test against ancient texts and monuments.
  - A scholarly counterweight to unsupported universal or esoteric syntheses.
what_the_source_cannot_establish:
  - An ancient Egyptian proposition merely because Assmann reconstructs it.
  - Uniformity across all periods, regions, institutions, and social ranks without primary evidence.
  - The exact meaning of a damaged text independent of philological and archaeological control.

rival_or_counter_witnesses_where_known:
  - Erik Hornung on divine plurality
  - Barry Kemp on archaeological and institutional structure
  - Richard Parkinson on literary genre and elite culture
  - source-specific philological editions and competing Egyptological interpretations

boundary_effect: >-
  Assmann may organize questions of meaning and memory, but every historical
  proposition returning to the Star must cite the ancient relation it controls.

age_of_individual_crossing:
  target: historical_spectrum.sacred_cosmic_order
  use: >-
    Helps articulate an older order in which personhood is embedded in ma'at,
    kingship, memory, and institutions; does not itself prove a direct causal path
    to the modern individual.
  crossing_relation: INTERPRETIVE_CONTROL_ONLY

