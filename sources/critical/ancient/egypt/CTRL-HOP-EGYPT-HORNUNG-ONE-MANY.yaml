star_layer_target: historical_spectrum.egyptian_power
star_claim_target:
  - current claims that Egyptian sacred science formed one unified doctrine
  - relations among divine plurality, unity, names, manifestations, and political-theological order
intended_claim_class:
  - LATER_CRITICAL_RECONSTRUCTION_NOT_PRIMARY
  - BOUNDARY_CONTROL

what_the_source_can_establish:
  - A major modern philological and history-of-religions argument concerning the plurality and relational character of Egyptian gods.
  - Reasons to resist translating Egyptian divine multiplicity into either simple polytheism or one hidden monotheistic system.
  - A critical boundary for claims that several cult centers expressed one fully closed doctrine.
what_the_source_cannot_establish:
  - That Hornung's reconstruction was an ancient actor's explicit system.
  - Political or administrative consequences not demonstrated through separate evidence.
  - Uniform belief across periods, temples, and social positions.

rival_or_counter_witnesses_where_known:
  - Jan Assmann on theology, memory, and political order
  - temple-specific theological texts
  - Amarna material and later reception
  - Schwaller de Lubicz's modern symbolist synthesis, treated as a rival interpretation rather than ancient evidence

boundary_effect: >-
  Hornung supplies a necessary control against collapsing distinct Egyptian
  deities, centers, and periods into one metaphysical doctrine.

age_of_individual_crossing:
  target: historical_spectrum.sacred_cosmic_order
  use: >-
    Preserves the complexity of the sacred order that precedes the modern
    individual; it prevents the older world from being simplified into a single
    doctrine invented for a later genealogy.
  crossing_relation: INTERPRETIVE_CONTROL_ONLY

