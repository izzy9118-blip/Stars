completion_rule: >-
  A layer is not ready because sources are named or a map is complete. It requires
  provenance correction, first-class rival witnesses, boundaries, an Age-of-the-
  Individual person-power crosswalk, verified passages or documents, and a structured-
  Star integration proposal. Preparation, verification, admission, application and
  certification remain separate states.

acquisition_admission_rule: >-
  Every new source identifies its History of Power layer and claim targets, native
  claim class, supported and unsupported propositions, boundary effect and rival
  witnesses, together with the historically specific person-power relation and
  Age crossing. Prestige alone is never grounds for acquisition.

program_findings:
  - No existing layer passes the revised narrative gate unchanged.
  - History of Power and the Age of the Individual are structurally aligned; the main risk is universal-history and state-capacity drift.
  - Ancient layers require strict separation among ancient self-witness, ancient dusk reflection and modern reconstruction.
  - Egypt now includes loyal subjecthood, labor, petition, office and Amenemope's inward moral formation without back-projecting modern autonomy.
  - Egypt's modern symbolist and lost-civilization claims are reclassified and no longer eligible for unqualified FACT voice.
  - Persia's preparatory package now supplies royal, Babylonian, administrative, provincial and reflective voices alongside Herodotus.
  - The Persian evidence replaces a simple free-Greek/passive-Persian contrast with differentiated agency under unequal imperial forms.
  - Herodotus remains indispensable but is governed by an explicit reattribution table.
  - Greece needs epigraphic institutions and philosophical regime reflection; Rome needs direct principate texts and annalistic controls.
  - Medieval and modern layers retain the reflective and rival witness deficits identified in their audits.

