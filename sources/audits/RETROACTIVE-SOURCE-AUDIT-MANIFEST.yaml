completion_rule: >-
  A layer is not ready merely because sources are named or a working map is complete.
  The audit must identify current evidentiary strengths, missing witness classes,
  misclassified sources, claims whose provenance is too weak for their current
  status, first-class additions, and a concrete Star-native integration proposal.
  It must then complete the Age-of-the-Individual person-power crosswalk without
  projecting later individualism backward. Only STAR-HISTORY-OF-POWER-001 can finally
  carry the admitted claim structure.

acquisition_admission_rule: >-
  Every newly acquired source must identify its History of Power layer target,
  History of Power claim or boundary target, intended native claim class, what it can
  establish, what it cannot establish, its boundary effect, and rival/counter-witnesses.
  It must also identify the historically specific human position, authority form,
  person-power relation, Age crossing relation, and why the source is material to the
  bounded older-forces thesis. Prestige, geopolitical importance or canonical status
  alone are not grounds for acquisition.

program_findings:
  - No existing layer passes the revised narrative gate unchanged.
  - The native History of Power architecture and Age of the Individual thesis are structurally aligned.
  - The principal new risk is universal-history and state-capacity drift rather than a contradiction between the Stars.
  - Ancient layers require the sharpest separation between primary witness, ancient post-festum reflection and modern critical reconstruction.
  - Egypt contains modern interpretive claims currently too close to FACT-level voice and requires immediate reclassification.
  - Persia is structurally overdependent on Herodotus and requires a Persian/Babylonian/Aramaic/provincial archive.
  - Greece needs epigraphic institutions plus Plato/Aristotle and other regime reflection beside narrative history.
  - Rome needs direct principate constitutional texts and explicit annalistic-distance controls.
  - Medieval history needs law, charters, canon law and major political books beside chronicles.
  - Early-modern operational repair is strong but major contemporary and post-festum books remain absent.
  - Revolutionary history needs constituent texts, dissenting American voices, French revolutionary self-understanding and participant dusk histories.
  - Nineteenth-century administration needs industrial, class, liberal and nationalist reflective books and explicit person-power crosswalks.
  - Imperial-industrial history needs rival theories of empire, corporate criticism, subject-side colonial reflection, Japanese self-understanding, and selection control against mere great-power chronology.
  - Total-war history needs organizer, revolutionary, soldier, propaganda, colonial and post-festum voices beside emergency statutes, with persons tracked as soldiers, workers, taxpayers, borrowers, rationed civilians and publics.

