purpose: >-
  Re-audit every History of Power layer from the beginning under the expanded
  witness method while remaining subordinate to both the native History of Power
  Star architecture and the bounded Age of the Individual thesis. Each layer must
  distinguish operational/direct evidence, contemporary reflection, post-festum/dusk
  reflection, and later critical reconstruction; reconstruct its historical form on
  its own terms; and then complete a non-teleological person-power crosswalk before
  any Star-native integration proposal can be treated as ready.

scaffold_status:
  rule: >-
    Every corpus, map, audit, manifest, production state, witness count, or
    narrative-gate label under sources/ is procedural research scaffolding only.
    None is a second Star and none supersedes STAR-HISTORY-OF-POWER-001.
  star_native_return: >-
    Findings become admissible only when mapped back into the Star's fact, scope,
    shape, claim_policy, historical_spectrum, boundaries, evidence, conceptual_chain,
    or navigational questions.

companion_star_alignment:
  principle: >-
    History of Power is the counter-genealogy of the older forces that the Age of
    the Individual later encounters. It is not a universal history of powerful states.
  required_second_stage: >-
    After own-source reconstruction, every layer identifies its historically
    specific human position, form of authority, person-power relation and bounded
    crossing relation to the Age thesis.
  permitted_crossings:
    - PRESERVES
    - DISPLACES
    - APPROPRIATES
    - COEXISTS_WITH
    - TRANSFORMS
    - NO_DIRECT_CROSSING_YET
  anti_teleology: >-
    The Age of the Individual is not the hidden end of earlier history. Crossing
    analysis follows reconstruction of the older form in its own categories.

