layer: imperial_industrial_world_power_1871_1914

current_strengths:
  operational_and_crisis_corpus:
    witness_count: 47
    strengths:
      - Reichsbank and monetary coordination
      - German corporation law and Standard Oil trust agreement
      - Sherman Act regulation
      - German social insurance statutes
      - Berlin Conference and German colonial law/budgets/mining rules
      - Kiel Canal, British and German naval legislation
      - Tirpitz risk-fleet policy memorandum
      - telegraph and radiotelegraph conventions
      - Indian telegraph monopoly/interception law
      - Schlieffen memorandum
      - German statistical yearbook 1913
      - Meiji Constitution, education rescript, Shimonoseki, Anglo-Japanese alliance, Korea annexation
      - independent July Crisis documentary voices through 4 August 1914
  reflective_targets_already_registered:
    - Mahan, The Influence of Sea Power upon History, 1890 - locked
    - Hobson, Imperialism: A Study, 1902
    - Hilferding, Das Finanzkapital, 1910
    - Luxemburg, Die Akkumulation des Kapitals, 1913
    - Lenin, Imperialism, written 1916/published 1917
    - Schumpeter, Zur Soziologie der Imperialismen, 1919
  assessment: >-
    The institutional map is broad and comparative. The reflective correction begun
    earlier is valid but still too narrowly centered on finance-capital theories of
    imperialism. The layer also needs contemporaries who interpreted corporation,
    geography, empire, race, national economic policy, Japan's constitutional order,
    investigative exposure of corporate/colonial power, and the possibility that
    economic interdependence could restrain war.

