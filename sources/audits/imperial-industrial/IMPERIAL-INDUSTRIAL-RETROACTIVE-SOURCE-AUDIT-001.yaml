narrative_gate:
  state: NOT_SATISFIED_UNDER_REVISED_METHOD
  reason: >-
    The operational corpus and July Crisis map are strong, but the age must be allowed
    to argue with itself through rival contemporary books on empire, finance, corporation,
    geography, race, Japan and interdependence.
  requirements:
    - acquire Hobson/Hilferding/Luxemburg/Lenin and Schumpeter as rival imperialism theories
    - add Veblen/Tarbell for corporate power
    - add Seeley/Mackinder/Angell for imperial-geopolitical disagreement
    - add Casement/Morel/Naoroji for colonial subject and investigative perspectives
    - add Fukuzawa/Ito for Japanese self-understanding
    - use later critical reconstructions without collapsing them into contemporary witness class

