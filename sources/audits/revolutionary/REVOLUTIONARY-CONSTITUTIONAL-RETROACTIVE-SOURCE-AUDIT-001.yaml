layer: revolutionary_and_constitutional_power

current_strengths:
  reflective_witnesses_already_present:
    - Benjamin Franklin, Autobiography
    - The Federalist
    - Edmund Burke, Reflections on the Revolution in France
    - Gouverneur Morris, diary/correspondence witness to revolutionary France
    - Talleyrand, Memoirs
  strength: >-
    The layer already includes civic self-formation, constitutional design,
    conservative criticism, diplomatic eyewitness, and post-festum participant reflection.
    Its defect is that those witnesses are not yet balanced by enough constituent texts,
    losing-side arguments, fiscal statecraft, radical democratic reflection, and later
    participant reconstructions.

