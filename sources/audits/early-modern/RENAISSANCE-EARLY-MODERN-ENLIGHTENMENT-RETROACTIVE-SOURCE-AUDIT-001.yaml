narrative_gate:
  state: NOT_SATISFIED_UNDER_REVISED_METHOD
  reason: >-
    The operational repair is strong, but the reflective and post-festum canon is not
    yet broad enough to interpret the new state, commercial republic, civil war,
    public-credit system and Enlightenment without over-reliance on a small set of thinkers.
  requirements:
    - add Spinoza TTP/TP and Temple for Dutch power
    - add Milton/Harrington and Hobbes Behemoth/Clarendon for English crisis
    - add Petty/Davenant/Locke monetary writings for fiscal-financial power
    - add Vico/Smith/Ferguson to broaden philosophical history and commercial society
    - explicitly link STAR-MONEY and STAR-AGE-OF-INDIVIDUAL interpretations without confusing them with primary evidence
    - test synthesis through Skinner/Pocock/Brewer and rival modern scholarship

