current_strengths:
  operational_core_already_locked:
    witness_count: 9
    witnesses:
      - Defence of the Realm Act 1914
      - British blockade Order in Council 1915
      - Ministry of Munitions Act 1915
      - Munitions of War Act 1915
      - Military Service Act 1916
      - German Auxiliary Service Law 1916
      - British Excess Profits Duty 1916
      - US Committee on Public Information executive order 1917
      - British War Loan Act 1917
  reflective_targets_already_registered:
    - Walther Rathenau KRA writings and memoranda 1914-1915
    - Friedrich Naumann, Mitteleuropa, 1915
    - Max Weber, Parlament und Regierung im neugeordneten Deutschland, 1918
    - Max Weber, Politik als Beruf, 1919
    - J. M. Keynes, Economic Consequences of the Peace, 1919
    - Erich Ludendorff, Meine Kriegserinnerungen, 1919
    - Ernst Jünger, In Stahlgewittern, first edition 1920
    - Paul von Hindenburg, Aus meinem Leben, 1920
    - Winston Churchill, The World Crisis, 1923-1931
  assessment: >-
    The initial legal-administrative core is useful but far from sufficient. Total war
    especially requires reflective witnesses because the meaning of wartime state power
    was contested by industrial organizers, parliamentary critics, revolutionaries,
    soldiers, propagandists, colonial intellectuals and postwar statesmen.

