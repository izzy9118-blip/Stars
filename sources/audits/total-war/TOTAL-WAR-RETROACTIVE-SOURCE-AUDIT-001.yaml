narrative_gate:
  state: NOT_SATISFIED_UNDER_REVISED_METHOD
  reason: >-
    The core statutes establish enlarged wartime jurisdictions, but the layer cannot
    yet explain the mass state without the participant organizers, revolutionaries,
    soldiers, colonial critics, propagandists and post-festum commanders who interpreted it.
  requirements:
    - acquire Rathenau KRA writings and operational KRA records
    - add Naumann/Weber and Wilson
    - add Lenin/Luxemburg plus competing Russian Revolution witnesses
    - add Junger first edition and Barbusse for front experience
    - add Creel/Lippmann for information power
    - add Du Bois and colonial political witnesses
    - add Keynes/Ludendorff/Churchill/Foch as controlled post-festum reconstructions
    - acquire food, occupation, colonial manpower, Brest-Litovsk and Armistice operational records

