cross_repository_reuse:
  finding: >-
    STAR-AGE-OF-INDIVIDUAL-001 already contains a Plato/Aristotle interpretive layer,
    but largely through later Strauss sources. History of Power must link that work as
    interpretation while separately registering Plato's and Aristotle's own Greek texts.

narrative_gate:
  state: NOT_SATISFIED_UNDER_REVISED_METHOD
  requirements:
    - add Athenian tribute lists and imperial decrees
    - add Old Oligarch and Xenophon's Spartan Constitution
    - add Plato Republic and Aristotle Politics/Athenian Constitution
    - explicitly control Thucydidean speech and analytical voice
    - add modern constitutional and social reconstruction through Hansen/Ober/Finley/Cartledge

