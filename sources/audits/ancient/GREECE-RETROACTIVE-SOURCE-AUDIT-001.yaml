  - Cleon_and_Diodotus_are_Thucydidean_presentations_of_debate
  - Corcyra_stasis_analysis_is_Thucydides_reflection_not_neutral_social_science
  - Spartan_law_as_master_is_Herodotean_Demaratus_speech_and_should_be_compared_with_Xenophon_and_institutional_evidence
  - Athenian_empire_as_tribute_system_should_be_tested_against_tribute_lists_and_decrees
  - Greek_freedom_must_not_be_generalized_beyond_citizen_bodies_or_detached_from_slavery_metis_women_and_subject_allies

