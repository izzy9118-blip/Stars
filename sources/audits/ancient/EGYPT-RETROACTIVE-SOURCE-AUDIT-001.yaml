  - intelligence_of_the_heart_as_a_systematic_Egyptian_epistemology
  - distinct_Osirian_and_Horian_paths_as_described_in_current_narrative
  - Egyptian_civilization_as_a_legacy_from_an_older_unknown_civilization
  - Sphinx_weathering_or_Atlantis_as_evidence_for_the_true_age_of_Egypt

claim_control_rule: >-
  These propositions may remain as attributed modern interpretations or open research
  questions only where their primary evidentiary basis is not independently established.
  They may not be stated in the same narrative voice as Pyramid Texts, Egyptian royal
  inscriptions or wisdom literature.

