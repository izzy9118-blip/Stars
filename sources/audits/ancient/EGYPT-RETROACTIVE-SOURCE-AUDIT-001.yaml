narrative_gate:
  state: NOT_SATISFIED_UNDER_REVISED_METHOD
  requirements:
    - acquire/control Manetho transmission
    - acquire Diodorus Book I, Strabo XVII and Plutarch De Iside in governing Greek texts
    - add Neferti, Eloquent Peasant, Loyalist Teaching, Horemheb and Rekhmire records
    - reclassify Schwaller, West and Petrie away from `authoritative_syntheses`
    - test Anthropocosmos/Horian/Osirian/initiation claims against primary evidence and first-class Egyptology
    - add Frankfort, Hornung, Kemp, Assmann and Lichtheim as later critical reconstructions
    - only then recertify the Egyptian narrative

