  - Cicero_mixed_constitution_is_late_Republican_philosophical_reconstruction_not_a_neutral_summary_of_all_Roman_history
  - Tacitus_mixed_constitution_brevity_is_Tacitean_judgment
  - Appian_king_in_fact_description_is_post_festum_analysis
  - Suetonius_household_and_character_material_requires_biographical_source_caution
  - Augustan_restoration_claim_must_be_compared_directly_with_Res_Gestae_and_legal_epigraphic_evidence

