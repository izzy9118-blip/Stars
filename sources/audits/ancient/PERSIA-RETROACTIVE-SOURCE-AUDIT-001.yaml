narrative_gate:
  state: NOT_SATISFIED_UNDER_REVISED_METHOD
  requirements:
    - lock Cyrus Cylinder, Behistun, Persepolis Fortification and Udjahorresnet
    - add at least one Babylonian chronicle and one Aramaic/provincial corpus
    - add Aeschylus, Xenophon Anabasis and Cyropaedia as distinct reflective classes
    - add Briant and Kuhrt as later critical reconstructions
    - reclassify current Herodotean claims explicitly where no Persian corroboration exists

