audit_id: ADMINISTRATIVE-NATIONAL-POWER-RETROACTIVE-SOURCE-AUDIT-001
status: NINETEENTH_CENTURY_OPERATIONAL_CORPUS_STRONG_REFLECTIVE_AND_INDUSTRIAL_CANON_INCOMPLETE
parent_star: STAR-HISTORY-OF-POWER-001
method: sources/SOURCE-WITNESS-METHOD.md
layer: administrative_and_national_power_1798_1871

current_strengths:
  operational_primary_corpus:
    witness_count: 33
    includes:
      - Revolutionary conscription law 1798
      - Constitution Year VIII
      - prefectural and police organization
      - Portalis / Code civil
      - education law and statistical program
      - Napoleonic correspondence
      - roads, cadastre, indirect taxes and Cour des comptes
      - Charters 1814 and 1830
      - Vienna Final Act
      - telegraph law 1837 and railway law 1842
      - Constitution 1848 and abolition of slavery 1848
      - prefectural continuity evidence
      - Prussian Constitution 1850
      - Italian and German unification constitutions
      - Bismarck budget-conflict speech
  reflective_witnesses_already_locked:
    - Hegel, Philosophy of Right 1821
    - Clausewitz, Vom Kriege 1832-1834
    - Tocqueville, Democracy in America 1835/1840
    - Tocqueville, Ancien Régime and the Revolution 1856
  assessment: >-
    Administrative mechanism and constitutional continuity are well documented.
    The major weakness is the absence of enough first-class books that understood
    industrial society, class power, nationality, representative government and the
    revolutionary crises of 1830/1848/1851 while or just after they occurred.

