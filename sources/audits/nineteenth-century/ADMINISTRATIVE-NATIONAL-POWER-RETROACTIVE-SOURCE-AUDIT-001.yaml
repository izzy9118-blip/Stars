narrative_gate:
  state: NOT_SATISFIED_UNDER_REVISED_METHOD
  reason: >-
    The operational state corpus is strong, but the layer currently lacks the books
    through which contemporaries and immediate successors understood industrial capitalism,
    1848, nationalism, representative government and the social consequences of administration.
  requirements:
    - add Constant and Las Cases for post-Napoleonic reflection
    - add Ure/Engels/Marx for industrial society
    - add Marx Eighteenth Brumaire and Tocqueville Souvenirs for 1848/1851
    - add Mill for liberty and representative administration
    - add Fichte/Mazzini/Cavour and Bismarck/Garibaldi for nationality and unification
    - retain Hegel/Clausewitz/Tocqueville as first-class but not exhaustive

