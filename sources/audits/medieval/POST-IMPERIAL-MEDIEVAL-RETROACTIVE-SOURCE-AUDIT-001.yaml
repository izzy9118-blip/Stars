audit_id: POST-IMPERIAL-MEDIEVAL-RETROACTIVE-SOURCE-AUDIT-001
status: MEDIEVAL_LAYER_NARRATIVELY_RICH_INSTITUTIONALLY_UNDERDOCUMENTED
parent_star: STAR-HISTORY-OF-POWER-001
method: sources/SOURCE-WITNESS-METHOD.md
layer: post_imperial_and_medieval_power

current_strengths:
  narrative_and_reflective_witnesses_already_present:
    - Augustine, City of God
    - Hydatius, Chronicle
    - Jordanes, Gothic History
    - Procopius, Wars
    - Gregory of Tours, History of the Franks
    - Bede, Ecclesiastical History
    - Einhard and Notker/St Gall lives of Charlemagne
    - Anglo-Saxon Chronicle
    - Cosmas of Prague, Chronicle of the Czechs
    - Anna Komnene, Alexiad
    - Otto of Freising and Rahewin, Deeds of Frederick Barbarossa
    - Matthew Paris, Chronica Majora
    - Saxo Grammaticus, History of the Danes
    - Froissart, Chronicles
    - Philippe de Commynes, Memoirs
    - Pius II, Commentaries
    - Guicciardini, History of Italy
    - Ibn Khaldun, Muqaddimah
  assessment: >-
    The layer already preserves unusually diverse Christian, Roman, Gothic, Frankish,
    English, Bohemian, Byzantine, German-imperial, monastic, Scandinavian, chivalric,
    diplomatic, papal, Italian and Islamic historical voices. Its weakness is not lack
    of narrative intelligence but the absence of enough legal, fiscal, chartered,
    canonical and communal documents to test the institutional claims made through those narratives.

