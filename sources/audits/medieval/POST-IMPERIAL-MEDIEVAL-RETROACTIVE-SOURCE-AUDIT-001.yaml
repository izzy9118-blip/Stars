subaudit_feudal_urban_estate_and_parliamentary_power:
  finding: >-
    The existing narrative correctly treats overlapping lordship, town, estate and
    parliament as distinct powers, but it needs actual charters and legal records rather than chronicle description alone.
  essential_additions:
    - source_id: SRC-HOP-MAGNA-CARTA-1215
      class: ROYAL_BARONIAL_CHARTER
      importance: taxation_judgment_property_counsel_and_binding_the_king
      priority: ESSENTIAL
