narrative_gate_addition:
  rule: >-
    No History of Power layer may cross its narrative gate unless its own evidentiary
    reconstruction is sound AND its person-power crosswalk has been completed without
    teleology. If no material relation to the bounded older-forces problem can be shown,
    the material belongs in another Star or remains contextual rather than being absorbed
    into History of Power.
